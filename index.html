function mergeHsse(p, fileName){
  const sc = (STATE.data.hsseScores && STATE.data.hsseScores.weeks) ? STATE.data.hsseScores : {weeks:[]};
  const lg = STATE.data.hsseLogs || {};
  p.weeks.forEach(w=>{ const i=sc.weeks.findIndex(x=>x.n===w.n); if(i>-1) sc.weeks[i]=w; else sc.weeks.push(w); });
  sc.weeks.sort((a,b)=>a.n-b.n);
  sc.priority = Object.assign({}, sc.priority||{}, p.priority);
  sc.meta = {file:fileName, at:new Date().toISOString(), weeks:p.weeks.length};
  const upsert=(key,arr,kf)=>{ const cur=lg[key]||[]; arr.forEach(x=>{ const k=kf(x); const i=cur.findIndex(y=>kf(y)===k); if(i>-1) cur[i]=x; else cur.push(x); }); lg[key]=cur; };
  upsert('incidents',p.incidents,x=>[x.date,x.loc,x.type,x.by].join('|'));
  upsert('inspections',p.inspections,x=>[x.date,x.veh,x.drv].join('|'));
  upsert('ppe',p.ppe,x=>[x.period,x.loc,x.type].join('|'));
  upsert('toolbox',p.toolbox,x=>[x.date,x.topic].join('|'));
  upsert('weekly',p.weekly,x=>[x.week,x.date,x.dept].join('|'));
  upsert('monthly',p.monthly,x=>[x.month,x.dept].join('|'));
  ['training','drills','contractors'].forEach(k=>{ if(p[k].length) lg[k]=p[k]; });
  if(p.actions.individual.length||p.actions.category.length||p.actions.monitoring.length) lg.actions=p.actions;
  STATE.data.hsseScores=sc; STATE.data.hsseLogs=lg;
}

// Google Sheets cells hold max ~50,000 characters; keep each stored blob under that.
async function persistHsse(){
  const LIMIT=380000; let trimmed=false;
  const sc=STATE.data.hsseScores;
  while(JSON.stringify(sc).length>LIMIT && sc.weeks.length>1){ sc.weeks.shift(); trimmed=true; }
  const lg=STATE.data.hsseLogs;
  const arrays=['incidents','inspections','ppe','toolbox','weekly','monthly','training'];
  let guard=0;
  while(JSON.stringify(lg).length>LIMIT && guard++<40){
    let big=null; arrays.forEach(k=>{ if((lg[k]||[]).length>1 && (!big || lg[k].length>lg[big].length)) big=k; });
    if(!big) break; lg[big].shift(); trimmed=true;
  }
  await persist('hsseScores'); await persist('hsseLogs');
  if(trimmed) showToast('Oldest HSSE records were trimmed to fit shared storage.');
}

/* ---------------- analysis ---------------- */
function analyzeHsse(){
  const sc=STATE.data.hsseScores||{}, raw=STATE.data.hsseLogs||{};
  const all=[...(sc.weeks||[])].sort((a,b)=>a.n-b.n);
  if(!all.length && !(raw.incidents||[]).length && !(raw.inspections||[]).length) return null;
  // focus defaults to the previous (last completed) Mon–Sun week; its comparison week is the week before it
  const autoN=ordOf(prevWeekStart()), sel=STATE.hsseWeek, wantN=(sel==null)?autoN:sel;
  let latest=wantN==='ALL'?(all[all.length-1]||null):(all.find(w=>w.n===wantN)||null), fallback=false;
  if(!latest && sel==null && all.length){ latest=all[all.length-1]; fallback=true; }
  const weeks=latest?all.filter(w=>w.n<=latest.n):[];
  const prev=(latest&&wantN!=='ALL')?(all.find(w=>w.n===latest.n-1)||null):(latest?all.find(w=>w.n===latest.n-1)||null:null);
  const fs=wantN==='ALL'?null:((latest&&latest.start)||(wantN>1000?startOfOrd(wantN):null));
  const inW=iso=>!!iso&&iso>=fs&&iso<=addDays(fs,6);
  const lg=fs?Object.assign({},raw,{
    incidents:(raw.incidents||[]).filter(i=>inW(i.iso)||(i.iso&&i.iso<fs&&/open|pending|progress/i.test(i.status))),
    inspections:(raw.inspections||[]).filter(x=>inW(x.iso)),
    ppe:(raw.ppe||[]).filter(x=>inW(parseLooseDate(x.period))),
    toolbox:(raw.toolbox||[]).filter(x=>inW(x.iso)),
    weekly:(raw.weekly||[]).filter(x=>inW(parseLooseDate(x.date)))}):raw;
  const focus={latest,prev,autoN,fallback,start:fs,scoped:!!fs};
  const reg=[];
  const find=nm=>reg.find(r=>r.names.some(x=>sameDriver(x,nm)));
  const ensure=(nm,tele)=>{ let r=find(nm); if(!r){ r={name:String(nm).toUpperCase().replace(/\s+/g,' ').trim(),names:[nm],perWeek:{},inc:[],insp:[],tele:!!tele}; reg.push(r); } else if(!r.names.includes(nm)) r.names.push(nm); if(tele) r.tele=true; return r; };
  weeks.forEach(w=>(w.drivers||[]).forEach(d=>{ ensure(d.n,true).perWeek[w.n]=d; }));
  (lg.incidents||[]).forEach(i=>{ const nm=String(i.by||'').replace(/\(.*?\)/g,'').trim(); if(nm) ensure(nm,false).inc.push(i); });
  (lg.inspections||[]).forEach(x=>{ if(x.drv) ensure(x.drv,false).insp.push(x); });

  const SEVPTS=s=>/fatal|critical/i.test(s)?25:/major|serious/i.test(s)?15:/minor/i.test(s)?8:4;
  const profiles=reg.map(r=>{
    const present=weeks.filter(w=>r.perWeek[w.n]).map(w=>({n:w.n,label:w.label||('Week '+w.n),t:r.perWeek[w.n].t||0,d:r.perWeek[w.n].d||0,v:r.perWeek[w.n].v||[]}));
    const cur=latest?r.perWeek[latest.n]:null, pv=prev?r.perWeek[prev.n]:null;
    const last=present.length?present[present.length-1]:null;
    const score=last?last.t:0, active=!!cur; const isNA=!!(cur&&cur.na);
    let trend='—', delta=null;
    if(r.tele){ if(!cur) trend='Inactive'; else if(!pv) trend='New'; else { delta=cur.t-pv.t; trend=delta>0.5?'Worsened':delta<-0.5?'Improved':'Stable'; } }
    const amberWeeks=present.filter(p=>p.t>=2).length, redWeeks=present.filter(p=>p.t>=5).length;
    let consecRed=false; for(let i=1;i<present.length;i++){ if(present[i].t>=5&&present[i-1].t>=5&&present[i].n-present[i-1].n===1) consecRed=true; }
    const pr=(sc.priority||{})[normName(r.name)]||null;
    const repeat=consecRed||!!(pr&&pr.rep);
    const viol=(active&&cur.v)?cur.v:((last&&last.v)||[]);
    const issues=[]; r.insp.forEach(x=>inspectionIssues(x).forEach(k=>issues.push({k,veh:x.veh,date:x.date})));
    const parts={
      telematics:r.tele?Math.min(50,score*50/7):0,
      persistence:present.length?amberWeeks/present.length*20:0,
      trend:trend==='Worsened'?(delta>3?10:6):0,
      repeat:repeat?10:0,
      violations:Math.min(5,viol.length*2),
      incidents:Math.min(25,r.inc.reduce((a,i)=>a+SEVPTS(i.sev),0)),
      inspection:Math.min(5,issues.length)
    };
    const rating=Math.min(100,Math.round(Object.values(parts).reduce((a,b)=>a+b,0)));
    const tier=rating>=60?'CRITICAL':rating>=40?'HIGH':rating>=20?'MODERATE':'LOW';
    return {key:normName(r.name),name:r.name,tele:r.tele,active,score,band:r.tele?(isNA?'NA':bandOf(score)):null,chk:!!(cur&&cur.chk),trend,delta,present,
      avg:present.length?present.reduce((a,p)=>a+p.t,0)/present.length:0,
      dist:cur?(cur.d||0):(last?last.d||0:0),amberWeeks,redWeeks,repeat,viol,incidents:r.inc,issues,inspections:r.insp,parts,rating,tier,lastWeek:last?last.n:null};
  });
  profiles.sort((a,b)=>b.rating-a.rating||b.score-a.score);
  const activeP=profiles.filter(p=>p.tele&&p.active);

  const assess=w=>(w.drivers||[]).filter(d=>!d.na); const countBand=w=>{ const c={RED:0,AMBER:0,GREEN:0}; assess(w).forEach(d=>c[bandOf(d.t||0)]++); return c; };
  const weekStats=weeks.map(w=>({n:w.n,label:w.label||('Week '+w.n),range:w.range||'',count:assess(w).length,avg:assess(w).length?assess(w).reduce((a,d)=>a+(d.t||0),0)/assess(w).length:0,bands:countBand(w)}));

  const vCounts={HB:0,HA:0,OS:0,HOS:0}; let vSource='telematics flags';
  activeP.forEach(p=>p.viol.forEach(k=>{ if(vCounts[k]!==undefined) vCounts[k]++; }));
  if(!Object.values(vCounts).some(x=>x>0)){
    ((lg.actions&&lg.actions.category)||[]).forEach(c=>{ const k=/brak/i.test(c.cat)?'HB':/accel/i.test(c.cat)?'HA':/speed/i.test(c.cat)?'OS':/hos/i.test(c.cat)?'HOS':null; if(k&&c.drivers) vCounts[k]=c.drivers; });
    vSource='action plan';
  }
  const violators=activeP.filter(p=>p.viol.length).sort((a,b)=>b.score-a.score);

  const inc=lg.incidents||[];
  const tally=(arr,f)=>{ const m={}; arr.forEach(x=>{ const k=f(x)||'Unspecified'; m[k]=(m[k]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const incStats={total:inc.length,open:inc.filter(i=>/open|pending|progress/i.test(i.status)).length,major:inc.filter(i=>/major|serious|fatal|critical/i.test(i.sev)).length,byType:tally(inc,i=>i.type),bySev:tally(inc,i=>i.sev),byStatus:tally(inc,i=>i.status)};
  const themes=[]; [['Poor following distance / rear-end / sudden stop',/following distance|tailgat|rear.?end|sudden(ly)? stop/i,'HB'],['Fatigue / alertness',/fatigue|tired|drows|sleep/i,'HOS'],['Speed',/speed/i,'OS'],['Scanning / anticipation / distraction',/scanning|anticipat|distract|inattent/i,null]].forEach(([name,re,link])=>{ const n=inc.filter(i=>re.test([i.root,i.desc].join(' '))).length; if(n) themes.push({name,n,link}); });

  const insp=lg.inspections||[]; const ic={}; let withIssue=0;
  insp.forEach(x=>{ const is=inspectionIssues(x); if(is.length) withIssue++; is.forEach(k=>{ ic[k]=(ic[k]||0)+1; }); });
  const ppe=lg.ppe||[], ppeFail=ppe.filter(x=>/fail|non|^no/i.test(x.status));
  const toolbox=lg.toolbox||[], tbAttend=toolbox.reduce((a,t)=>a+(t.att||0),0);
  const tr=lg.training||[]; const trMap={}; tr.forEach(t=>{ trMap[normName(t.n)]=trMap[normName(t.n)]||{n:t.n,dept:t.dept,has:false}; if(t.type) trMap[normName(t.n)].has=true; });
  const training={total:Object.keys(trMap).length,trained:Object.values(trMap).filter(x=>x.has).length,untrained:Object.values(trMap).filter(x=>!x.has)};

  const A={focus,weeks,latest,prev,weekStats,profiles,activeP,vCounts,vSource,violators,incStats,themes,insp,ic,withIssue,ppe,ppeFail,toolbox,tbAttend,training,lg,sc};
  A.insights=buildHsseInsights(A);
  return A;
}

function driverRecs(p){
  const r=[];
  if(p.band==='RED'||p.tier==='CRITICAL') r.push((p.repeat?'URGENT — repeat RED-band driver: ':'')+'hold a one-on-one counselling with the Fleet Safety Officer within 48 hours and agree a written improvement plan.');
  p.viol.forEach(k=>{ if(HSSE_CATREC[k]) r.push(HSSE_VIOL[k]+': '+HSSE_CATREC[k]); });
  if(p.repeat) r.push('Consider a ride-along assessment and a temporary restriction from long-haul / night trips until the score is below 5.0.');
  if(p.tele&&!p.active&&p.score>=5) r.push('Not on the latest roster — confirm status and require a re-assessment before reassigning to a truck.');
  if(p.delta!==null&&p.delta>=3) r.push('Score jumped by '+fmt(p.delta,1)+' week-on-week — investigate what changed (route, vehicle, roster, rest periods).');
  p.incidents.forEach(i=>r.push('Incident #'+i.id+' ('+i.type+(i.sev?', '+i.sev:'')+', '+(i.status||'status n/a')+'): '+(i.act||'complete the investigation')+'.'));
  const ik=[...new Set(p.issues.map(x=>x.k))];
  if(ik.length) r.push('Vehicle equipment gaps on trucks driven ('+[...new Set(p.issues.map(x=>x.veh))].join(', ')+'): '+ik.map(k=>HSSE_INSP_LABELS[k].toLowerCase()).join('; ')+' — rectify before the next dispatch.');
  if(p.band==='GREEN'&&p.trend==='Improved') r.push('Recognise the improvement and keep the coaching cadence.');
  if(!r.length) r.push('No action needed — maintain current performance.');
  if(p.band==='RED') r.push('Target: total score below 5.0 by the next scorecard, then below 2.0.');
  else if(p.band==='AMBER') r.push('Target: total score below 2.0 by the next scorecard.');
  return r;
}

function buildHsseInsights(A){
  const I=[]; const push=(sev,title,text)=>I.push({sev,title,text});
  const ws=A.weekStats, wl=ws[ws.length-1], wp=wl?(ws.find(w=>w.n===wl.n-1)||null):null;
  const names=(arr,n)=>arr.slice(0,n||4).map(p=>p.name+' ('+fmt(p.score,1)+')').join(', ');
  if(wl && wp){
    const d=wl.avg-wp.avg;
    const redUp=wl.bands.RED>wp.bands.RED;
    push(redUp||d>0.2?'red':(d<-0.2?'green':'amber'),'Fleet driver-risk trend',
      `Fleet average score ${d<-0.05?'improved':d>0.05?'worsened':'held steady'}: ${fmt(wp.avg,2)} in ${wp.label} → ${fmt(wl.avg,2)} in ${wl.label}. RED-band drivers ${wp.bands.RED} → ${wl.bands.RED}, AMBER ${wp.bands.AMBER} → ${wl.bands.AMBER}, GREEN ${wp.bands.GREEN} → ${wl.bands.GREEN}.`+(redUp?' More drivers are in the RED band than last week, so overall improvement should not be taken as a sign the risk is shrinking.':''));
  } else if(wl){
    push('amber','Fleet snapshot',`${wl.label}: ${wl.count} drivers scored, fleet average ${fmt(wl.avg,2)} — ${wl.bands.RED} RED, ${wl.bands.AMBER} AMBER, ${wl.bands.GREEN} GREEN. No scorecard was uploaded for the week before, so trend analysis is unavailable.`);
  }
  const crit=A.activeP.filter(p=>p.tier==='CRITICAL');
  const rep=crit.filter(p=>p.repeat);
  if(rep.length) push('red','Repeat high-risk drivers — urgent',`${names(rep)} have been in the RED band in consecutive weeks. Counselling alone has not shifted behaviour: escalate to ride-along assessments and restrict long-haul / night assignments until the score drops below 5.0.`);
  const other=crit.filter(p=>!p.repeat);
  if(other.length) push('red','Critical-rated drivers',`${names(other)} are rated CRITICAL on the combined risk rating (telematics score, persistence, trend, violations, incidents and vehicle checks). Hold counselling sessions within 48 hours and agree written improvement plans.`);
  const inactive=A.profiles.filter(p=>p.tele&&!p.active&&p.score>=5);
  if(inactive.length) push('red','High-risk drivers missing from the latest roster',`${names(inactive)} scored RED in their last active week and did not appear in ${wl?wl.label:'the latest week'}. Confirm their status and require re-assessment before they are reassigned to a truck.`);
  const watch=A.activeP.filter(p=>p.score>=3.5&&p.score<5&&p.trend==='Worsened');
  if(watch.length) push('amber','Early warning — about to turn RED',`${names(watch)} are rising and within 1.5 points of the RED threshold. Intervene now with coaching on their main violation category before they cross 5.0.`);
  const jumps=A.activeP.filter(p=>p.delta!==null&&p.delta>=3).sort((a,b)=>b.delta-a.delta);
  if(jumps.length) push('amber','Sharpest week-on-week deteriorations',`${jumps.slice(0,4).map(p=>p.name+' (+'+fmt(p.delta,1)+')').join(', ')}. Large one-week jumps usually point to a trigger — a new route, an unfamiliar truck, back-to-back trips or reduced rest — rather than a sudden change in attitude.`);
  const vc=Object.entries(A.vCounts).sort((a,b)=>b[1]-a[1]); const nv=A.violators.length||A.activeP.filter(p=>p.score>0).length;
  if(vc.length && vc[0][1]>0){
    const [k,n]=vc[0]; const share=nv?Math.round(n/nv*100):0;
    push(share>=50?'red':'amber','Dominant violation: '+HSSE_VIOL[k],`${n} drivers${nv?` (${share}% of those with violations)`:''} were flagged for ${HSSE_VIOL[k].toLowerCase()} (source: ${A.vSource}). ${share>=50?'When more than half of the violators share one category the cause is usually systemic rather than individual — ':''}${HSSE_CATREC[k]}`);
    const others=vc.slice(1).filter(x=>x[1]>0).map(x=>HSSE_VIOL[x[0]]+' '+x[1]).join(', ');
    if(others) push('amber','Other violation categories',others+'. Handle these with the category actions below rather than blanket coaching.');
  }
  A.themes.filter(t=>t.link&&A.vCounts[t.link]>0).forEach(t=>push('red','Incident root causes match the telematics data',`${t.n} of ${A.incStats.total} recorded incident(s) cite “${t.name.toLowerCase()}”, and ${A.vCounts[t.link]} drivers are currently flagged for ${HSSE_VIOL[t.link].toLowerCase()}. The same behaviours that are producing alerts are already producing collisions — prioritise this category.`));
  const better=A.activeP.filter(p=>p.trend==='Improved'&&p.band==='GREEN'&&p.present.length>1&&p.present[p.present.length-2].t>=2);
  if(better.length) push('green','Improvements to recognise',`${better.slice(0,5).map(p=>p.name+' ('+fmt(p.present[p.present.length-2].t,1)+' → '+fmt(p.score,1)+')').join(', ')} moved from AMBER/RED to GREEN. Recognise them; also check whether low distance flatters the score (${better.filter(p=>p.dist<50).map(p=>p.name).join(', ')||'none under 50 km'}).`);
  const s=A.incStats;
  if(s.total) push(s.open&&s.major?'red':(s.open?'amber':'green'),'Incident status',`${s.total} incident(s) recorded, ${s.major} major, ${s.open} still open.${s.open?' Close out open items — the register shows corrective actions (e.g. retraining) that have not yet been completed.':''}`);
  if(A.insp.length){
    const top=Object.entries(A.ic).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,n])=>HSSE_INSP_LABELS[k].toLowerCase()+' ('+n+')').join(', ');
    const rate=Math.round(A.withIssue/A.insp.length*100);
    push(rate>=50?'red':'amber','Vehicle equipment compliance',`${A.withIssue} of ${A.insp.length} vehicle inspection records (${rate}%) show at least one equipment or condition gap${top?'; most common: '+top:''}. Block dispatch until wedges, jacks and fire extinguishers are in place, and make drivers sign for the kit on their truck.`);
  }
  if(A.ppeFail.length) push('amber','PPE non-compliance',`${A.ppeFail.length} PPE failure(s) logged (${[...new Set(A.ppeFail.map(x=>x.type))].join(', ')}). Enforce use at the yard and supply missing items.`);
  if(A.toolbox.length){
    const cover=A.toolbox.map(t=>t.topic).join('; ');
    push('green','Toolbox talks',`${A.toolbox.length} session(s) with ${A.tbAttend} total attendance (${cover}). ${/follow|brak/i.test(cover)?'A following-distance campaign has run — compare harsh-braking counts in the next scorecards to measure whether it worked.':'Add a session on the dominant violation category.'}`);
  }
  if(A.training.total) push(A.training.untrained.length?'amber':'green','Training coverage',`${A.training.trained} of ${A.training.total} listed staff have a training record${A.training.untrained.length?'; no record for '+A.training.untrained.slice(0,5).map(x=>x.n).join(', ')+(A.training.untrained.length>5?'…':''):''}.`);
  const obs=(A.lg.weekly||[]).filter(w=>w.acts||w.cond);
  if(obs.length) push('amber','Unsafe acts and conditions reported',obs.slice(0,3).map(w=>[w.acts&&('Act: '+w.acts),w.cond&&('Condition: '+w.cond)].filter(Boolean).join(' · ')).join(' | '));
  const order={red:0,amber:1,green:2}; I.sort((a,b)=>order[a.sev]-order[b.sev]);
  return I;
}

/* ---------------- chart helpers ---------------- */
function hbarChart(items,o){
  o=o||{}; if(!items.length) return '<div class="dim small">No data.</div>';
  const max=o.max||Math.max(...items.map(i=>i.value),1)*1.1;
  const marks=(o.marks||[]).map(m=>`<div class="hb-mark" style="left:${Math.min(100,m.v/max*100)}%" title="${esc(m.label||'')}"></div>`).join('');
  return `<div class="hb-chart">${items.map(i=>`<div class="hb-row"${i.click?` ${o.clickAttr||'data-driver-detail'}="${esc(i.click)}" style="cursor:pointer"`:''}><div class="hb-name" title="${esc(i.label)}">${esc(i.label)}</div><div class="hb-track"><div class="hb-fill" style="width:${Math.max(i.value>0?1.5:0,i.value/max*100)}%;background:${i.color||'var(--amber)'}"></div>${marks}</div><div class="hb-val mono">${esc(i.text!==undefined?i.text:fmt(i.value,o.dec||0))}</div></div>`).join('')}</div>`;
}
function vbarChart(items,o){
  o=o||{}; if(!items.length) return '<div class="dim small">No data.</div>';
  const max=Math.max(...items.map(i=>i.value),0.0001)*1.15; const dec=o.dec===undefined?1:o.dec;
  return `<div class="vb-chart">${items.map(i=>`<div class="vb-col"><div class="vb-val mono">${fmt(i.value,dec)}</div><div class="vb-bar-wrap"><div class="vb-bar" style="height:${Math.max(i.value>0?2:0,i.value/max*100)}%;background:${i.color||'var(--amber)'}"></div></div><div class="vb-lab" title="${esc(i.sub||i.label)}">${esc(i.label)}</div></div>`).join('')}</div>`;
}
function stackRows(rows){
  return `<div class="hb-chart">${rows.map(r=>{ const tot=r.segs.reduce((a,s)=>a+s.v,0); return `<div class="hb-row"><div class="hb-name">${esc(r.label)}</div><div class="hb-track stack">${r.segs.map(s=>s.v>0?`<div class="stack-seg" style="width:${s.v/tot*100}%;background:${s.color}" title="${esc(s.name)}: ${s.v}">${s.v}</div>`:'').join('')}</div><div class="hb-val mono">${tot}</div></div>`; }).join('')}</div><div class="dim small flex gap8" style="margin-top:8px;"><span class="legend-dot" style="background:var(--red);margin-left:0"></span>RED <span class="legend-dot" style="background:var(--amber)"></span>AMBER <span class="legend-dot" style="background:var(--green)"></span>GREEN</div>`;
}

function hsseOverview(A){
  const ws=A.weekStats, wl=ws[ws.length-1], wp=wl?(ws.find(w=>w.n===wl.n-1)||null):null;
  const d=wl&&wp?wl.avg-wp.avg:null;
  const lead=A.activeP.slice().sort((a,b)=>b.score-a.score).slice(0,10);
  const cards=`<div class="grid cols-4">
    ${kc('Drivers Scored',wl?wl.count:0,wl?wl.label+(wl.range?' · '+esc(wl.range):''):'')}
    ${kc('RED — High Risk',wl?wl.bands.RED:0,wp?'Previous week: '+wp.bands.RED:'Score ≥ 5.0',wl&&wl.bands.RED>0?'red':'green',wl&&wl.bands.RED>0?'Action':'Clear')}
    ${kc('AMBER — Moderate',wl?wl.bands.AMBER:0,wp?'Previous week: '+wp.bands.AMBER:'Score 2.0 – 4.99','amber','Watch')}
    ${kc('GREEN — Low Risk',wl?wl.bands.GREEN:0,wp?'Previous week: '+wp.bands.GREEN:'Score < 2.0','green','OK')}
    ${kc('Fleet Avg Score',wl?fmt(wl.avg,2):'—',wp?'Previous: '+fmt(wp.avg,2):'',d===null?null:(d<=0?'green':'red'),d===null?'':(d<=0?'Improved':'Worsened'))}
    ${kc('Drivers with Violations',A.violators.length,'Latest week')}
    ${kc('Incidents',A.incStats.total,`${A.incStats.open} open · ${A.incStats.major} major`,A.incStats.open?'amber':null,'Open items')}
    ${kc('Vehicle Check Gaps',A.insp.length?Math.round(A.withIssue/A.insp.length*100)+'%':'—',`${A.withIssue} of ${A.insp.length} inspections`,A.insp.length&&A.withIssue/A.insp.length>=0.5?'red':null,'High')}
  </div>`;
  const trend=vbarChart(ws.map(w=>({label:w.label,sub:w.range,value:w.avg,color:bandOf(w.avg)==='GREEN'?'var(--green)':BAND_COLOR[bandOf(w.avg)]})),{dec:2});
  const bands=stackRows(ws.map(w=>({label:w.label,segs:[{v:w.bands.RED,color:'var(--red)',name:'RED'},{v:w.bands.AMBER,color:'var(--amber)',name:'AMBER'},{v:w.bands.GREEN,color:'var(--green)',name:'GREEN'}]})));
  const viol=hbarChart(Object.entries(A.vCounts).sort((a,b)=>b[1]-a[1]).map(([k,n])=>({label:HSSE_VIOL[k],value:n,color:'var(--amber)'})));
  const top=hbarChart(lead.map(p=>({label:p.name,value:p.score,text:fmt(p.score,2),color:BAND_COLOR[p.band],click:p.key})),{dec:2,marks:[{v:2,label:'AMBER ≥ 2.0'},{v:5,label:'RED ≥ 5.0'}]});
  return cards+hsseCompare(A)+hsseBestWorst(A)+`<div class="grid cols-2" style="margin-top:14px;">
    ${chartCard('Fleet average score by week','Lower is better. Colour follows the risk band of the average.',trend)}

    ${chartCard('Top 10 drivers by score — '+(wl?esc(wl.label):''),'Dashed lines mark the AMBER (2.0) and RED (5.0) thresholds. Click a bar for the driver profile.',top)}
  </div>`;
}

async function handleHsseFile(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ STATE.hsseMsg={t:'err',m:'The spreadsheet reader could not be loaded (check your internet connection) — reload the page and try again.'}; render(); return; }
  STATE.hsseMsg={t:'info',m:'Reading '+file.name+'…'}; render();
  try{
    const buf=file.arrayBuffer?await file.arrayBuffer():await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsArrayBuffer(file); });
    const wb=XLSX.read(buf,{type:'array'});
    const p=parseHsseWorkbook(wb,file.name);
    const found=p.weeks.length+p.incidents.length+p.inspections.length+p.ppe.length+p.toolbox.length+p.weekly.length;
    if(!found){ STATE.hsseMsg={t:'err',m:'No HSSE data was recognised in '+file.name+'. Expected sheets such as "Week N Raw (…)", "Incident Register", "Vehicle HSSE Inspection".'}; render(); return; }
    mergeHsse(p,file.name);
    let cmpMsg=''; if(p.weeks.length){ const nn=Math.max(...p.weeks.map(w=>w.n)); STATE.hsseWeek=(nn===ordOf(prevWeekStart()))?null:nn; STATE.hsseTab='overview'; const ws=STATE.data.hsseScores.weeks; const cw=ws.find(w=>w.n===nn), pw=ws.find(w=>w.n===nn-1); cmpMsg=' Showing '+wkLabel(cw)+(pw?' compared with '+wkLabel(pw)+'.':' — no earlier week is stored yet to compare with.'); }
    STATE.hsseMsg={t:p.weeks.length?'ok':'err',m:(p.weeks.length?'':'⚠ No driver scorecard was found in this workbook, so no driver scores were added. Check that it has a sheet with a "Driver" column and a "Distance (km)" column. ')+`Loaded from ${file.name}: ${p.weeks.length} weekly scorecard(s) (${p.weeks.reduce((a,w)=>a+w.drivers.length,0)} driver rows), ${p.incidents.length} incident(s), ${p.inspections.length} vehicle inspection(s), ${p.ppe.length} PPE check(s), ${p.toolbox.length} toolbox talk(s).`+cmpMsg+((p.notes&&p.notes.length)?' '+p.notes.join(' '):'')};
    await persistHsse();
    showToast('HSSE report uploaded and synced.');
  }catch(e){ console.error(e); STATE.hsseMsg={t:'err',m:'Could not read that file: '+(e&&e.message?e.message:e)}; render(); }
}

function daysAgo(dateStr){ if(!dateStr) return 99999; const d=new Date(dateStr+'T00:00:00'); const n=new Date(); n.setHours(0,0,0,0); return Math.round((n-d)/86400000); }

/* ---------------- target vs actual: Today / Week / Month bar charts (reusable) ---------------- */
function kpiFmtValue(k,v){ if(v===null||v===undefined||isNaN(v)) return '—'; return k.fmt==='pct'? pct(v) : fmt(v,k.fmt===undefined?0:k.fmt)+(k.unit?' '+k.unit:''); }
function kpiPeriodSection(getSets,note){
  const periods=[['lastweek','Last Week'],['prevweek','Week Before'],['week','This Week'],['lastmonth','Last Month']];
  const sets=periods.map(([p,l])=>Object.assign({p,l},getSets(p)));
  const base=sets[0].kpis;
  const rows=base.map((k0,i)=>{
    const cells=sets.map(s=>{
      const k=s.kpis[i]; const raw=k.ratio; let r=null,label='no data',cls='grey';
      if(s.hasData){
        if(raw===null||raw===undefined||isNaN(raw)){ label='no target'; }
        else if(!isFinite(raw)){ r=1.5; label='✓ met'; cls='green'; }
        else { r=Math.min(raw,1.5); label=raw>1.5?'150%+':Math.round(raw*100)+'%'; cls=statusOf(raw); }
      }

  const c=dayChecks(vid,date).filter(r=>r.type===type).sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));
  if(!c.length) return 'Missing';
  return c[c.length-1].result==='Fail'?'Fail':'Pass';

function checkTag(s){ return `<span class="tag ${s==='Pass'?'green':s==='Fail'?'red':'amber'}">${s==='Missing'?'Missing':s}</span>`; }
function finalizeFuelEntry(rec){ delete rec.alsoIssue; return false; }
function finalizeCheck(rec){
  const items=rec.type==='Pre-Trip'?PRE_ITEMS:POST_ITEMS;
  const bad=items.filter(([k])=>rec['c_'+k]==='Defect').map(i=>i[0]);
  Object.keys(rec).forEach(k=>{ if(k.indexOf('c_')===0) delete rec[k]; });
  if(rec.type!=='Pre-Trip') delete rec.alcoholTest;
  const alcFail=rec.type==='Pre-Trip'&&rec.alcoholTest==='No';
  rec.result=(bad.length||alcFail)?'Fail':'Pass';
  if(bad.length) rec.defects=bad.join(',');
  return compactRec(rec);
}

/* ---------------- maintenance inspections (linked to Inspections + Maintenance) ---------------- */
function jobFor(srcId,item){ return (STATE.data.maintenance||[]).find(m=>m.srcId===srcId && m.srcItem===item); }
function raiseInspectionJobs(rec){
  const already=splitKeys(rec.raised); let n=0;
  splitKeys(rec.def).forEach(k=>{
    if(already.indexOf(k)>-1) return;
    const it=MI_ITEMS.find(x=>x[0]===k); if(!it) return;
    STATE.data.maintenance=[...STATE.data.maintenance,{id:uid(),date:todayStr(),vehicleId:rec.vehicleId,type:'Breakdown',component:it[2],status:'Open',source:'Inspection',srcId:rec.id,srcItem:k,
      notes:`Maintenance inspection (${rec.date}, ${rec.inspector||'inspector'}): ${it[1]} — defective`+(rec.findings?` — ${rec.findings}`:'')}];
    already.push(k); n++;
  });
  rec.raised=already.join(','); if(!rec.raised) delete rec.raised;
  return n;
}
function finalizeMaintInspection(rec){
  const att=[],def=[],crit=[];
  MI_ITEMS.forEach(([k,l,comp,c])=>{ const v=rec['i_'+k]; if(v==='Attention') att.push(k); else if(v==='Defective'){ def.push(k); if(c) crit.push(k); } delete rec['i_'+k]; });
  if(att.length) rec.att=att.join(',');
  if(def.length) rec.def=def.join(',');
  rec.crit=String(crit.length);
  rec.outcome=(crit.length||rec.truckStatus==='Off road')?'Fail':((att.length||def.length)?'Pass with defects':'Pass');
  const auto=rec.autoRaise==='on'; delete rec.autoRaise;
  compactRec(rec);
  return (auto&&def.length)?raiseInspectionJobs(rec):0;
}
function latestInspection(vid){
  let best=null; (STATE.data.maintInspections||[]).forEach(r=>{ if(r.vehicleId!==vid) return; if(!best||r.date>=best.date) best=r; }); return best;
}
function truckOpenDefects(vid){
  const li=latestInspection(vid); const out={insp:li,defective:[],attention:[],driver:[]};
  if(li){
    splitKeys(li.def).forEach(k=>{ const j=jobFor(li.id,k); if(!j || j.status==='Open') out.defective.push(k); });
    splitKeys(li.att).forEach(k=>out.attention.push(k));
  }
  out.driver=(STATE.data.pretrip||[]).filter(r=>r.vehicleId===vid && r.result==='Fail' && r.defects && !r.raised && daysAgo(r.date)<=14);
  return out;
}
function trucksInspectedMaint(dailyRecs,miRecs){
  const manual={}; (dailyRecs||[]).forEach(r=>{ manual[r.date]=(manual[r.date]||0)+num(r.trucksInspected); });
  const form={}; (miRecs||[]).forEach(r=>{ (form[r.date]=form[r.date]||new Set()).add(r.vehicleId); });
  const dates=new Set([...Object.keys(manual),...Object.keys(form)]); let t=0;
  dates.forEach(d=>{ t+=Math.max(manual[d]||0, form[d]?form[d].size:0); });
  return t;
}

/* ---------------- repair analysis & truck risk ratings ---------------- */
function windowFilter(recs,days){ if(!days) return recs; return recs.filter(r=>{ const d=daysAgo(r.date); return d>=0 && d<days; }); }
function lastMonths(n){
  const out=[]; const t=new Date(); t.setDate(1);
  for(let i=n-1;i>=0;i--){ const x=new Date(t.getFullYear(),t.getMonth()-i,1); out.push({key:x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'),label:x.toLocaleString(undefined,{month:'short'})}); }
  return out;
}
function tierOf(rating){ return rating>=60?'CRITICAL':rating>=40?'HIGH':rating>=20?'MODERATE':'LOW'; }
function analyzeMaintenance(days){
  const vehicles=STATE.data.vehicles||[]; const all=STATE.data.maintenance||[];
  const recs=windowFilter(all,days);
  const prevRecs=days?all.filter(r=>{ const d=daysAgo(r.date); return d>=days && d<2*days; }):[];
  const isRepair=r=>r.type==='Breakdown'||r.type==='Repair';
  const repairs=recs.filter(isRepair); const prevRepairs=prevRecs.filter(isRepair).length;
  const breakdowns=repairs;   // repairs are treated as breakdowns
  const scheduled=recs.filter(r=>r.type==='Scheduled');
  const downtime=repairs.reduce((a,r)=>a+num(r.downtimeHours),0);
  const bdWithDowntime=breakdowns.filter(r=>isRepairJob(r)&&num(r.downtimeHours)>0);
  const mttr=bdWithDowntime.length?bdWithDowntime.reduce((a,r)=>a+num(r.downtimeHours),0)/bdWithDowntime.length:0;
  const cost=recs.reduce((a,r)=>a+num(r.cost),0);
  const byComp={}; repairs.forEach(r=>{ const c=r.component||'Unspecified'; byComp[c]=(byComp[c]||0)+1; });
  const compCost={}; recs.forEach(r=>{ if(num(r.cost)>0){ const c=r.component||'Unspecified'; compCost[c]=(compCost[c]||0)+num(r.cost); } });
  const months=lastMonths(6).map(m=>{ const inM=all.filter(r=>String(r.date||'').slice(0,7)===m.key); return {label:m.label,key:m.key,repairs:inM.filter(isRepair).length,scheduled:inM.filter(r=>r.type==='Scheduled').length,downtime:inM.filter(isRepair).reduce((a,r)=>a+num(r.downtimeHours),0)}; });
  const profiles=vehicles.map(v=>{
    const rs=repairs.filter(r=>r.vehicleId===v.id).sort((a,b)=>a.date<b.date?-1:1);
    const bd=rs.length;
    const sch=scheduled.filter(r=>r.vehicleId===v.id).length;
    const dt=rs.reduce((a,r)=>a+num(r.downtimeHours),0);
    const cst=recs.filter(r=>r.vehicleId===v.id).reduce((a,r)=>a+num(r.cost),0);
    const comp={}; rs.forEach(r=>{ const c=r.component||'Unspecified'; comp[c]=(comp[c]||0)+1; });
    const named=Object.entries(comp).filter(([c])=>c!=='Unspecified').sort((a,b)=>b[1]-a[1]);
    const chronic=named.filter(([,n])=>n>=3), repeat=named.filter(([,n])=>n===2);
    let gap=null; if(rs.length>1){ const g=[]; for(let i=1;i<rs.length;i++) g.push((new Date(rs[i].date)-new Date(rs[i-1].date))/86400000); gap=g.reduce((a,b)=>a+b,0)/g.length; }
    const service=maintenanceStatusForVehicle(v);
    const defects=truckOpenDefects(v.id);
    const critOpen=defects.defective.filter(k=>MI_CRIT.has(k)).length;
    const openJobs=all.filter(m=>m.vehicleId===v.id && m.status==='Open').length;
    const parts={
      service: service.status==='red'?25:service.status==='amber'?10:0,
      frequency: Math.min(20,rs.length*5),
      breakdowns: Math.min(15,bd*5),
      chronic: chronic.length?15:(repeat.length?8:0),
      downtime: Math.min(10,dt/5),
      defects: Math.min(10,critOpen*5+(defects.defective.length-critOpen)*2+defects.attention.length),
      driverReported: Math.min(5,defects.driver.length*2.5),
    };
    const rating=Math.min(100,Math.round(Object.values(parts).reduce((a,b)=>a+b,0)));
    const li=defects.insp;
    return {vehicleId:v.id,regNo:v.regNo,model:v.model||'',repairs:rs.length,breakdowns:bd,scheduled:sch,downtime:dt,cost:cst,comp,topComp:named.length?named[0][0]:(Object.keys(comp)[0]||'—'),chronic,repeat,gap,
      lastRepair:rs.length?rs[rs.length-1].date:null,service,defects,openJobs,lastInspection:li,parts,rating,tier:tierOf(rating),records:rs};
  }).sort((a,b)=>b.rating-a.rating||b.repairs-a.repairs);
  const openJobsAll=all.filter(m=>m.status==='Open').sort((a,b)=>a.date<b.date?-1:1);
  const unresolvedDriver=(STATE.data.pretrip||[]).filter(r=>r.result==='Fail'&&r.defects&&!r.raised&&daysAgo(r.date)<=14).sort((a,b)=>a.date<b.date?1:-1);
  const openDefects=profiles.reduce((a,p)=>a+p.defects.defective.length+p.defects.driver.length,0);
  return {days,recs,repairs,prevRepairs,breakdowns:breakdowns.length,scheduled:scheduled.length,downtime,mttr,cost,hasCost:cost>0,byComp,compCost,months,profiles,
    openJobs:openJobsAll,unresolvedDriver,openDefects,pmShare:(scheduled.length+repairs.length)?scheduled.length/(scheduled.length+repairs.length):0,
    gapNoComp:repairs.filter(r=>!r.component).length,gapNoDowntime:breakdowns.filter(r=>!num(r.downtimeHours)).length};
}
function truckRecs(p){
  const r=[];
  if(p.tier==='CRITICAL') r.push('Rated CRITICAL — keep this truck off long-haul work until the open items are cleared and a post-repair inspection passes.');
  if(p.service.status==='red') r.push(`Service overdue (${p.service.reason}) — book it into the workshop before the next dispatch.`);
  else if(p.service.status==='amber') r.push(`Service due soon (${p.service.reason}) — schedule it now to avoid a breakdown.`);
  p.chronic.forEach(([c,n])=>r.push(`${c} has been repaired ${n} times — stop repeat-fixing: find the root cause (part quality, driver behaviour, load, road conditions) and consider replacing the component.`));
  p.repeat.forEach(([c])=>r.push(`${c} repaired twice — check the root cause before it becomes chronic.`));
  if(p.breakdowns>=2) r.push(`${p.breakdowns} breakdowns in the period — put it on a weekly maintenance inspection until it runs a month breakdown-free.`);
  if(p.downtime>=24) r.push(`${fmt(p.downtime,0)} hours of downtime — review spares availability and repair turnaround; stock the parts that keep recurring${p.topComp&&p.topComp!=='—'?' ('+p.topComp+')':''}.`);
  if(p.defects.defective.length) r.push(`Open inspection defects: ${p.defects.defective.map(miLabel).join(', ')} — complete the repair jobs and re-inspect.`);
  if(p.defects.attention.length) r.push(`Watch items from the last inspection: ${p.defects.attention.map(miLabel).join(', ')} — re-check within a week.`);
  if(p.defects.driver.length) r.push(`${p.defects.driver.length} unresolved defect report(s) from drivers' pre/post-trip checks — raise them as repair jobs.`);
  if(p.openJobs) r.push(`${p.openJobs} open repair job(s) — close them out or update their status.`);
  if(!p.lastInspection || daysAgo(p.lastInspection.date)>14) r.push('No maintenance inspection in the last 14 days — inspect it this week.');
  if(!r.length) r.push('No action needed — keep to the service schedule.');
  return r;
}
function buildMaintInsights(M){
  const I=[]; const push=(sev,title,text)=>I.push({sev,title,text});
  const P=M.profiles; const names=(arr,n)=>arr.slice(0,n||4).map(p=>`${p.regNo} (${p.rating})`).join(', ');
  const win=M.days?`the last ${M.days} days`:'all recorded history';
  if(!M.recs.length) push('amber','No maintenance events in this period',`Nothing was logged for ${win}. Log services, breakdowns and repairs so the analysis and risk ratings reflect reality — until then the ratings only use service due dates and inspection findings.`);
  if(M.days && (M.repairs.length||M.prevRepairs)){
    const d=M.repairs.length-M.prevRepairs;
    push(d>0?'amber':(d<0?'green':'amber'),'Repair volume trend',`${M.repairs.length} repair/breakdown event(s) in ${win} versus ${M.prevRepairs} in the previous ${M.days} days (${d>0?'+':''}${d}). ${d>0?'Reactive work is rising — check whether planned servicing is keeping up.':d<0?'Reactive work is falling — keep the preventive schedule going.':'No change.'}`);
  }
  if(M.scheduled+M.repairs.length>0){
    const pm=Math.round(M.pmShare*100);
    push(pm<50?'red':(pm<70?'amber':'green'),'Planned vs reactive maintenance',`${pm}% of maintenance events were planned services (${M.scheduled} scheduled vs ${M.repairs.length} repairs/breakdowns). ${pm<50?'Most work is reactive — that is the most expensive way to run a fleet. Prioritise overdue services and add inspection-driven repairs to the schedule.':pm<70?'Balance is improving; push more work into scheduled slots.':'Healthy preventive cover.'}`);
  }
  const crit=P.filter(p=>p.tier==='CRITICAL'), high=P.filter(p=>p.tier==='HIGH');
  if(crit.length) push('red','Trucks rated CRITICAL',`${names(crit)} carry the highest combined repair risk. ${crit.map(p=>{ const top=Object.entries(p.parts).sort((a,b)=>b[1]-a[1])[0]; return p.regNo+': mainly '+({service:'service overdue',frequency:'repair frequency',breakdowns:'breakdowns',chronic:'repeat component failures',downtime:'downtime',defects:'open inspection defects',driverReported:'driver-reported defects'}[top[0]]); }).slice(0,3).join('; ')}. Keep them off long-haul routes until cleared.`);
  if(high.length) push('amber','Trucks rated HIGH',`${names(high,6)} — schedule inspections and close open repair jobs this week.`);
  const chronic=P.filter(p=>p.chronic.length);
  if(chronic.length) push('red','Chronic repeat repairs',chronic.slice(0,4).map(p=>`${p.regNo}: ${p.chronic.map(([c,n])=>c+' ×'+n).join(', ')}`).join(' · ')+'. The same fault coming back three or more times means the fix is not addressing the cause — investigate and consider replacement or a warranty claim.');
  else { const rep=P.filter(p=>p.repeat.length); if(rep.length) push('amber','Repeat repairs to watch',rep.slice(0,4).map(p=>`${p.regNo}: ${p.repeat.map(([c])=>c).join(', ')}`).join(' · ')+'. Two repairs of the same component — inspect before it becomes chronic.'); }
  const comps=Object.entries(M.byComp).sort((a,b)=>b[1]-a[1]);
  if(comps.length){
    const [c,n]=comps[0]; const share=Math.round(n/M.repairs.length*100);
    let link=''; try{ const A=analyzeHsse(); if(A){ if(c==='Brakes'&&A.vCounts.HB>0) link=` ${A.vCounts.HB} driver(s) are flagged for harsh braking in the HSSE scorecards, so brake wear is likely partly driver-related — pair coaching with brake checks.`; if(c==='Tyres / Wheels'&&A.vCounts.OS>0) link=` ${A.vCounts.OS} driver(s) are flagged for over-speeding, which accelerates tyre wear.`; if(c==='Engine'&&A.vCounts.HA>0) link=` ${A.vCounts.HA} driver(s) are flagged for harsh acceleration, which adds engine strain.`; } }catch(e){}
    push(share>=35?'red':'amber','Top failing component: '+c,`${c} accounts for ${n} of ${M.repairs.length} repairs (${share}%). ${share>=35?'A concentration this high points to a systemic cause rather than bad luck — review parts quality, preventive intervals and operating conditions for this system fleet-wide.':'Keep an eye on it.'}${link}`);
  }
  const od=P.filter(p=>p.service.status==='red'), ds=P.filter(p=>p.service.status==='amber');
  if(od.length) push('red','Overdue for service',`${od.map(p=>p.regNo+' — '+p.service.reason.toLowerCase()).slice(0,6).join('; ')}. Overdue servicing is the strongest predictor of breakdowns — schedule these first.`);
  if(ds.length) push('amber','Service due soon',`${ds.map(p=>p.regNo).slice(0,8).join(', ')} are approaching their service threshold — book them within a week.`);
  const dtTop=P.slice().sort((a,b)=>b.downtime-a.downtime)[0];
  if(M.downtime>0&&dtTop&&dtTop.downtime>0){ const share=Math.round(dtTop.downtime/M.downtime*100); push(share>=40?'red':'amber','Downtime concentration',`${fmt(M.downtime,0)} hours of repair downtime in ${win}; ${dtTop.regNo} alone accounts for ${fmt(dtTop.downtime,0)} h (${share}%). Average breakdown repair time is ${fmt(M.mttr,1)} h against a ${STATE.targets.mttrTargetHrs} h target${M.mttr>STATE.targets.mttrTargetHrs?' — over target: review parts availability and workshop capacity.':'.'}`); }
  if(M.hasCost){ const cc=Object.entries(M.compCost).sort((a,b)=>b[1]-a[1])[0]; const ct=P.slice().sort((a,b)=>b.cost-a.cost)[0]; push('amber','Repair cost',`${naira(M.cost)} spent in ${win}; highest component: ${cc[0]} (${naira(cc[1])}); highest truck: ${ct.regNo} (${naira(ct.cost)}). Compare against replacement cost before approving further repairs on the costliest truck.`); }
  if(M.openJobs.length){ const old=M.openJobs.filter(j=>daysAgo(j.date)>7); push(old.length?'red':'amber','Open repair jobs',`${M.openJobs.length} job(s) still open${old.length?`, ${old.length} older than 7 days (${old.slice(0,3).map(j=>vehicleLabel(j.vehicleId)+' '+(j.component||'')).join(', ')})`:''}. Close them out or update their status so the risk ratings stay accurate.`); }
  if(M.unresolvedDriver.length) push('red','Driver-reported defects not yet actioned',`${M.unresolvedDriver.length} failed pre/post-trip check(s) in the last 14 days have not been raised to Maintenance (${[...new Set(M.unresolvedDriver.map(c=>vehicleLabel(c.vehicleId)))].slice(0,5).join(', ')}). Raise them below so they are repaired and tracked.`);
  const uninsp=P.filter(p=>!p.lastInspection||daysAgo(p.lastInspection.date)>14);
  if(P.length&&uninsp.length) push(uninsp.length===P.length?'red':'amber','Inspection coverage',`${uninsp.length} of ${P.length} truck(s) have had no maintenance inspection in the last 14 days (${uninsp.slice(0,6).map(p=>p.regNo).join(', ')}${uninsp.length>6?'…':''}). Daily inspection of 5 trucks would cover the fleet in about a week.`);
  if(M.gapNoComp||M.gapNoDowntime) push('amber','Data gaps limit the analysis',`${M.gapNoComp} repair(s) have no component recorded and ${M.gapNoDowntime} breakdown(s) have no downtime hours. Fill these in — component and downtime drive the hotspot, chronic-repeat and risk calculations.`);
  const clean=P.filter(p=>p.repairs===0&&p.service.status==='green');
  if(P.length&&clean.length) push('green','Reliable trucks',`${clean.length} of ${P.length} truck(s) had no repairs in ${win} and are within their service interval${clean.length<=6?': '+clean.map(p=>p.regNo).join(', '):''}. Use them as the benchmark and prefer them for the demanding routes.`);
  const order={red:0,amber:1,green:2}; I.sort((a,b)=>order[a.sev]-order[b.sev]);
  return I;
}

const FUEL_TYPES = ['Diesel','CNG'];
function isoLocal(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(str,n){ const d=new Date(str+'T00:00:00'); d.setDate(d.getDate()+n); return isoLocal(d); }
function sumKey(arr,k){ return arr.reduce((a,r)=>a+num(r[k]),0); }
function median(a){ if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }
function dateSort(a,b){ return a.date<b.date?-1:a.date>b.date?1:num(a.odo||a.odometer)-num(b.odo||b.odometer); }
function sevTag(sev){ return {red:'red',amber:'amber',green:'green'}[sev]||'grey'; }

/* =========================================================================
   PREDICTIVE MAINTENANCE — forecasts from real usage, workshop capacity and failure patterns
   ========================================================================= */
function odoPoints(v){
  const pts=[]; const add=(date,odo)=>{ const o=num(odo); if(date && o>0) pts.push({date,odo:o}); };
  (STATE.data.pretrip||[]).forEach(r=>{ if(r.vehicleId===v.id) add(r.date,r.odometer); });
  (STATE.data.maintInspections||[]).forEach(r=>{ if(r.vehicleId===v.id) add(r.date,r.odometer); });
  (STATE.data.cngFills||[]).forEach(r=>{ if(r.vehicleId===v.id) add(r.date,r.odometer); });
  (STATE.data.dieselTrips||[]).forEach(r=>{ if(r.vehicleId===v.id){ add(r.date,r.odoBefore); add(r.date,r.odoAdditional); add(r.date,r.odoOffload); } });
  (STATE.data.fuel||[]).forEach(r=>{ if(r.vehicleId===v.id){ add(r.date,r.newOdometer); add(r.prevDate,r.prevOdometer); } });
  return pts.sort(dateSort);
}
function usageRate(v,pts){
  const recent=pts.filter(p=>daysAgo(p.date)<=60);
  if(recent.length>=2){
    const a=recent[0], b=recent[recent.length-1]; const span=(new Date(b.date)-new Date(a.date))/86400000;
    if(span>=3 && b.odo>a.odo){ const r=(b.odo-a.odo)/span; if(r<=1500) return {rate:r,src:'readings',n:recent.length,span}; }
  }
  const since=daysAgo(v.lastServiceDate), used=num(v.currentOdometer)-num(v.lastServiceOdometer);
  if(since>=7 && since<99999 && used>0){ const r=used/since; if(r<=1500) return {rate:r,src:'registry',n:0,span:since}; }
  return {rate:null,src:'none',n:0,span:0};
}
function predictRepeatFailures(){
  const by={};
  (STATE.data.maintenance||[]).forEach(r=>{ if(!(r.type==='Breakdown'||r.type==='Repair')||!r.component||!r.date) return; const k=r.vehicleId+'|'+r.component; (by[k]=by[k]||[]).push(r.date); });
  const out=[];
  Object.entries(by).forEach(([k,dates])=>{
    if(dates.length<2) return; dates.sort(); const gaps=[];
    for(let i=1;i<dates.length;i++) gaps.push((new Date(dates[i])-new Date(dates[i-1]))/86400000);
    const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length; if(avg<1) return;
    const [vid,comp]=k.split('|'); const last=dates[dates.length-1];
    out.push({vehicleId:vid,regNo:vehicleLabel(vid),component:comp,count:dates.length,avgGap:avg,last,expectedIn:Math.round(avg-daysAgo(last)),confidence:dates.length>=3?'High':'Medium'});
  });
  return out.filter(x=>x.expectedIn<=30).sort((a,b)=>a.expectedIn-b.expectedIn);
}
function predictServicing(){
  const M=analyzeMaintenance(30); const risk={}; M.profiles.forEach(p=>{ risk[p.vehicleId]=p; });
  const list=STATE.data.vehicles.map(v=>{
    const pts=odoPoints(v), latest=pts.length?pts[pts.length-1]:null, ur=usageRate(v,pts);
    const effOdo=Math.max(num(v.currentOdometer),latest?latest.odo:0);
    const kmRemaining=num(v.serviceIntervalKm)-(effOdo-num(v.lastServiceOdometer));
    const daysKm=ur.rate?kmRemaining/ur.rate:null;
    let daysDate=null; if(v.lastServiceDate && v.serviceIntervalDays) daysDate=Math.round((new Date(v.lastServiceDate+'T00:00:00').getTime()+num(v.serviceIntervalDays)*86400000-new Date(todayStr()+'T00:00:00').getTime())/86400000);
    const cands=[]; if(daysKm!==null) cands.push(['km',daysKm]); if(daysDate!==null) cands.push(['date',daysDate]);
    let dueIn=null,binding=null; if(cands.length){ cands.sort((a,b)=>a[1]-b[1]); binding=cands[0][0]; dueIn=Math.round(cands[0][1]); }
    const reg=maintenanceStatusForVehicle(v); const rp=risk[v.id];
    const conf=ur.src==='readings'?((ur.n>=3&&ur.span>=14)?'High':'Medium'):'Low';
    const stale=(!latest||daysAgo(latest.date)>30)||(latest&&latest.odo-num(v.currentOdometer)>300);
    return {vehicleId:v.id,regNo:v.regNo,model:v.model||'',rate:ur.rate,src:ur.src,readings:ur.n,effOdo,kmRemaining,daysKm,daysDate,dueIn,binding,
      dueDate:dueIn!==null?addDays(todayStr(),dueIn):null,regStatus:reg.status,rating:rp?rp.rating:0,tier:rp?rp.tier:'LOW',conf,stale,latestReading:latest,
      early:dueIn!==null&&dueIn<=14&&dueIn>0&&reg.status==='green'};
  });
  const rates=list.map(p=>p.rate).filter(x=>x);
  const medRate=median(rates);
  const cap=Math.max(1,Math.round(num(STATE.targets.workshopServiceCapacityPerWeek)||5));
  const queue=list.filter(p=>p.dueIn!==null&&p.dueIn<=28).sort((a,b)=>a.dueIn-b.dueIn||b.rating-a.rating);
  queue.forEach((p,i)=>{ p.slotWeek=Math.floor(i/cap); p.late=p.slotWeek*7>Math.max(p.dueIn,0); });
  const buckets=[
    {label:'Overdue / now',n:list.filter(p=>p.dueIn!==null&&p.dueIn<=0).length},
    {label:'Next 7 days',n:list.filter(p=>p.dueIn!==null&&p.dueIn>=1&&p.dueIn<=7).length},
    {label:'Days 8–14',n:list.filter(p=>p.dueIn!==null&&p.dueIn>=8&&p.dueIn<=14).length},
    {label:'Days 15–21',n:list.filter(p=>p.dueIn!==null&&p.dueIn>=15&&p.dueIn<=21).length},
    {label:'Days 22–28',n:list.filter(p=>p.dueIn!==null&&p.dueIn>=22&&p.dueIn<=28).length},
  ];
  const repeats=predictRepeatFailures();
  const P={list,medRate,cap,queue,buckets,repeats,M};
  P.insights=buildPredictiveInsights(P);
  return P;
}
function buildPredictiveInsights(P){
  const I=[]; const push=(sev,title,text)=>I.push({sev,title,text});
  const L=P.list; if(!L.length){ push('amber','No trucks registered','Add trucks in the vehicle registry (KPIs & Registry tab) with their last service date and odometer so services can be forecast.'); return I; }
  const nm=(arr,n)=>arr.slice(0,n||5).map(p=>p.regNo).join(', ');
  const over=L.filter(p=>p.dueIn!==null&&p.dueIn<=0);
  if(over.length) push('red','Overdue for service',`${over.map(p=>`${p.regNo} (${p.binding==='km'?fmt(Math.abs(p.kmRemaining))+' km over':Math.abs(p.dueIn)+' days over'})`).slice(0,6).join(', ')}. Book these into the workshop first — overdue servicing is the strongest driver of breakdowns.`);
  const early=L.filter(p=>p.early).sort((a,b)=>a.dueIn-b.dueIn);
  if(early.length) push('amber','Early warning — will be due before the current alerts trigger',`${early.map(p=>`${p.regNo} in ~${p.dueIn} day(s) (${p.binding==='km'?'at '+fmt(p.rate,0)+' km/day':'calendar interval'})`).slice(0,6).join(', ')}. The registry shows these as OK today, but their actual usage means the service limit arrives within two weeks. Schedule them now.`);
  const hot=P.buckets.map((b,i)=>({...b,i})).filter(b=>b.n>P.cap);
  if(hot.length) push('red','Workshop overload ahead',`${hot.map(b=>`${b.label}: ${b.n} services vs capacity of ${P.cap}/week`).join('; ')}. Pull forward the least-urgent services from the busy week into quieter weeks, or arrange a second bay / outside workshop, so no truck runs past its limit. A suggested booking order is shown below.`);
  const late=P.queue.filter(p=>p.late);
  if(late.length&&!hot.length) push('amber','Bay capacity will push some services past their due date',`${nm(late)} would be booked later than their predicted due date at ${P.cap} services/week. Add capacity or move them earlier.`);
  const both=L.filter(p=>p.dueIn!==null&&p.dueIn<=14&&p.rating>=40);
  if(both.length) push('red','High-risk trucks that are also due',`${both.map(p=>`${p.regNo} (risk ${p.rating}, due ${p.dueIn<=0?'now':'in ~'+p.dueIn+' d'})`).join(', ')}. Put these at the front of the workshop queue and carry out a full inspection during the service.`);
  if(P.repeats.length) push(P.repeats.some(r=>r.expectedIn<=7)?'red':'amber','Repeat failures likely soon',`${P.repeats.slice(0,5).map(r=>`${r.regNo} ${r.component} (every ~${fmt(r.avgGap,0)} days, expected ${r.expectedIn<=0?'now / overdue':'in ~'+r.expectedIn+' d'})`).join('; ')}. Inspect these components at the next service and pre-order parts so the repair does not become a breakdown.`);
  if(P.medRate){
    const heavy=L.filter(p=>p.rate&&p.rate>1.5*P.medRate);
    if(heavy.length) push('amber','High-usage trucks reach service limits fastest',`${heavy.map(p=>`${p.regNo} (${fmt(p.rate,0)} km/day, a ${fmt(num(STATE.data.vehicles.find(v=>v.id===p.vehicleId).serviceIntervalKm)/p.rate,0)}-day service cycle)`).slice(0,5).join(', ')} versus a fleet median of ${fmt(P.medRate,0)} km/day. Expect these in the workshop most often; consider rotating them with under-used trucks.`);
    const idle=L.filter(p=>p.rate&&p.rate<0.4*P.medRate&&p.binding==='date');
    if(idle.length) push('green','Under-used trucks are time-limited',`${nm(idle)} run well below the fleet median, so their calendar interval (not mileage) triggers the next service. They are spare capacity for demanding routes.`);
  }
  const lowConf=L.filter(p=>p.conf==='Low'&&p.dueIn!==null);
  const stale=L.filter(p=>p.stale);
  if(stale.length||lowConf.length) push('amber','Forecast accuracy depends on odometer data',`${stale.length} truck(s) have no odometer reading in the last 30 days or a registry odometer behind their latest reading (${nm(stale,6)}); ${lowConf.length} forecast(s) rely on a registry estimate only. Record the odometer on every pre-trip / post-trip check, fuel issue and maintenance inspection — they feed these forecasts automatically — and update the registry odometer weekly.`);
  const n30=L.filter(p=>p.dueIn!==null&&p.dueIn<=30).length;
  if(n30) push('amber','Parts & consumables planning',`${n30} of ${L.length} trucks are forecast to need a service in the next 30 days. Pre-order oil, filters and common wear parts for that many services, plus the components flagged for repeat failure.`);
  const ok=L.filter(p=>p.dueIn!==null&&p.dueIn>30);
  if(ok.length) push('green','Comfortable headroom',`${ok.length} truck(s) are forecast to stay within their interval for more than 30 days${ok.length<=6?': '+nm(ok,6):''}.`);
  const nof=L.filter(p=>p.dueIn===null);
  if(nof.length) push('amber','No forecast possible',`${nm(nof,6)} — add the last service date / odometer and service interval in the registry.`);
  return sortInsights(I);
}

const OTHER_BUCKETS = [
  ['Clutch', /clutch/i],
  ['Steering', /steer|tie.?rod|track.?rod|drag.?link/i],
  ['Battery, starter & alternator', /batter|alternator|starter|dynamo|jump.?start/i],
  ['Lights, horn & wiring', /light|lamp|bulb|horn|indicator|wiring|wire|fuse|relay|reflector/i],
  ['Fuel system', /fuel|diesel|injector|lift pump|water separator|nozzle|\btank\b/i],
  ['Exhaust & turbo', /exhaust|turbo|silencer|muffler|dpf|manifold/i],
  ['Air system & compressor', /compressor|air dryer|air tank|air line|air leak|air.?bag|governor|\bair\b/i],
  ['Filters, oil & lubrication', /filter|\boil\b|grease|greasing|lubric|lube/i],
  ['Axle, hub, bearings & drive shaft', /axle|\bhub\b|bearing|prop(eller)?\s*shaft|drive\s*shaft|cardan|u.?joint|differential|\bdiff\b|half.?shaft/i],
  ['Trailer, tipper & coupling', /trailer|fifth.?wheel|5th.?wheel|coupling|landing leg|tipper|tipping|tail.?gate|tail.?board|\bbody\b/i],
  ['Glass, mirrors & wipers', /windscreen|windshield|mirror|wiper|glass/i],
  ['Cab, seats, doors & AC', /\bcab\b|seat|door|window|\ba\/?c\b|air.?con|dashboard/i],
  ['Welding, fabrication & body work', /weld|fabricat|crack|patch|bracket|mudguard|bumper|fender|paint|panel/i],
  ['Washing & general service', /wash|clean|general service|routine service/i],
];
function otherItemsDatalist(){ return `<datalist id="dl-other-items">${OTHER_BUCKETS.map(b=>`<option value="${esc(b[0])}"></option>`).join('')}</datalist>`; }
function otherItem(r){
  if(!r||r.component!=='Other') return null;
  const test=s=>{ for(const [name,re] of OTHER_BUCKETS) if(re.test(s)) return name; return null; };
  const d=String(r.otherDetail||'').trim();
  if(d){ const ex=OTHER_BUCKETS.find(b=>b[0].toLowerCase()===d.toLowerCase()); if(ex) return ex[0]; return test(d)||('Other: '+d.charAt(0).toUpperCase()+d.slice(1)); }
  return test([r.notes,r.parts].filter(Boolean).join(' '))||'Unclassified — no detail given';
}
function compKey(r){
  if(!r.component||r.component==='Unspecified') return null;
  if(r.component==='Other'){ const o=otherItem(r); return /^Unclassified/.test(o)?null:'Other — '+o.replace(/^Other:\s*/,''); }
  return r.component;
}
function whatDone(r){
  const c=r.component==='Other'?('Other — '+(otherItem(r)||'').replace(/^Other:\s*/,'')):(r.component||'');
  if(r.type==='Scheduled') return 'Scheduled service'+(c?' · '+c:'');
  return c||'Component not recorded';
}
function otherBreakdown(repairs){
  const others=repairs.filter(r=>r.component==='Other'); const g={};
  others.forEach(r=>{ const k=otherItem(r); const x=g[k]||(g[k]={item:k,n:0,trucks:new Set(),down:0,cost:0,last:'',events:[]}); x.n++; x.trucks.add(r.vehicleId); x.down+=num(r.downtimeHours); x.cost+=num(r.cost); if(!x.last||r.date>x.last) x.last=r.date; x.events.push(r); });
  return {total:others.length, groups:Object.values(g).sort((a,b)=>(/^Unclassified/.test(a.item)-/^Unclassified/.test(b.item))||b.n-a.n), others};
}
function otherSection(repairs, windowLabel){

/* ---------- parts ---------- */
function sing(w){ if(w.length<=3) return w; if(/(ss|us|is)$/.test(w)) return w; if(/ies$/.test(w)) return w.slice(0,-3)+'y'; if(/(ches|shes|xes|sses)$/.test(w)) return w.slice(0,-2); if(/s$/.test(w)) return w.slice(0,-1); return w; }
function normPart(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9\s\-\/\.]/g,' ').replace(/\s+/g,' ').trim().split(' ').map(sing).join(' '); }
function parseParts(txt){
  return String(txt||'').split(/[,;\n+]+/).map(s=>s.trim()).filter(Boolean).map(tok=>{
    let qty=1, name=tok, m=tok.match(/^(\d+(?:\.\d+)?)\s*(?:x|×)\s*(.+)$/i)||tok.match(/^(\d+(?:\.\d+)?)\s+(?:(?:pcs?|pieces?|nos?\.?|sets?|litres?|liters?|ltrs?|kg|gallons?)\s+)?(?:of\s+)?(.+)$/i);
    if(m){ qty=parseFloat(m[1]); name=m[2]; }
    else { m=tok.match(/^(.+?)\s*(?:x|×|\*)\s*(\d+)$/i); if(m){ name=m[1]; qty=parseInt(m[2],10); } }
    const key=normPart(name); return key?{key,name:name.trim(),qty}:null;
  }).filter(Boolean);
}
function allPartPurchases(){
  const out=[]; (STATE.data.maintenance||[]).forEach(r=>{ if(!r.parts||!r.vehicleId||!r.date) return; parseParts(r.parts).forEach(p=>out.push({...p,date:r.date,vehicleId:r.vehicleId,recId:r.id,type:r.type})); });
  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const last={}; out.forEach(p=>{ const k=p.vehicleId+'|'+p.key, pv=last[k]; p.prevDate=pv?pv.date:null; p.prevGap=pv?daysBetween(pv.date,p.date):null; p.nth=pv?pv.nth+1:1; last[k]=p; });
  return out;
}
function partTitle(s){ s=String(s||''); return s.charAt(0).toUpperCase()+s.slice(1); }
// Used by the live hint under the Parts field and by the lookup box on the Parts tab.
function partHintHTML(vid, text){
  const items=parseParts(text); if(!items.length) return '';
  if(!vid) return '<span class="dim">Select a truck to see when each part was last bought for it.</span>';
  const P=allPartPurchases();
  return items.map(it=>{
    const match=p=>p.key===it.key||p.key.includes(it.key)||it.key.includes(p.key);
    const mine=P.filter(p=>p.vehicleId===vid&&match(p)), other=P.filter(p=>p.vehicleId!==vid&&match(p));
    const last=mine[mine.length-1], lastOther=other[other.length-1];
    let s;
    if(last){ const d=daysAgo(last.date); s=`last bought for <b>${esc(vehicleLabel(vid))}</b> on <b>${fmtDate(last.date)}</b> (${agoLabel(last.date)}) · bought ${mine.length} time(s) in total`; if(d<=60) s=`<span class="tag amber">Recent</span> `+s; }
    else s=`<span class="tag green">New</span> never recorded for <b>${esc(vehicleLabel(vid))}</b>`;
    if(lastOther) s+=` <span class="dim">· last bought on another truck: ${esc(vehicleLabel(lastOther.vehicleId))}, ${fmtDate(lastOther.date)}</span>`;
    return `<div style="margin-top:4px;"><b>${esc(partTitle(it.name))}</b> — ${s}</div>`;
  }).join('');
}

/* ---------- repair history & intervals (all trucks) ---------- */
function buildHistory(){
  const all=(STATE.data.maintenance||[]).filter(r=>r.date); const byV={}; all.forEach(r=>{ (byV[r.vehicleId]=byV[r.vehicleId]||[]).push(r); });
  const byId={};
  const trucks=(STATE.data.vehicles||[]).map(v=>{
    const evs=(byV[v.id]||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    let prevAny=null, prevRep=null; const lastComp={}, count={}, dates={};
    const rows=evs.map(r=>{
      const bd=isBd(r), ck=bd?compKey(r):null; let gapRep=null, sinceSame=null, nth=null;
      const gapAny=prevAny?daysBetween(prevAny.date,r.date):null;
      if(bd){
        if(prevRep) gapRep=daysBetween(prevRep.date,r.date);
        if(ck){ nth=(count[ck]||0)+1; count[ck]=nth; (dates[ck]=dates[ck]||[]).push(r.date); if(lastComp[ck]) sinceSame=daysBetween(lastComp[ck].date,r.date); lastComp[ck]=r; }
        prevRep=r;
      }
      prevAny=r; const row={r,bd,ck,gapRep,gapAny,sinceSame,nth}; byId[r.id]=row; return row;
    });
    const reps=rows.filter(x=>x.bd), gaps=reps.filter(x=>x.gapRep!==null).map(x=>x.gapRep);
    const repeats=Object.entries(count).filter(([,n])=>n>=2).map(([k,n])=>{ const ds=dates[k]; const iv=[]; for(let i=1;i<ds.length;i++) iv.push(daysBetween(ds[i-1],ds[i])); return {item:k,n,dates:ds,intervals:iv,last:ds[ds.length-1]}; }).sort((a,b)=>b.n-a.n);
    return {v,rows,repairs:reps.length,scheduled:rows.length-reps.length,gaps,
      avg:gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:null,min:gaps.length?Math.min(...gaps):null,max:gaps.length?Math.max(...gaps):null,
      lastRepair:reps.length?reps[reps.length-1].r.date:null,lastEvent:rows.length?rows[rows.length-1].r.date:null,
      down:reps.reduce((a,x)=>a+num(x.r.downtimeHours),0),cost:rows.reduce((a,x)=>a+num(x.r.cost),0),repeats};
  });
  return {trucks,byId};
}
function histRow(x){
  const r=x.r;
  const sameTxt=x.bd&&x.ck?(x.nth>=2?`<span class="tag ${x.nth>=3?'red':'amber'}">${x.nth>=3?'Chronic':'Repeat'} #${x.nth}</span> <span class="dim small">${x.sinceSame!==null?x.sinceSame+' d after the last '+esc(x.ck.replace(/^Other — /,'').toLowerCase())+' repair':''}</span>`:'<span class="dim">First time</span>'):'<span class="dim">—</span>';
  return `<tr><td>${fmtDate(r.date)}</td><td>${r.type==='Scheduled'?'<span class="tag teal">Service</span>':bdKindTag(r)}</td><td style="white-space:normal;min-width:170px;"><b>${esc(whatDone(r))}</b></td><td>${x.bd?(x.gapRep!==null?`<b>${x.gapRep}</b> d`:'<span class="dim">first repair</span>'):'<span class="dim">—</span>'}</td><td style="white-space:normal;min-width:200px;">${sameTxt}</td><td style="white-space:normal;min-width:200px;">${esc(r.notes||'')}${r.parts?' <span class="dim">· Parts: '+esc(r.parts)+'</span>':''}</td><td>${r.downtimeHours?fmt(num(r.downtimeHours),1)+' h':'—'}</td><td>${r.cost?naira(num(r.cost)):'—'}</td><td>${r.status==='Open'?'<span class="tag amber">Open</span>':'<span class="tag green">Done</span>'}</td><td><button type="button" class="btn small" data-edit="maintenance:${esc(r.id)}">Edit</button></td></tr>`;
}

/* ---------- driver clustering (names are typed freehand) ---------- */
function makeDriverIndex(){
  const reg=[], memo={};
  const ensure=nm=>{ nm=String(nm||'').trim(); if(!nm) return null; if(memo[nm]) return memo[nm]; let r=reg.find(c=>c.names.some(x=>sameDriver(x,nm))); if(!r){ r={name:nm.toUpperCase().replace(/\s+/g,' '),names:[nm]}; reg.push(r); } else r.names.push(nm); memo[nm]=r; return r; };
  return {ensure,reg};
}
function pickN(list){ return Math.min(3,Math.floor(list.length/2)) || (list.length?1:0); }

/* Maintenance driver ranking for one Mon–Sun week.
   Score (100 = best): −20 per breakdown/repair on the truck the driver was running (max −60), −1 per 2 h of that downtime (max −20),
   −20 × share of trip-days without both a pre-trip and a post-trip check. Events raised automatically from inspections / driver
   defect reports are not charged to a driver. */
function maintDriverWeek(start){
  const end=addDays(start,6), inW=d=>d&&d>=start&&d<=end; const D=makeDriverIndex();
  const asg=[]; const addA=(r,trip)=>{ if(r.vehicleId&&r.driverName&&r.date){ const c=D.ensure(r.driverName); if(c) asg.push({date:r.date,vehicleId:r.vehicleId,c,trip}); } };
  (STATE.data.journey||[]).forEach(r=>addA(r,true)); (STATE.data.transport||[]).forEach(r=>addA(r,true)); (STATE.data.pretrip||[]).forEach(r=>addA(r,false));
  const stats=new Map(); const S=c=>{ if(!stats.has(c)) stats.set(c,{c,days:new Set(),tripDays:new Map(),bd:0,down:0,events:[]}); return stats.get(c); };
  asg.filter(a=>inW(a.date)).forEach(a=>{ const s=S(a.c); s.days.add(a.date); if(a.trip) s.tripDays.set(a.vehicleId+'|'+a.date,{vid:a.vehicleId,date:a.date}); });
  (STATE.data.maintenance||[]).filter(r=>isBd(r)&&!r.srcId&&inW(r.date)).forEach(ev=>{
    const cand=asg.filter(a=>a.vehicleId===ev.vehicleId&&a.date<=ev.date&&daysBetween(a.date,ev.date)<=7); if(!cand.length) return;
    const latest=cand.reduce((m,a)=>a.date>m?a.date:m,''); const who=[...new Set(cand.filter(a=>a.date===latest).map(a=>a.c))];
    who.forEach(c=>{ const s=S(c); s.bd+=1/who.length; s.down+=num(ev.downtimeHours)/who.length; s.events.push(ev); });
  });
  const list=[...stats.values()].map(s=>{
    const td=[...s.tripDays.values()]; const ok=td.filter(t=>checkStatus(t.vid,t.date,'Pre-Trip')!=='Missing'&&checkStatus(t.vid,t.date,'Post-Trip')!=='Missing').length;
    const cov=td.length?ok/td.length:null;
    const score=Math.max(0,Math.round(100-Math.min(60,s.bd*20)-Math.min(20,s.down/2)-(cov===null?0:20*(1-cov))));
    return {key:s.c.name,name:s.c.name,bd:Math.round(s.bd*10)/10,down:s.down,cov,tripDays:td.length,days:s.days.size,score,events:s.events};
  });
  return list;
}
function rankMaintDrivers(start){
  const cur=maintDriverWeek(start), prev=maintDriverWeek(addDays(start,-7)); const pm={}; prev.forEach(p=>{ pm[p.key]=p.score; });
  cur.forEach(p=>{ p.prevScore=pm[p.key]!==undefined?pm[p.key]:null; });
  const sorted=cur.slice().sort((a,b)=>b.score-a.score||a.bd-b.bd||b.tripDays-a.tripDays);
  const k=pickN(sorted); const best=sorted.slice(0,k); const rest=sorted.filter(x=>!best.includes(x));
  const worst=rest.slice().sort((a,b)=>a.score-b.score||b.bd-a.bd).slice(0,k).filter(x=>x.score<100);
  return {all:sorted,best,worst,prevCount:prev.length};
}
function rankCard(title,tone,list,cols){
  const rows=list.map((p,i)=>`<tr${p.click?` data-driver-detail="${esc(p.click)}" style="cursor:pointer;"`:''}><td><span class="rank ${tone}">${i+1}</span></td><td style="white-space:normal;min-width:130px;"><b>${esc(p.name)}</b></td>${cols.map(c=>`<td>${c.f(p)}</td>`).join('')}</tr>`).join('');

/* ---------- maintenance: this week vs last week ---------- */
function maintWeekMetrics(start, H, P, endOpt){

  const ev=(STATE.data.maintenance||[]).filter(r=>inW(r.date)), bds=ev.filter(isBd), sch=ev.filter(r=>r.type==='Scheduled');

  const comp={}; bds.forEach(r=>{ const c=r.component==='Other'?'Other':(r.component||'Not recorded'); comp[c]=(comp[c]||0)+1; });
  const truck={}; bds.forEach(r=>{ truck[r.vehicleId]=(truck[r.vehicleId]||0)+1; });
  const repeats=bds.filter(r=>{ const x=H.byId[r.id]; return x&&x.sinceSame!==null; });
  const parts=P.filter(p=>inW(p.date));

    cost:ev.reduce((a,r)=>a+num(r.cost),0),trucks:Object.keys(truck).length,repeats:repeats.length,repeatList:repeats,parts:parts.length,
    partsAgain:parts.filter(p=>p.prevGap!==null&&p.prevGap<=90).length,partsAgainList:parts.filter(p=>p.prevGap!==null&&p.prevGap<=90),
    closed:(STATE.data.maintenance||[]).filter(r=>inW(r.completedDate)).length,inspected:trucksInspectedMaint(daily,mi),patrols:sumBy(daily,'roadPatrols'),toolbox:sumBy(daily,'toolboxTalks'),comp,truck,bds};
}
function deltaCell(cur,prev,good,decimals,suffix,money){
  suffix=suffix||''; const d=cur-prev; const f=v=>money?naira(v):fmt(v,decimals||0)+suffix;
  if(Math.abs(d)<1e-9) return `<span class="dim">no change</span>`;
  const pc=prev?Math.round(d/prev*100):null; const better=good==='lower'?d<0:good==='higher'?d>0:null;
  const cls=better===null?'dim':(better?'up-good':'up-bad');
  return `<span class="${cls}">${d>0?'▲ +':'▼ −'}${f(Math.abs(d))}${pc!==null?` (${d>0?'+':'−'}${Math.abs(pc)}%)`:''}</span>`;
}
function maintWeekStarts(){
  const cur=wkStart(todayStr()); const out=[]; for(let i=0;i<26;i++) out.push(addDays(cur,-7*i)); return out;
}

/* ---------- safety: weekly comparison + best / worst 3 drivers ---------- */
function hsseWeekNums(w){
  const ds=(w&&w.drivers||[]).filter(d=>!d.na); const c={RED:0,AMBER:0,GREEN:0}; ds.forEach(d=>c[bandOf(d.t||0)]++);
  const v={HB:0,HA:0,OS:0,HOS:0}; ds.forEach(d=>(d.v||[]).forEach(k=>{ if(v[k]!==undefined) v[k]++; }));
  return {count:ds.length,avg:ds.length?ds.reduce((a,d)=>a+(d.t||0),0)/ds.length:0,RED:c.RED,AMBER:c.AMBER,GREEN:c.GREEN,viol:ds.filter(d=>(d.v||[]).length).length,v,dist:ds.reduce((a,d)=>a+(d.d||0),0)};
}
function hsseLogNums(startIso){

}
function hsseCompare(A){

  const better=mv.filter(p=>p.delta<-0.5).sort((a,b)=>a.delta-b.delta).slice(0,3), worse=mv.filter(p=>p.delta>0.5).sort((a,b)=>b.delta-a.delta).slice(0,3);
  const mvl=(l,cls)=>l.length?l.map(p=>`<div class="small" style="margin-bottom:4px;cursor:pointer;" data-driver-detail="${esc(p.key)}"><b>${esc(p.name)}</b> <span class="${cls}">${p.delta>0?'▲ +':'▼ −'}${fmt(Math.abs(p.delta),2)}</span> <span class="dim">(${fmt(p.score-p.delta,2)} → ${fmt(p.score,2)})</span></div>`).join(''):'<div class="dim small">None.</div>';

function hsseBestWorst(A){
  const F=A.focus; const pool=A.activeP.filter(p=>p.band!=='NA'&&p.tele);
  const head=`<div class="section-title"><span>Best &amp; worst 3 drivers — safety</span><div class="line"></div><span class="dim small mono">${F.latest?esc(wkLabel(F.latest)):''}</span></div>`;
  if(!pool.length) return head+`<div class="card dim" style="text-align:center;padding:22px;">No scored drivers for this week.</div>`;
  const sorted=pool.slice().sort((a,b)=>a.score-b.score||b.dist-a.dist); const k=pickN(sorted);
  const best=sorted.slice(0,k); const rest=sorted.filter(x=>!best.includes(x)); const worst=rest.slice().sort((a,b)=>b.score-a.score||b.rating-a.rating).slice(0,k);
  const map=p=>({...p,click:p.key});
  const trend=p=>p.delta===null?'<span class="dim">new</span>':(Math.abs(p.delta)<0.5?'<span class="dim">stable</span>':`<span class="${p.delta<0?'up-good':'up-bad'}">${p.delta<0?'▼ −':'▲ +'}${fmt(Math.abs(p.delta),1)}</span>`);
  const cols=[{h:'Score',f:p=>`<b>${fmt(p.score,2)}</b>`},{h:'Band',f:p=>p.band?`<span class="tag ${BAND_TAG[p.band]}">${p.band}</span>`:'—'},{h:'Distance',f:p=>fmt(p.dist,0)+' km'},{h:'Violations',f:p=>p.viol.length?p.viol.map(k=>esc(HSSE_VIOL[k])).join(', '):'<span class="dim">none</span>'},{h:'vs last week',f:trend}];
  return head+`<div class="section-sub">Ranked by the weekly telematics score (lower is safer); ties go to the driver who covered more distance. Click a driver for the full profile.</div>
  <div class="grid cols-2">${rankCard('Safest drivers','good',best.map(map),cols)}${rankCard('Highest-risk drivers','bad',worst.map(map),cols)}</div>`;
}

function selectHTML(attr,val,opts){ return `<select ${attr}>${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(val)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`; }
function lastDriverFor(vid){
  let best=null; ['transport','journey','pretrip'].forEach(k=>(STATE.data[k]||[]).forEach(r=>{ if(r.vehicleId===vid&&r.driverName&&(!best||r.date>=best.date)) best={date:r.date,name:r.driverName}; }));
  return best?best.name:'';
}
function prepMaintRec(rec){
  if(rec.type==='Repair'){ rec.type='Breakdown'; if(!rec.kind) rec.kind='workshop'; }
  if(rec.type==='Scheduled') delete rec.kind;
  if(rec.component!=='Other') delete rec.otherDetail; else if(rec.otherDetail) rec.otherDetail=String(rec.otherDetail).trim();
  return compactRec(rec);
}
function tonnageByTruckDriver(recs){
  const g={}; recs.forEach(r=>{ if(!trKey(r)&&!r.driverName) return; const dn=normName(r.driverName)||'—'; const k=(trKey(r)||'none')+'|'+dn; const x=g[k]||(g[k]={vid:r.vehicleId,txt:r.regNoText,driver:r.driverName?String(r.driverName).trim():'—',n:0,trips:0,tripsT:0,ton:0,tonT:0}); x.n++; x.trips+=num(r.tripsActual); x.tripsT+=num(r.tripsTarget); x.ton+=num(r.tonnageActual); x.tonT+=num(r.tonnageTarget); });
  const rows=Object.values(g).sort((a,b)=>b.ton-a.ton||b.trips-a.trips);
  const missing=recs.filter(r=>!trKey(r)||!r.driverName).length;
  const head=`<div class="section-title"><span>Tonnage by truck &amp; driver</span><div class="line"></div></div>`;
  const note=missing?`<div class="note warn">${missing} entr${missing===1?'y has':'ies have'} no truck or driver (logged before these fields existed). Use <b>Edit</b> in the Entry Log below to add them.</div>`:'';
  if(!rows.length) return head+note+`<div class="card dim" style="text-align:center;padding:18px;">No entries with a truck and driver yet. Pick the truck and type the driver’s name when you log a transport entry.</div>`;
  return head+note+`<div class="table-wrap"><table><thead><tr><th>Truck Reg No</th><th>Driver Name</th><th>Entries</th><th>Trips (act / tgt)</th><th>Tonnage (act / tgt)</th><th>Avg load / trip</th></tr></thead><tbody>${rows.map(x=>`<tr><td><b>${x.vid?esc(vehicleLabel(x.vid)):(x.txt?esc(String(x.txt).toUpperCase()):'—')}</b></td><td style="white-space:normal;">${esc(x.driver)}</td><td>${x.n}</td><td>${fmt(x.trips)} / ${fmt(x.tripsT)}</td><td>${fmt(x.ton)} / ${fmt(x.tonT)}</td><td>${x.trips?fmt(x.ton/x.trips,1)+' MT':'—'}</td></tr>`).join('')}</tbody></table></div>`;
}

/* =================== v7: robust service status (registry always follows the service log) + Transport Ops Excel template =================== */

/* ---------- service baseline ---------- */
function nearestReading(pts,date){
  let best=null,bd=1e9; pts.forEach(p=>{ const d=Math.abs(daysBetween(p.date,date)); if(d<bd||(d===bd&&best&&p.odo>best.odo)){ bd=d; best=p; } });
  return best&&bd<=21?best.odo:0;
}
const SERVICE_WORDS=/\b(full |routine |general |major |minor |scheduled |pm )?servic(e|ed|ing)\b|oil change|\bpms\b/i;
/* Keeps every truck's last-service date / odometer in step with the log, and the registry odometer in step with the newest reading.
   Runs on load, on every save and on every screen refresh, so the Overdue / Due Soon status can never lag behind what was logged. */
function reconcileServices(){
  let changed=false;
  (STATE.data.vehicles||[]).forEach(v=>{
    const pts=odoPoints(v);
    const evs=(STATE.data.maintenance||[]).filter(r=>r.vehicleId===v.id&&r.type==='Scheduled'&&r.status!=='Open'&&r.date);
    evs.forEach(r=>{ if(num(r.odometer)>0) pts.push({date:r.date,odo:num(r.odometer)}); });
    pts.sort(dateSort);
    if(pts.length){
      const top=pts.reduce((m,p)=>p.odo>m?p.odo:m,0);
      if(top>num(v.currentOdometer) && top-num(v.currentOdometer)<=30000){ v.currentOdometer=String(top); changed=true; }
    }
    if(evs.length){
      const last=evs.reduce((m,r)=>r.date>m.date?r:m);
      if(!v.lastServiceDate || last.date>v.lastServiceDate){
        let odo=num(last.odometer)||nearestReading(pts,last.date);
        if(!odo||odo<num(v.lastServiceOdometer)) odo=num(v.currentOdometer);       // no usable reading: assume serviced at the current reading
        v.lastServiceDate=last.date; v.lastServiceOdometer=String(odo); changed=true;
      }
      // an odometer typed on any logged service also moves the km baseline forward (odometers only go up)
      const topExp=Math.max(0,...evs.map(r=>num(r.odometer)));
      if(topExp>num(v.lastServiceOdometer) && topExp<=num(v.currentOdometer)){ v.lastServiceOdometer=String(topExp); changed=true; }
    }
  });
  return changed;
}
function queueRegistrySave(){
  if(STATE.reconQueued||!GAS_CONFIGURED) return; STATE.reconQueued=true;
  setTimeout(async()=>{ STATE.reconQueued=false; await persist('vehicles'); },400);

function maintenanceStatusForVehicle(v){
  const kmRemaining = num(v.serviceIntervalKm) - (num(v.currentOdometer) - num(v.lastServiceOdometer));
  let daysRemaining = null;
  if(v.lastServiceDate && v.serviceIntervalDays){
    const last = new Date(v.lastServiceDate+'T00:00:00');
    const due = new Date(last.getTime() + num(v.serviceIntervalDays)*86400000);
    daysRemaining = Math.round((due - new Date())/86400000);
  }
  let status='green', reason='Within service interval', hint='';
  const kmCritical = kmRemaining<=0, kmWarn = kmRemaining>0 && kmRemaining<500;
  const dayCritical = daysRemaining!==null && daysRemaining<=0, dayWarn = daysRemaining!==null && daysRemaining>0 && daysRemaining<=7;
  if(kmCritical || dayCritical){ status='red'; reason = kmCritical? 'Service overdue by '+fmt(Math.abs(kmRemaining))+' km' : 'Service overdue by '+Math.abs(daysRemaining)+' days'; if(kmCritical&&dayCritical) reason+=' and '+Math.abs(daysRemaining)+' days'; }
  else if(kmWarn || dayWarn){ status='amber'; reason = kmWarn? fmt(kmRemaining)+' km until service due' : daysRemaining+' days until service due'; }
  if(status!=='green'){
    const base=v.lastServiceDate||'';
    const mt=STATE.data.maintenance||[];
    const open=mt.filter(r=>r.vehicleId===v.id&&r.type==='Scheduled'&&r.status==='Open'&&r.date>=base).sort((a,b)=>a.date<b.date?1:-1)[0];
    if(open){ status='amber'; reason='Service in progress since '+fmtDate(open.date)+' — mark the job complete when it is finished'; }
    else {
      const misfiled=mt.filter(r=>r.vehicleId===v.id&&isBd(r)&&r.date>base&&SERVICE_WORDS.test([r.notes,r.otherDetail,r.parts].filter(Boolean).join(' '))).sort((a,b)=>a.date<b.date?1:-1)[0];
      if(misfiled) hint='A “service” was logged as a repair on '+fmtDate(misfiled.date)+' — edit that entry and set the type to Scheduled service.';
    }
  }
  return {status, reason, hint, kmRemaining, daysRemaining};
}

function crc32(bytes){ let c,crc=-1; if(!crc32.t){ crc32.t=[]; for(let n=0;n<256;n++){ c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; crc32.t[n]=c>>>0; } } for(let i=0;i<bytes.length;i++) crc=crc32.t[(crc^bytes[i])&255]^(crc>>>8); return (crc^-1)>>>0; }
function zipStore(files){
  const enc=new TextEncoder(); const parts=[], central=[]; let offset=0;
  files.forEach(f=>{
    const name=enc.encode(f.name), data=enc.encode(f.data), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30)); lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0x21,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true); lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46)); ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true); ch.setUint16(28,name.length,true); ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),name); offset+=30+name.length+data.length;
  });
  let csize=0; central.forEach(c=>{ csize+=c.length; });
  const end=new DataView(new ArrayBuffer(22)); end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,csize,true); end.setUint32(16,offset,true);
