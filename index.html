/* ============================================================ hsse2.js ============================================================ */
/* ===== HSSE v2: layout-independent driver-scorecard reader + one-time seed ===== */
/* The original reader only understood sheets named "Week N Raw (...)" or "Driver Scorecard Data".
   This wrapper additionally recognises ANY sheet that has Driver + Distance + penalty-point headings
   (wherever the header row or the Driver column sits), so a renamed or re-laid-out scorecard still loads. */
function parseHsseWorkbook(wb,fname){
  const out=parseHsseWorkbookCore(wb,fname);
  out.notes=out.notes||[];
  const S=v=>v==null?'':String(v).replace(/\s+/g,' ').trim();
  const N=v=>{ if(v===null||v===undefined||v==='') return null; const x=typeof v==='number'?v:parseFloat(String(v).replace(/,/g,'')); return isNaN(x)?null:x; };
  const R=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true});
  const handled=/week\s*\d+\s*raw|driver scorecard data/i;
  const skip=/^(summary|instructions|hsse dashboard|capa|incident|toolbox|training|ppe|vehicle hsse|environmental|emergency|audit|corrective action|contractor|weekly hsse|monthly hsse)/i;
  const dur=(v,h)=>{ const x=N(v); if(x===null) return 0; if(/sec/.test(h)) return Math.round(x); return Math.round(x*86400); };  // time cells are fractions of a day
  const sn=wb.SheetNames.find(x=>/^summary$/i.test(x)); const sRows=sn?R(sn):[];
  const sv=(re,def)=>{ const r=sRows.find(x=>re.test(S(x[0]))); const v=r?N(r[1]):null; return v||def; };
  const minKm=sv(/minimum distance/i,20), hosSec=sv(/hos seconds/i,600);
  wb.SheetNames.forEach(n=>{
    if(handled.test(n)||skip.test(n)) return;
    const rows=R(n); let hi=-1, dc=-1;
    for(let i=0;i<Math.min(rows.length,25);i++){
      const h=(rows[i]||[]).map(x=>S(x).toLowerCase());
      const d=h.findIndex(x=>/^driver( name)?$/.test(x));
      if(d>=0 && h.some(x=>/distance|^km$/.test(x)) && h.some(x=>/(pts|points|score)/.test(x))){ hi=i; dc=d; break; }
    }
    if(hi<0) return;
    const hdr=rows[hi].map(x=>S(x).toLowerCase()); const g=re=>hdr.findIndex(x=>re.test(x));
    const c={d:g(/distance|^km$/),hb:g(/harsh\s*brak.*(pts|points)/),ha:g(/harsh\s*acc.*(pts|points)/),osp:g(/over-?\s*speed.*(pts|points)/),hosp:g(/^hos.*(pts|points)/),
             os:g(/over-?\s*speed.*(dur|sec)/),hos:g(/hos.*(dur|over-?limit|sec)/),rt:g(/(reported|total).*(pts|points)/),pr:g(/^profile/)};
    if(c.hb<0&&c.ha<0&&c.osp<0&&c.hosp<0) return;
    const title=S(((rows.slice(0,hi).find(r=>weekFromTitle(S((r||[])[0])))||[])[0])||'')||S((sRows[0]||[])[0]);
    const start=weekFromTitle(title)||weekFromTitle(S((rows[0]||[])[0]))||weekFromTitle(fname)||prevWeekStart();   // app weeks run Mon-Sun
    const v=(r,k)=>c[k]>=0?(N(r[c[k]])||0):0; const drivers=[];
    for(let i=hi+1;i<rows.length;i++){
      const r=rows[i]||[]; const nm=S(r[dc]); if(!nm||/^(total|average|fleet|summary|grand)/i.test(nm)) continue;
      const o={n:nm,d:v(r,'d'),hb:v(r,'hb'),ha:v(r,'ha'),osp:v(r,'osp'),hosp:v(r,'hosp'),os:c.os>=0?dur(r[c.os],hdr[c.os]):0,hos:c.hos>=0?dur(r[c.hos],hdr[c.hos]):0,rt:v(r,'rt'),pr:c.pr>=0?S(r[c.pr]).slice(0,60):''};
      o.t=o.d>0?Math.round((o.hb+o.ha+o.osp+o.hosp)/o.d*1e5)/1e3:0;
      if(o.d<minKm) o.na=1;
      if(o.hosp>0 && o.hos>0 && o.hosp!==Math.floor(o.hos/hosSec)) o.chk=1;
      const vv=[]; if(o.hb>0) vv.push('HB'); if(o.ha>0) vv.push('HA'); if(o.osp>0) vv.push('OS'); if(o.hosp>0) vv.push('HOS'); if(vv.length) o.v=vv;
      drivers.push(o);
    }
    if(drivers.length){
      const w={n:ordOf(start),start,label:'Week of '+start,range:wkLabel({start}),drivers};
      const i=out.weeks.findIndex(x=>x.n===w.n); if(i>-1) out.weeks[i]=w; else out.weeks.push(w);
      out.notes.push('Driver scorecard read from sheet "'+n+'" ('+drivers.length+' drivers, '+wkLabel({start})+').');
    }
  });
  out.weeks.sort((a,b)=>a.n-b.n);
  // dates typed as real Excel dates arrive as serial numbers: turn them back into dd/mm/yyyy
  const fix=s=>{ s=String(s==null?'':s); if(/^\d{5}$/.test(s)){ const d=new Date(Date.UTC(1899,11,30)+Number(s)*864e5); return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear(); } return s; };
  ['drills','training'].forEach(k=>(out[k]||[]).forEach(x=>{ x.date=fix(x.date); if(x.expiry!==undefined) x.expiry=fix(x.expiry); }));
  // tell the user about sheets that look like scorecards but were not read, instead of failing silently
  const unread=wb.SheetNames.filter(n=>/score|driver/i.test(n)&&!handled.test(n)&&!skip.test(n)&&!out.notes.some(t=>t.indexOf('"'+n+'"')>-1));
  if(unread.length) out.notes.push('Sheet(s) not recognised as a driver scorecard: '+unread.join(', ')+'. Need columns: Driver, Distance, and penalty points.');
  return out;

const J_TIMES=[['tLeftYard','Left the yard'],['tGateIn','Gate-in at loading location'],['tLoadStart','Loading starts'],['tLoadEnd','Loading ends'],['tLeftLoading','Left loading location'],['tArriveOff','Arrived at offloading location'],['tLeftOff','Left offloading location'],['tBackLoading','Back at loading location'],['tBackYard','Back at the yard']];

function jNow(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function jMs(v){ const t=Date.parse(v); return isNaN(t)?null:t; }
function jCalc(r){
  const g=k=>jMs(r[k]), h=(a,b)=>(a!==null&&b!==null&&b>=a)?(b-a)/3600000:null;
  const out=h(g('tLeftLoading'),g('tArriveOff')), ret=g('tBackLoading')!==null?g('tBackLoading'):g('tBackYard'), back=h(g('tLeftOff'),ret);
  return {wait:h(g('tGateIn'),g('tLoadStart')), load:h(g('tLoadStart'),g('tLoadEnd')), toYard:h(g('tLeftYard'),g('tGateIn')), out, back, total:(out!==null&&back!==null)?out+back:(out!==null?out:null), cycle:h(g('tLeftYard'),g('tBackYard')!==null?g('tBackYard'):g('tBackLoading'))};
}
function jH(v){ return v===null||v===undefined?'—':(v<1?Math.round(v*60)+' min':fmt(v,1)+' h'); }
function jStampCount(r){ return J_TIMES.filter(([k])=>r[k]).length; }

function jCalcText(r){ const c=jCalc(r); const bits=[]; if(c.toYard!==null) bits.push(`Yard → gate <b>${jH(c.toYard)}</b>`); if(c.wait!==null) bits.push(`Gate wait <b>${jH(c.wait)}</b>`); if(c.load!==null) bits.push(`Loading <b>${jH(c.load)}</b>`); if(c.out!==null) bits.push(`Loaded transit <b>${jH(c.out)}</b>`); if(c.back!==null) bits.push(`Return transit (to loading location or yard) <b>${jH(c.back)}</b>`); if(c.total!==null) bits.push(`<span style="color:var(--teal);">Transit time <b>${jH(c.total)}</b></span>`); return bits.length?bits.join(' · '):'Times are optional: stamp each step with “Now” as it happens, or type them in. Transit time = left loading → arrived offloading + left offloading → back at the loading location, or back at the yard if the truck returned there instead.'; }

function mxScore(range){
  const M=STATE.mix, idx=makeDriverIndex(), out={}; if(!M.rows||!range) return {list:[],days:periodDaysRange(range)};
  const get=c=>out[c.name]||(out[c.name]={name:c.name,pts:0,n:0,cats:{},dates:{}});
  M.rows.forEach(r=>{ if(r[0]<range.start||r[0]>range.end) return; const cat=mxCat(r[5]||('Event type '+r[4])); if(!cat) return; const c=mxDriverName(r,idx); if(!c) return; const o=get(c); o.pts+=cat[2]*r[6]; o.n+=r[6]; o.cats[cat[1]]=(o.cats[cat[1]]||0)+r[6]; o.dates[r[0]]=(o.dates[r[0]]||0)+cat[2]*r[6]; });
  // drivers who drove in the period but had no events are clean (they count for the "no violations" list)
  (STATE.data.transport||[]).concat(STATE.data.journey||[]).forEach(r=>{ if(r.driverName&&r.date>=range.start&&r.date<=range.end){ const c=idx.ensure(r.driverName); if(c) get(c); } });

function bestDriversData(P){

  (D.journey||[]).filter(r=>inPeriod(r.date,P)&&r.driverName).forEach(r=>{ const c=idx.ensure(r.driverName); if(!c) return; const o=get(c); const dv=num(r.deviations); if(dv>0){ o.viol+=dv; o.why.push(dv+' route deviation'+(dv>1?'s':'')); } if(r.driverHoursViolation==='Yes'){ o.viol++; o.why.push('driving-hours violation'); } });
  (D.pretrip||[]).filter(r=>inPeriod(r.date,P)&&r.driverName&&r.alcoholTest==='No').forEach(r=>{ const c=idx.ensure(r.driverName); if(!c) return; const o=get(c); o.viol+=2; o.why.push('failed alcohol test'); });
  const wk=(((D.hsseScores||{}).weeks)||[]).find(w=>(w.start||(typeof startOfOrd==='function'?startOfOrd(w.n):''))===R.start);
  if(wk) (wk.drivers||[]).forEach(d=>{ if(d.na||!d.n) return; const c=idx.ensure(d.n); if(!c||!rec[c.name]) { if(c&&num(d.t)>0){ const o=get(c); o.viol++; o.why.push('HSSE scorecard '+fmt(num(d.t),1)+' pts'); } return; } if(num(d.t)>0){ rec[c.name].viol++; rec[c.name].why.push('HSSE scorecard '+fmt(num(d.t),1)+' pts'); } });
  if(STATE.mix.rows&&!STATE.mix.empty){ mxScore(R).list.forEach(x=>{ if(x.pts>0){ const o=rec[x.name]||(rec[x.name]={name:x.name,trips:0,viol:0,why:[],bd:0,down:0,tripDays:0,hasMaint:false}); o.viol+=x.n; o.why.push(x.n+' MiX event'+(x.n>1?'s':'')); } }); }
  try{ maintDriverWeek(R.start).forEach(m=>{ const nm=idx.ensure(m.name); if(!nm) return; const o=rec[nm.name]; if(!o) return; o.bd=m.bd||0; o.down=m.down||0; o.tripDays=m.tripDays||0; o.hasMaint=true; }); }catch(e){}

}

async function jbReadFile(file){
  if(typeof XLSX==='undefined'){ STATE.jBulk={err:'The spreadsheet reader did not load. Check your internet connection and reload.'}; render(); return; }
  try{ const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array'}); let best=null;
    for(const n of wb.SheetNames){ const aoa=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}); const r=jbParse(aoa); if(r.rows){ best=r; break; } if(!best) best=r; }
    STATE.jBulk=Object.assign({name:file.name},best); }catch(e){ STATE.jBulk={err:'Could not read that file: '+(e&&e.message?e.message:e)}; }
  render();
}

function bdStats(start,end){
  const all=(STATE.data.maintenance||[]).filter(r=>isBd(r)&&r.date&&r.date>=start&&r.date<=end), fleet=Math.max(1,(STATE.data.vehicles||[]).length);
  const road=all.filter(isRoadBd), rep=all.filter(isRepairJob), rt=new Set(road.map(r=>r.vehicleId)).size, pt=new Set(rep.map(r=>r.vehicleId)).size;
  return {n:road.length,trucks:rt,rate:rt/fleet*100,rn:rep.length,rtrucks:pt,rrate:pt/fleet*100,fleet};
}
function maintBreakdownBasis(){
  const t=todayStr(), fleet=Math.max(1,(STATE.data.vehicles||[]).length);
  const days=[...Array(7)].map((_,i)=>addDays(t,-i)).map(d=>({l:fmtDate(d)+(d===t?' (today)':''),s:d,e:d}));
  const wk0=wkStart(t), weeks=[...Array(8)].map((_,i)=>{ const s=addDays(wk0,-7*i); return {l:rangeText({start:s,end:addDays(s,6)})+(i===0?' (this week)':''),s,e:addDays(s,6)}; });
  const m0=monthStartOf(t), months=[...Array(6)].map((_,i)=>{ const s=addMonthsStr(m0,-i); return {l:new Date(s+'T00:00:00').toLocaleDateString(undefined,{month:'long',year:'numeric'})+(i===0?' (so far)':''),s,e:monthEndOf(s)}; });
  const pill=(n,r)=>n===0?'<span class="tag green">0%  ✓</span>':'<span class="tag red">'+fmt(r,1)+'%</span>';
  const tbl=(title,rows)=>`<div class="card"><div style="font-weight:600;margin-bottom:6px;">${title}</div><div class="table-wrap" style="border:none;background:none;"><table><thead><tr><th></th><th title="Trucks that broke down on the road">Roadside trucks</th><th>Breakdown rate</th><th title="Trucks that needed a workshop repair">Repair trucks</th><th>Repair rate</th></tr></thead><tbody>${rows.map(x=>{ const s=bdStats(x.s,x.e); return `<tr><td style="white-space:normal;">${esc(x.l)}</td><td>${s.trucks}</td><td>${pill(s.trucks,s.rate)}</td><td>${s.rtrucks}</td><td>${pill(s.rtrucks,s.rrate)}</td></tr>`; }).join('')}</tbody></table></div></div>`;
  return `<div class="section-title"><span>Breakdown rate and repair rate — how they are measured</span><div class="line"></div><span class="dim small">Both targets: 0 every day, week and month</span></div>
  <div class="grid cols-2" style="margin-bottom:12px;">
   <div class="card" style="border-left:3px solid var(--red);"><div style="font-weight:600;">Breakdown rate (roadside)</div><div class="small" style="line-height:1.75;margin-top:4px;"><b>= trucks that broke down on the road in the period ÷ trucks in the fleet (${fleet}) × 100.</b><br>Counts Breakdown entries logged as “Roadside breakdown”. Target 0.</div></div>
   <div class="card" style="border-left:3px solid var(--amber);"><div style="font-weight:600;">Repair rate (workshop)</div><div class="small" style="line-height:1.75;margin-top:4px;"><b>= trucks that needed a repair in the workshop or yard in the period ÷ trucks in the fleet (${fleet}) × 100.</b><br>Counts entries logged as “Repair (workshop / yard)” and the repair jobs raised automatically when an inspection or pre/post-trip check fails an item. Target 0.</div></div></div>
  <div class="dim small" style="margin-bottom:12px;line-height:1.7;">A truck counts once per period, however many times it was involved. Scheduled services never count. The same rule is used for the day, the week (Mon–Sun) and the month. One truck = ${fmt(100/fleet,1)}% of the fleet. If an entry sits in the wrong group, open it in the Maintenance Log, press Edit and change “where?”.</div>

async function wsSaveJc(form){
  const id=form.getAttribute('data-ws-jc'); const j=STATE.data.jobcards.find(x=>x.id===id); if(!j) return;
  const act=arguments[1]||'save'; const fd=new FormData(form); const g=n=>String(fd.get(n)||'').trim();
  ['odometer','complaint','findings','rootCause','work','parts','torque','testResult','technician','partsCost','labourCost','decision','qcInspector','handover'].forEach(n=>{ j[n]=g(n); });
  QC_ITEMS.forEach(([k])=>{ j[k]=fd.get(k)?'1':''; });
  const d=STATE.data.defects.find(x=>x.id===j.defectId), m=d&&STATE.data.maintenance.find(x=>x.id===d.mId);
  if(act==='qc'){
    if(!j.decision){ showToast('Choose a release decision.'); return; }
    if(j.decision==='Rework / hold'){ j.status='Rework'; if(d) d.status='In workshop'; showToast('Sent back for rework.'); }
    else{
      if(!j.work||!j.technician){ showToast('Fill in the work performed and technician before release.'); return; }
      if(QC_ITEMS.some(([k])=>!j[k])){ showToast('Tick every QC check before releasing.'); return; }
      if(!j.qcInspector){ showToast('Enter the QC inspector name.'); return; }
      j.status='Released'; j.qcDate=todayStr()+' '+nowTime(); j.closedDate=todayStr();
      if(d){ d.status='Closed'; d.closedDate=todayStr(); d.qcRef=j.ref; if(j.decision!=='Released to service') d.vehStatus='Restricted (authorized)'; else if(d.vehStatus==='OUT OF SERVICE') d.vehStatus='Roadworthy'; }
      if(m){ m.status='Completed'; m.completedDate=todayStr(); if(!num(m.downtimeHours)&&d&&d.date){ const hh=(Date.now()-Date.parse(d.date+'T'+(d.time||'00:00')))/36e5; if(hh>0&&hh<24*60) m.downtimeHours=String(Math.round(hh*10)/10); } const c=num(j.partsCost)+num(j.labourCost); if(c) m.cost=String(c); wsDirty.add('maintenance'); }
      wsNotify('Truck released',`${vehicleLabel(j.vehicleId)} released to service — ${j.ref}`,3);
      showToast('Released to service. Defect closed and maintenance job completed.');
    }
  } else {
    j.status=(j.work&&j.technician)?'QC pending':(j.technician||j.findings||j.work)?'Open':j.status; if(d&&d.status==='Open'&&(j.technician||j.work)) d.status=(j.work?'QC pending':'In workshop');
    if(j.work&&j.technician&&j.status!=='Released') j.status='QC pending';
    showToast('Job card saved.');
  }
  wsDirty.add('jobcards'); wsDirty.add('defects'); STATE.wsJc=null; await wsFlush();
}

/* ---------- RCA alerts ---------- */
function wsRcaAlerts(){
  const D=STATE.data, out=[]; const rcas=D.rcas||[];
  const fnd=key=>rcas.find(r=>r.key===key);
  const rep=(D.maintenance||[]).filter(m=>m.type!=='Scheduled'&&m.vehicleId&&m.date>=wsDays(90)).sort((a,b)=>a.date<b.date?-1:1);
  const byTC={}, byT={}, byC={};
  rep.forEach(m=>{ const c=m.component||'Other'; (byTC[m.vehicleId+'|'+c]=byTC[m.vehicleId+'|'+c]||[]).push(m); (byT[m.vehicleId]=byT[m.vehicleId]||[]).push(m); (byC[c]=byC[c]||[]).push(m); });
  Object.keys(byTC).forEach(k=>{ const L=byTC[k]; for(let i=1;i<L.length;i++){ if((Date.parse(L[i].date)-Date.parse(L[i-1].date))/864e5<=60){ const [v,c]=k.split('|'); const key='rep|'+k+'|'+L[i].date; out.push({key,kind:'Repeat repair',vehicleId:v,component:c,date:L[i].date,text:`${vehicleLabel(v)} — repeat ${c.toLowerCase()} repair (${L.length} in 90 days)`,rca:fnd(key)}); break; } } });
  Object.keys(byT).forEach(v=>{ const L=byT[v].filter(m=>m.date>=wsDays(30)); if(L.length>=3){ const key='freq|'+v+'|'+wsMonthKey(L[L.length-1].date); out.push({key,kind:'Frequent repairs',vehicleId:v,date:L[L.length-1].date,text:`${vehicleLabel(v)} — ${L.length} repair jobs in 30 days`,rca:fnd(key)}); } });
  Object.keys(byC).forEach(c=>{ const L=byC[c].filter(m=>m.date>=wsDays(30)); const trucks=new Set(L.map(m=>m.vehicleId)); if(trucks.size>=3){ const key='fleet|'+c+'|'+wsMonthKey(L[L.length-1].date); out.push({key,kind:'Fleetwide repeat',component:c,date:L[L.length-1].date,text:`Fleetwide — ${c.toLowerCase()} failures on ${trucks.size} trucks in 30 days`,rca:fnd(key)}); } });
  (D.breakdowns||[]).filter(b=>(b.wheelOff==='Yes'||b.incident==='Yes')&&b.date>=wsDays(90)).forEach(b=>{ const key='inc|'+b.id; out.push({key,kind:'Incident',vehicleId:b.vehicleId,date:b.date,text:`${vehicleLabel(b.vehicleId)} — ${b.wheelOff==='Yes'?'wheel-off':'road incident'} at ${b.location||'roadside'}`,rca:fnd(key)}); });
  (D.defects||[]).filter(d=>d.severity==='Critical'&&d.system==='Brake'&&d.date>=wsDays(30)).forEach(d=>{ const key='crit|'+d.id; out.push({key,kind:'Critical brake defect',vehicleId:d.vehicleId,date:d.date,text:`${vehicleLabel(d.vehicleId)} — critical brake defect ${d.ref}`,rca:fnd(key)}); });
  (D.safety||[]).filter(s=>num(s.incidents)>0&&s.date>=wsDays(30)).forEach(s=>{ const key='sinc|'+s.id; out.push({key,kind:'Incident',date:s.date,text:`${num(s.incidents)} safety incident(s) logged on ${fmtDate(s.date)}`,rca:fnd(key)}); });
  return out.map(wsAlertEnrich).sort((a,b)=>(a.rca?1:0)-(b.rca?1:0)||(a.date<b.date?1:-1));
}
function wsMonthKey(d){ return String(d).slice(0,7); }

function wsAlertEnrich(a){
  const m={'Repeat repair':'Repeat repair — same truck, same system','Frequent repairs':'Frequent repairs on one truck','Fleetwide repeat':'Same failure on several trucks','Critical brake defect':'Brake'}[a.kind];
  a.rtype=a.kind==='Incident'?(/wheel-off/.test(a.text)?'Wheel-off / wheel loss':/road incident/.test(a.text)?'Road collision':'Other incident (specify)'):(m||'Other incident (specify)');

async function wsSaveRca(form){

function wsMttrRows(){
  const R=(STATE.data.maintenance||[]).filter(m=>isRepairJob(m));

    const L=R.filter(m=>inPeriod(m.date,p)), T=L.filter(m=>num(m.downtimeHours)>0), h=T.map(m=>num(m.downtimeHours)).sort((a,b)=>a-b);
    const avg=h.length?h.reduce((a,b)=>a+b,0)/h.length:null, med=h.length?(h.length%2?h[(h.length-1)/2]:(h[h.length/2-1]+h[h.length/2])/2):null;

function wsTyreKm(t){ return t.removeOdo&&t.fitOdo&&num(t.removeOdo)>num(t.fitOdo)?num(t.removeOdo)-num(t.fitOdo):0; }
function wsTyreTotal(t){ return num(t.cost)+num(t.repairCost)+num(t.retreadCost)+num(t.disposalCost); }
function wsTyreCosts(from){

  D.journey.filter(r=>r.apprReq).forEach(r=>add('Trip','journey',r,LOGI,`${vehicleLabel(r.vehicleId)} · ${ROUTES[r.route]?ROUTES[r.route].label:(r.route||'')}`,`${fmtDate(r.date)} · driver ${r.driverName||'—'} · transit ${r.durationActual||'—'} h · delay ${r.delayHrs||0} h · deviations ${r.deviations||0}`));
  D.jplans.forEach(p=>{ if(!p.apprReq) return; add('Journey plan','jplans',p,LOGI,`${p.ref} · ${vehicleLabel(p.vehicleId)} · ${p.origin} → ${p.dest}`,`${fmtDate(p.date)} · driver ${p.driverName} · ${p.route}`); });
  D.pretrip.filter(r=>r.apprReq).forEach(r=>add('Failed alcohol test','pretrip',r,LOGI,`${r.driverName||'Driver'} · ${vehicleLabel(r.vehicleId)}`,`${fmtDate(r.date)} ${r.time||''} — confirm the driver was stood down and not allowed to drive`));

  D.repairReqs.forEach(q=>{ if(q.stage!=='GM'&&q.stage!=='MD'&&q.stage!=='Approved'&&q.stage!=='Rejected') return; const pend=q.stage==='GM'||q.stage==='MD';

  let note=''; if(act==='reject'){ note=prompt('Reason for rejecting (shown in history):')||''; if(!note) return; }
  r.appr={status:act==='approve'?'Approved':'Rejected',by:wsWho(),at:new Date().toISOString(),note};
  if(coll==='rcas'&&act==='reject'){ r.status='Actions done'; r.apprReq=''; }
  if(coll==='defects'&&act==='approve'){ r.vehStatus='Restricted (authorized)'; }
  showToast(act==='approve'?'Approved.':'Rejected.'); await persist(coll);
}

async function wsReqDecide(q,act,rcaText){
  const log=(what,note)=>{ q.log=(q.log||[]).concat([{at:new Date().toISOString(),what,by:wsWho(),note:note||''}]); };
  if(act==='rca'){ if(!wsAuth(['Maintenance Manager'],'submit the RCA')) return; if(!rcaText){ showToast('Write the RCA first.'); return; } q.rca=rcaText; q.rcaBy=wsWho(); q.stage='GM'; log('RCA submitted'); wsNotify('Repair request awaiting GM',`${q.ref} · ${vehicleLabel(q.vehicleId)} · ${naira(num(q.total))}`,3); }
  else if(act==='approve'){
    if(q.stage==='GM'){ if(!wsAuth(['General Manager'],'authorize this request')) return; q.stage='MD'; q.gmAt=new Date().toISOString(); log('Authorized'); wsNotify('Repair request awaiting MD',`${q.ref} · ${vehicleLabel(q.vehicleId)} · ${naira(num(q.total))}`,4); }
    else if(q.stage==='MD'){ if(!wsAuth(['MD'],'approve this request')) return; q.stage='Approved'; q.mdAt=new Date().toISOString().slice(0,10); log('Approved'); wsNotify('Repair request approved',`${q.ref} · ${vehicleLabel(q.vehicleId)} · ${naira(num(q.total))}`,3); }
  } else if(act==='reject'){
    const role=q.stage==='MD'?'MD':'General Manager'; if(!wsAuth([role],'reject this request')) return; const n=prompt('Reason for rejecting:')||''; if(!n) return; q.stage='Rejected'; log('Rejected',n);
  }
  STATE.wsReq=(act==='rca'||act==='approve'||act==='reject')?null:STATE.wsReq; showToast('Request updated.'); await persist('repairReqs');
}

const WS_HOOKS={
  defect(rec){ const d=raiseDefect(rec); STATE.wsView='faults'; return 'handled'; },
  breakdown(rec){
    if(rec.restoredDate&&rec.restoredTime&&rec.date&&rec.time){ const h=(Date.parse(rec.restoredDate+'T'+rec.restoredTime)-Date.parse(rec.date+'T'+rec.time))/36e5; if(h>=0) rec.downHrs=String(Math.round(h*10)/10); }
    const m={id:uid(),date:rec.date,vehicleId:rec.vehicleId,type:'Breakdown',kind:'road',component:wsSys2comp(rec.system),otherDetail:wsSysDetail(rec.system)||undefined,status:'Open',bdId:rec.id,notes:`Roadside breakdown: ${rec.desc||''} (${rec.location||''})`};
    STATE.data.maintenance=[...STATE.data.maintenance,m]; wsDirty.add('maintenance');
    const d=raiseDefect({vehicleId:rec.vehicleId,date:rec.date,time:rec.time,location:rec.location,reportedBy:rec.driverName,system:rec.system,desc:rec.desc||'Roadside breakdown',severity:rec.severity||'Major',vehStatus:'OUT OF SERVICE',source:'Roadside breakdown',mId:m.id,immediate:rec.action});
    rec.defectId=d.id; rec.ref=wsRef('breakdowns','RB'); return null;
  },
  tyre(rec){ return null; },
  tyreInsp(rec){
    const t=num(rec.tread), bad=rec.condition!=='OK', low=t>0&&t<3;
    if(bad||low){ const crit=/Bulge|Failed/.test(rec.condition); raiseDefect({vehicleId:rec.vehicleId,date:rec.date,system:'Tyre/wheel',desc:`Tyre ${rec.position}: ${rec.condition}${t?`, tread ${t} mm`:''}${rec.action?' — '+rec.action:''}`,severity:crit?'Critical':'Major',source:'Tyre inspection',reportedBy:rec.inspector}); showToast('Tyre defect raised in the Fault Log.'); }
    return null;
  },
  jsa(rec){ rec.ref=wsRef('jsas','JSA'); if(rec.jobCardId&&!rec.vehicleId){ const j=STATE.data.jobcards.find(x=>x.id===rec.jobCardId); if(j) rec.vehicleId=j.vehicleId; } STATE.jsaJob=''; return null; },
  jplan(rec){ rec.ref=wsRef('jplans','JP'); rec.apprReq='1'; if(rec.planId){ const pl=(STATE.data.routePlans||[]).find(x=>x.id===rec.planId); if(pl){ rec.routeKey=pl.routeKey; rec.planName=pl.name; if(!rec.route) rec.route=(pl.stops||[]).map(x=>x.name).join(' → '); } } wsNotify('Journey plan awaiting approval',`${rec.ref} · ${vehicleLabel(rec.vehicleId)} · ${rec.origin} → ${rec.dest}`,3); return null; },
};

/* ===== Trip timings filled from the Live Map trail ===== */
function jtLocal(ts){ const d=new Date(ts*1000); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function jtPlaceFor(vid,date,routeKey){
  const jp=(STATE.data.jplans||[]).filter(p=>p.vehicleId===vid&&p.date===date&&p.planId).pop();
  let plan=jp?jPlans().find(x=>x.id===jp.planId):null;
  if(!plan&&routeKey) plan=jPlans().find(x=>x.routeKey===routeKey&&jPlanPts(x).length>=2);
  if(!plan){ const a=fwAssign(vid); if(a&&a.planId) plan=jPlans().find(x=>x.id===a.planId); }
  if(!plan) return null; const pts=jPlanPts(plan); return pts.length>=2?{A:pts[0],B:pts[pts.length-1],plan}:null;
}
function jtGroups(P,pt,r){ const out=[]; let g=null; P.forEach((p,i)=>{ const inside=fwHav(p[1],p[2],pt[0],pt[1])<=r; if(inside){ if(!g){ g={i0:i,t0:p[0],i1:i,t1:p[0]}; out.push(g); } else { g.i1=i; g.t1=p[0]; } } else g=null; }); return out; }
function jtYard(P){
  const st=fwStops(P,60); const cl=[]; st.forEach(s=>{ let c=cl.find(x=>fwHav(x.lat,x.lon,s.lat,s.lon)<0.4); if(!c){ c={lat:s.lat,lon:s.lon,min:0,n:0}; cl.push(c); } c.min+=s.min; c.n++; });
  cl.sort((a,b)=>b.min-a.min); return cl[0]&&cl[0].min>=240?[cl[0].lat,cl[0].lon]:null;
}
async function jtFromLive(vid,date,routeKey,skip){
  const v=findVehicle(vid); if(!v) return {err:'Choose the truck first.'}; if(!date) return {err:'Choose the trip date first.'};
  const L=STATE.live; if(!GAS_CONFIGURED||L.watchOff) return {err:'The Live Map is not connected yet.'};
  const hrs=Math.ceil((Date.now()-Date.parse(date+'T00:00:00'))/3600000)+36; if(hrs>170) return {err:'The Live Map only keeps about 7 days of trail — that date is too old. Enter the times by hand.'};
  const place=jtPlaceFor(vid,date,routeKey); if(!place) return {err:'Pick a route that has an approved route with map stops (Journey Mgmt → Approved routes) so the Live Map knows the loading and offloading points.'};
  for(let i=0;i<40&&L.histBusy;i++) await new Promise(r=>setTimeout(r,250));
  await fetchHist(Math.max(hrs,48)); for(let i=0;i<60&&L.histBusy;i++) await new Promise(r=>setTimeout(r,250));
  const hs=fwHistFor(null,v.regNo); if(!hs||!hs.p||!hs.p.length) return {err:'The Live Map has no saved trail for this truck. Make sure the Watch script logger is running (fdInstallLogger).'};
  const t0=Date.parse(date+'T00:00:00')/1000; const P=hs.p.filter(p=>p[0]>=t0-36*3600).sort((a,b)=>a[0]-b[0]);
  const yard=jtYard(hs.p), far=yard&&(fwHav(yard[0],yard[1],place.A[0],place.A[1])<1.5||fwHav(yard[0],yard[1],place.B[0],place.B[1])<1.5);
  const Y=(yard&&!far)?jtGroups(P,yard,0.5):[], GA=jtGroups(P,place.A,1.0).filter(g=>g.t0>=t0), GB=jtGroups(P,place.B,1.0);
  const visit=GA[skip||0]; if(!visit) return {err:'No visit to the loading location was found in the Live Map trail on '+fmtDate(date)+'.'};
  const out={}, put=(k,ts)=>{ if(ts) out[k]=jtLocal(ts); };
  const after=g=>P[g.i1+1]?P[g.i1+1][0]:null;
  put('tGateIn',visit.t0);
  const sub=P.slice(visit.i0,visit.i1+2); const stops=fwStops(sub,10).filter(s=>fwHav(s.lat,s.lon,place.A[0],place.A[1])<=1.0).sort((a,b)=>b.min-a.min);
  if(stops[0]){ put('tLoadStart',stops[0].t0); if(!stops[0].open) put('tLoadEnd',stops[0].t1); }
  const lv=after(visit); if(lv) put('tLeftLoading',lv);
  const ly=Y.filter(g=>g.t1<=visit.t0&&visit.t0-g.t1<=30*3600).pop(); if(ly&&after(ly)) put('tLeftYard',after(ly));
  const ob=GB.filter(g=>g.t0>(lv||visit.t1))[0];
  if(ob){ put('tArriveOff',ob.t0); const lo=after(ob); if(lo){ put('tLeftOff',lo);
    const nextA=GA.filter(g=>g.t0>lo)[0], nextY=Y.filter(g=>g.t0>lo)[0];
    if(nextY&&(!nextA||nextY.t0<nextA.t0)) put('tBackYard',nextY.t0); else if(nextA) put('tBackLoading',nextA.t0); } }
  return {times:out,place:place.plan.name};
}

function jtAttach(){
  const app=document.getElementById('app'); if(!app) return;
  app.querySelectorAll('[data-jt-live]').forEach(b=>b.addEventListener('click',async()=>{
    const pre=b.getAttribute('data-jt-live'), root=b.closest('form'), msg=document.getElementById(pre+'-live'); let vid,date,rk;
    if(root.hasAttribute('data-jt-form')){ const r=(STATE.data.journey||[]).find(x=>x.id===root.getAttribute('data-jt-form')); if(!r) return; vid=r.vehicleId; date=r.date; rk=r.route; }
    else { vid=root.elements.vehicleId.value; date=root.elements.date.value; rk=root.elements.route&&root.elements.route.value; }
    const others=(STATE.data.journey||[]).filter(x=>x.vehicleId===vid&&x.date===date&&x.tGateIn&&(!root.hasAttribute('data-jt-form')||x.id!==root.getAttribute('data-jt-form'))).length;
    b.disabled=true; msg.textContent='Reading the GPS trail…';
    let res; try{ res=await jtFromLive(vid,date,rk,others); }catch(e){ res={err:'Could not read the Live Map ('+(e&&e.message||e)+').'}; }
    b.disabled=false; if(res.err){ msg.innerHTML='<span style="color:var(--amber);">'+esc(res.err)+'</span>'; return; }
    let n=0, skipped=0; Object.keys(res.times).forEach(k=>{ const inp=root.querySelector('[name="'+k+'"]'); if(!inp) return; if(inp.value){ skipped++; return; } inp.value=res.times[k]; n++; });
    const f=root.querySelector('[data-jt]'); if(f) f.dispatchEvent(new Event('input',{bubbles:true}));
    msg.innerHTML=`<span style="color:var(--green);">Filled ${n} time${n===1?'':'s'} from the Live Map (${esc(res.place)})${skipped?`, kept ${skipped} you already entered`:''}.</span> They are estimated from GPS (gate-in = within 1 km of the loading point, loading = longest stop there) — check them before saving.`;
  }));
}
