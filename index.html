async function downloadTransportTemplate(dateStr){
  dateStr=dateStr||todayStr(); const vs=(STATE.data.vehicles||[]).slice().sort((a,b)=>String(a.regNo).localeCompare(String(b.regNo),undefined,{numeric:true}));
  const routes=Object.keys(ROUTES).map(k=>ROUTES[k].label), mats=materialNames();
  const name='FleetDesk_Transport_Template_'+dateStr+'.xlsx';
  try{ triggerDownload(buildTransportXlsx(dateStr,vs,routes,mats),name); return 'ok'; }
  catch(e){
    console.warn('Template builder failed, using plain template',e);
    if(typeof XLSX==='undefined'){ alert('Could not build the template: '+(e&&e.message?e.message:e)); return 'failed'; }
    const aoa=[BULK_HEADERS.map(h=>h[0])]; const n=Math.max(vs.length+30,60);
    for(let i=0;i<n;i++) aoa.push([dateStr,vs[i]?vs[i].regNo:'','','','','','','','','','','','']);
    const wb=XLSX.utils.book_new(); const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=BULK_HEADERS.map(h=>({wch:h[1]}));
    XLSX.utils.book_append_sheet(wb,ws,'Transport Entries');
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Routes (use these exact names)'],...routes.map(r=>[r])]),'Lists');
    XLSX.writeFile(wb,name); return 'sheetjs';
  }
}
function xlDate(v){
  if(v===null||v===undefined||v==='') return '';
  if(v instanceof Date) return isoLocal(new Date(v.getUTCFullYear(),v.getUTCMonth(),v.getUTCDate()));
  if(typeof v==='number'&&v>20000&&v<80000){ const p=XLSX.SSF.parse_date_code(v); return p?`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`:''; }
  const s=String(v).trim(); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  return parseLooseDate(s);
}
function matchRoute(txt){
  const k=normKey(txt); if(!k) return '';
  if(k==='gypsumadumbu') return 'gypsum_adumbu'; if(k==='eastdeliveries'||k==='east') return 'east';
  const keys=Object.keys(ROUTES); let hit=keys.find(x=>normKey(x)===k||normKey(ROUTES[x].label)===k); if(hit) return hit;
  const c=keys.filter(x=>normKey(ROUTES[x].label).includes(k)||k.includes(normKey(x))); return c.length===1?c[0]:'';
}
function parseBulkManual(wb){
  const ws=wb.Sheets['Transport Entries']||wb.Sheets[wb.SheetNames[0]]; if(!ws) return {rows:[],err:'No sheet found in that file.'}; readPresets(wb);
  const grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  let hi=grid.findIndex((r,i)=>i<12&&r.map(hdrKey).includes('date')&&r.map(hdrKey).includes('truck'));
  if(hi<0) return {rows:[],err:'Could not find the column headings (Date, Truck Reg No, Driver Name …). Please use the FleetDesk template and do not rename the headings.'};
  const cols={}; grid[hi].forEach((h,i)=>{ const k=hdrKey(h); if(k&&cols[k]===undefined) cols[k]=i; });
  const vmap={}; (STATE.data.vehicles||[]).forEach(v=>{ vmap[normKey(v.regNo)]=v; });
  const ex={}; (STATE.data.transport||[]).forEach(r=>{ ex[[r.date,trKey(r),r.route].join('|')]=r.id; });
  const seen={}; const rows=[];
  for(let i=hi+1;i<grid.length;i++){
    const g=k=>cols[k]===undefined?'':grid[i][cols[k]];
    const driver=String(g('driver')||'').trim(), routeTxt=String(g('route')||'').trim(), truckTxt=String(g('truck')||'').trim();
    const nums=['tripsTarget','tripsActual','tonnageTarget','tonnageActual','turnaroundTarget','turnaroundActual','transitTarget','transitActual'];
    const hasData=driver||routeTxt||g('tripsActual')!==''||g('tonnageActual')!==''||g('tonnageTarget')!==''||g('turnaroundActual')!==''||g('transitActual')!=='';
    if(!hasData) continue;                                     // truck listed but did not run: ignore
    const r={line:i+1,date:xlDate(g('date')),truckTxt,driver,routeTxt,errs:[],warns:[]};
    const mt=matchTruck(truckTxt); const v=mt.v; r.vehicleId=v?v.id:''; r.regNo=v?v.regNo:truckTxt; r.regNoText=v?'':truckTxt.toUpperCase();
    r.route=matchRoute(routeTxt);
    r.material=String(g('material')||'').trim();
    nums.forEach(k=>{ const raw=g(k); if(raw===''||raw===null) { r[k]=''; return; } const n=parseFloat(String(raw).replace(/,/g,'')); if(isNaN(n)||n<0){ r.errs.push('“'+raw+'” is not a valid number for '+k.replace(/([A-Z])/g,' $1').toLowerCase()); r[k]=''; } else r[k]=n; });
    if(!r.date) r.errs.push('Date missing or not recognised');
    if(!truckTxt) r.errs.push('Truck Reg No missing'); else if(!v) r.warns.push('Truck not in the registry — saved as typed');
    if(!driver) r.errs.push('Driver Name missing');
    if(!routeTxt) r.errs.push('Route missing'); else if(!r.route) r.errs.push('Route “'+routeTxt+'” not recognised — pick it from the drop-down');
    if(r.tripsActual==='') r.errs.push('Trips Actual missing');
    const rt=ROUTES[r.route];
    if(rt){                                                    // same auto-fill as the Transport Ops form
      if(!r.material&&rt.material) r.material=rt.material;
      if(r.tripsTarget===''&&rt.tripsPerDayTarget) r.tripsTarget=rt.tripsPerDayTarget;
      if(r.turnaroundTarget===''&&rt.durationTargetHrs!==null&&rt.durationTargetHrs!==undefined) r.turnaroundTarget=rt.durationTargetHrs;
      if(r.tonnageTarget===''&&r.tripsTarget!==''&&num(STATE.targets.tonnagePerTripTarget)>0) r.tonnageTarget=num(r.tripsTarget)*num(STATE.targets.tonnagePerTripTarget);
    }
    if(!r.errs.length){
      const key=[r.date,r.vehicleId||('~'+normReg(truckTxt)),r.route].join('|');
      if(seen[key]){ r.errs.push('Same date + truck + route appears twice in the file (line '+seen[key]+')'); }
      else { seen[key]=r.line; if(ex[key]){ r.dupId=ex[key]; r.warns.push('Already in Transport Ops'); } }
    }
    r.state=r.errs.length?'error':(r.dupId?'dup':'ok'); rows.push(r);
  }
  return {rows,err:rows.length?'':'The template has no filled-in rows. Fill in the driver, route, trips and tonnage for each truck that ran.'};
}
async function handleBulkFile(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ alert('The spreadsheet reader could not be loaded. Check your internet connection and reload the page.'); return; }
  try{
    const buf=file.arrayBuffer?await file.arrayBuffer():await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsArrayBuffer(file); });
    const wb=XLSX.read(buf,{type:'array'}); const out=parseBulkWorkbook(wb);
    STATE.bulk={file:file.name,rows:out.rows,err:out.err,replace:false,summary:out.summary||''}; render();
  }catch(e){ console.error(e); STATE.bulk={file:file.name,rows:[],err:'Could not read that file: '+(e&&e.message?e.message:e),replace:false}; render(); }
}

async function importBulk(){

}

function latestOdo(vid){

/* ---------- CNG: allowance rule + weekly calculation ----------
   One fill-up covers EITHER 2 clinker/gypsum trips, OR 5 Adumbu trips + 1 clinker/gypsum trip.
   => a clinker/gypsum trip uses 1/2 of a fill-up, an Adumbu trip uses (1 − 1/2) / 5 = 1/10.                         */
function cngWeights(){
  let L=num(STATE.targets.cngLongTripsPerFill), A=num(STATE.targets.cngAdumbuTripsPerFill); if(!(L>=1)) L=2; if(!(A>=1)) A=5;
  const wl=1/L, wa=Math.max(0,(1-wl)/A); return {L,A,wl,wa};
}
function tripKind(route){ return route==='gypsum_adumbu'?'adumbu':((!route||route==='other'||route==='east')?'other':'long'); }
function cngWeek(start,endOpt){
  const end=endOpt||addDays(start,6), W=cngWeights(), inW=d=>!!d&&d>=start&&d<=end;
  const trips=(STATE.data.transport||[]).filter(r=>inW(r.date)), fills=(STATE.data.cngFills||[]).filter(r=>inW(r.date)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const T={}; const get=vid=>T[vid]||(T[vid]={vid,regNo:vehicleLabel(vid),long:0,adum:0,other:0,ton:0,fills:0,qty:0,cost:0,entries:[]});
  let unassigned=0, unassignedTrips=0;
  trips.forEach(r=>{ if(!r.vehicleId){ unassigned++; unassignedTrips+=num(r.tripsActual); return; } const t=get(r.vehicleId); const n=num(r.tripsActual), k=tripKind(r.route); if(k==='long') t.long+=n; else if(k==='adumbu') t.adum+=n; else t.other+=n; t.ton+=num(r.tonnageActual); t.entries.push(r); });
  fills.forEach(r=>{ if(!r.vehicleId) return; const t=get(r.vehicleId); t.fills++; t.qty+=num(r.quantity); t.cost+=num(r.cost); });
  const byMat={}, byRoute={}; let unallocated=0;
  const rows=Object.values(T).map(t=>{
    t.trips=t.long+t.adum+t.other; t.units=(t.long+t.other)*W.wl+t.adum*W.wa; t.expected=Math.round(t.units*10)/10; t.diff=t.fills-t.units;
    t.cpt=t.trips?t.cost/t.trips:null; t.cpm=t.ton?t.cost/t.ton:null; t.qpt=t.trips?t.qty/t.trips:null;
    t.avgFill=t.fills?t.cost/t.fills:0; t.extra=t.diff>0.25?t.diff*t.avgFill:0;
    if(!t.fills&&t.trips) t.status={tag:'red',text:'No fill-up logged'};
    else if(t.fills&&!t.trips) t.status={tag:'amber',text:'Fill-up but no trips logged'};
    else if(t.diff>0.75) t.status={tag:'red',text:'Over allowance by '+fmt(t.diff,1)};
    else if(t.diff>0.25) t.status={tag:'amber',text:'Slightly over'};
    else if(t.diff<-0.75) t.status={tag:'amber',text:'Fewer fill-ups than trips need — check'};
    else t.status={tag:'green',text:'Within allowance'};
    const per=t.units>0?t.cost/t.units:0; if(t.units<=0) unallocated+=t.cost;
    t.entries.forEach(r=>{ const n=num(r.tripsActual), u=n*(tripKind(r.route)==='adumbu'?W.wa:W.wl), c=u*per;
      const mk=matKey(r.material)||'—', mn=r.material?String(r.material).trim():'Unspecified', rk=r.route||'none';
      const m=byMat[mk]||(byMat[mk]={name:mn,trips:0,ton:0,units:0,cost:0}); m.trips+=n; m.ton+=num(r.tonnageActual); m.units+=u; m.cost+=c;
      const q=byRoute[rk]||(byRoute[rk]={name:rk==='none'?'Unassigned route':(ROUTES[rk]?ROUTES[rk].label:rk),kind:tripKind(r.route),trips:0,ton:0,units:0,cost:0}); q.trips+=n; q.ton+=num(r.tonnageActual); q.units+=u; q.cost+=c; });
    return t;
  }).sort((a,b)=>b.cost-a.cost||b.trips-a.trips||String(a.regNo).localeCompare(String(b.regNo)));
  const tot=rows.reduce((a,t)=>{ a.trips+=t.trips; a.long+=t.long; a.adum+=t.adum; a.other+=t.other; a.ton+=t.ton; a.fills+=t.fills; a.qty+=t.qty; a.cost+=t.cost; a.expected+=t.units; a.extra+=t.extra; if(t.diff>0.75) a.over++; return a; },{trips:0,long:0,adum:0,other:0,ton:0,fills:0,qty:0,cost:0,expected:0,extra:0,over:0});
  tot.diff=tot.fills-tot.expected; tot.cpt=tot.trips?tot.cost/tot.trips:null; tot.cpm=tot.ton?tot.cost/tot.ton:null; tot.qpt=tot.trips?tot.qty/tot.trips:null;
  return {start,end,W,rows,tot,fills,byMat:Object.values(byMat).sort((a,b)=>b.trips-a.trips),byRoute:Object.values(byRoute).sort((a,b)=>b.trips-a.trips),unassigned,unassignedTrips,unallocated};
}

/* ---------- Diesel: per-trip maths + weekly calculation ---------- */
function dieselCalc(r){
  const o0=num(r.odoBefore), o1=num(r.odoAdditional), o2=num(r.odoOffload);
  const l1=num(r.litresReceived), l2=num(r.litresAdditional), c1=num(r.costReceived), c2=num(r.costAdditional);
  const dist=(o0>0&&o2>o0)?o2-o0:0, lt=l1+l2, ct=c1+c2;
  return {dist,l1,l2,c1,c2,lt,ct,kmL:lt>0&&dist>0?dist/lt:null,costKm:dist>0?ct/dist:null,
    kmToTopup:(l2>0&&o1>o0&&o0>0)?o1-o0:null, kmAfterTopup:(l2>0&&o2>o1&&o1>0)?o2-o1:null};
}
function dieselValidate(r){
  const o0=num(r.odoBefore), o1=num(r.odoAdditional), o2=num(r.odoOffload), l2=num(r.litresAdditional);
  if(!r.vehicleId) return 'Please choose the truck.';
  if(!(o0>0)) return 'Enter the odometer before the trip.';
  if(!(o2>0)) return 'Enter the odometer at the offloading location.';
  if(o2<=o0) return 'The odometer at offloading ('+fmt(o2)+') must be higher than the odometer before the trip ('+fmt(o0)+').';
  if(l2>0){
    if(!(o1>0)) return 'You entered additional diesel — please enter the odometer where it was collected.';
    if(o1<o0||o1>o2) return 'The odometer where the additional diesel was collected ('+fmt(o1)+') must be between the start ('+fmt(o0)+') and the offloading odometer ('+fmt(o2)+').';
  }
  return '';
}
function dieselWeek(start,endOpt){
  const end=endOpt||addDays(start,6), inW=d=>!!d&&d>=start&&d<=end;
  const trips=(STATE.data.dieselTrips||[]).filter(r=>inW(r.date)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const T={}; trips.forEach(r=>{ const c=dieselCalc(r); const k=r.vehicleId||'none'; const t=T[k]||(T[k]={vid:r.vehicleId,regNo:r.vehicleId?vehicleLabel(r.vehicleId):'—',trips:0,dist:0,l1:0,l2:0,lt:0,ct:0,c1:0,c2:0,topups:0,valid:0});
    t.trips++; t.l1+=c.l1; t.l2+=c.l2; t.c1+=c.c1; t.c2+=c.c2; t.lt+=c.lt; t.ct+=c.ct; if(c.l2>0) t.topups++; if(c.dist>0){ t.dist+=c.dist; if(c.lt>0) t.valid+=c.dist; } t.kmLDist=(t.kmLDist||0)+(c.dist>0&&c.lt>0?c.dist:0); t.kmLLit=(t.kmLLit||0)+(c.dist>0&&c.lt>0?c.lt:0); });
  const rows=Object.values(T).map(t=>{ t.kmL=t.kmLLit>0?t.kmLDist/t.kmLLit:null; t.costKm=t.dist>0?t.ct/t.dist:null; return t; });
  const med=median(rows.map(t=>t.kmL).filter(x=>x!==null&&x>0));
  rows.forEach(t=>{ t.vs=(med&&t.kmL)?t.kmL/med:null; t.flag=t.vs!==null&&t.vs<0.8?(t.vs<0.65?'red':'amber'):null; });
  rows.sort((a,b)=>b.ct-a.ct||b.trips-a.trips);
  const tot=rows.reduce((a,t)=>{ a.trips+=t.trips; a.dist+=t.dist; a.l1+=t.l1; a.l2+=t.l2; a.lt+=t.lt; a.c1+=t.c1; a.c2+=t.c2; a.ct+=t.ct; a.topups+=t.topups; a.kmLDist+=t.kmLDist||0; a.kmLLit+=t.kmLLit||0; return a; },{trips:0,dist:0,l1:0,l2:0,lt:0,c1:0,c2:0,ct:0,topups:0,kmLDist:0,kmLLit:0});
  tot.kmL=tot.kmLLit>0?tot.kmLDist/tot.kmLLit:null; tot.costKm=tot.dist>0?tot.ct/tot.dist:null;
  return {start,end,trips,rows,tot,med};
}

  if(!vs.length){ alert('Register your trucks first (Maintenance tab → Add a vehicle) so they can be listed in the sheet.'); return; }
  try{ triggerDownload(buildCngXlsx(start,vs,cngWeek(start)),'FleetDesk_CNG_Weekly_'+start+'.xlsx'); }
  catch(e){ console.error(e); alert('Could not build the sheet: '+(e&&e.message?e.message:e)); }
}
function parseCngWorkbook(wb){
  const ws=wb.Sheets['CNG Fill-ups']||wb.Sheets[wb.SheetNames[0]]; if(!ws) return {rows:[],err:'No sheet found in that file.'};
  const grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const hi=grid.findIndex((r,i)=>i<12&&r.map(cngHdrKey).includes('date')&&r.map(cngHdrKey).includes('truck')&&r.map(cngHdrKey).includes('quantity'));
  if(hi<0) return {rows:[],err:'Could not find the column headings (Fill Date, Truck Reg No, Quantity …). Please use the FleetDesk CNG sheet and do not rename the headings.'};
  const cols={}; grid[hi].forEach((h,i)=>{ const k=cngHdrKey(h); if(k&&cols[k]===undefined) cols[k]=i; });
  const vmap={}; (STATE.data.vehicles||[]).forEach(v=>{ vmap[normKey(v.regNo)]=v; });
  const ex={}; (STATE.data.cngFills||[]).forEach(r=>{ ex[[r.date,r.vehicleId,num(r.quantity),num(r.cost)].join('|')]=r.id; });
  const rows=[]; const seen={};
  for(let i=hi+1;i<grid.length;i++){
    const g=k=>cols[k]===undefined?'':grid[i][cols[k]];
    const qtyRaw=g('quantity'), costRaw=g('cost'), truckTxt=String(g('truck')||'').trim();
    if((qtyRaw===''||qtyRaw===null)&&(costRaw===''||costRaw===null)) continue;      // truck listed but no fill-up
    const r={line:i+1,date:xlDate(g('date')),truckTxt,driver:String(g('driver')||'').trim(),station:String(g('station')||'').trim(),notes:String(g('notes')||'').trim(),errs:[]};
    const v=vmap[normKey(truckTxt)]; r.vehicleId=v?v.id:''; r.regNo=v?v.regNo:truckTxt;
    const q=parseFloat(String(qtyRaw).replace(/,/g,'')), c=costRaw===''?0:parseFloat(String(costRaw).replace(/,/g,'')), od=g('odometer')===''?'':parseFloat(String(g('odometer')).replace(/,/g,''));
    r.quantity=q; r.cost=c; r.odometer=(od===''||isNaN(od))?'':od;
    if(!r.date) r.errs.push('Fill date missing or not recognised');
    if(!truckTxt) r.errs.push('Truck Reg No missing'); else if(!v) r.errs.push('Truck “'+truckTxt+'” is not in the registry');
    if(isNaN(q)||q<=0) r.errs.push('Quantity (SCM) must be a number above 0');
    if(isNaN(c)||c<0){ r.errs.push('Total cost is not a valid number'); }
    if(!r.errs.length){ const key=[r.date,r.vehicleId,q,c].join('|'); if(ex[key]) r.dupId=ex[key]; if(seen[key]) r.errs.push('Same date, truck, quantity and cost appears twice (row '+seen[key]+')'); else seen[key]=r.line; }
    if(!r.errs.length&&!c) r.warn='No cost entered';
    r.state=r.errs.length?'error':(r.dupId?'dup':'ok'); rows.push(r);
  }
  return {rows,err:rows.length?'':'The sheet has no fill-ups entered. Fill in Quantity (SCM) and Total Cost for each truck that filled.'};
}
async function handleCngFile(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ alert('The spreadsheet reader could not be loaded. Check your internet connection and reload the page.'); return; }
  try{
    const buf=file.arrayBuffer?await file.arrayBuffer():await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsArrayBuffer(file); });
    const out=parseCngWorkbook(XLSX.read(buf,{type:'array'})); STATE.cngBulk={file:file.name,rows:out.rows,err:out.err}; render();
  }catch(e){ console.error(e); STATE.cngBulk={file:file.name,rows:[],err:'Could not read that file: '+(e&&e.message?e.message:e)}; render(); }
}

async function importCng(){
  const b=STATE.cngBulk; if(!b) return; const add=[];
  b.rows.forEach(r=>{ if(r.state!=='ok') return; const rec={id:uid(),date:r.date,vehicleId:r.vehicleId,driverName:r.driver,station:r.station,quantity:String(r.quantity),cost:r.cost?String(r.cost):'',odometer:r.odometer===''?'':String(r.odometer),notes:r.notes}; compactRec(rec); add.push(rec); });

}

/* ---------- small helpers ---------- */
const rc = (v,tone)=>({v:String(v===undefined||v===null?'':v), tone:tone||''});
const cellText = c => (c && typeof c==='object') ? c.v : String(c===undefined||c===null?'':c);
const cellTone = c => (c && typeof c==='object') ? c.tone : '';
function isoWeekNo(start){
  const d=new Date(start+'T00:00:00'); d.setDate(d.getDate()+3);
  const jan4=new Date(d.getFullYear(),0,4); const w1=new Date(jan4); w1.setDate(jan4.getDate()-((jan4.getDay()+6)%7));
  return Math.floor(Math.round((d-w1)/864e5)/7)+1;
}
function shortRange(r){
  const a=new Date(r.start+'T00:00:00'), b=new Date(r.end+'T00:00:00');
  const mo=x=>x.toLocaleDateString(undefined,{month:'short'});
  return a.getMonth()===b.getMonth()? `${a.getDate()}–${b.getDate()} ${mo(b)}` : `${a.getDate()} ${mo(a)} – ${b.getDate()} ${mo(b)}`;
}
function monthName(start,long){ return new Date(start.slice(0,7)+'-01T00:00:00').toLocaleDateString(undefined,{month:long?'long':'short',year:'numeric'}); }
function reportRanges(kind,start){
  if(kind==='week'){ const s=wkStart(start); return {range:{start:s,end:addDays(s,6)}, prev:{start:addDays(s,-7),end:addDays(s,-1)}}; }
  const s=monthStartOf(start); const ps=addMonthsStr(s,-1);
  return {range:{start:s,end:monthEndOf(s)}, prev:{start:ps,end:monthEndOf(ps)}};
}
function periodTitle(kind,start,long){
  if(kind==='week'){ const r=reportRanges('week',start).range; return `Week ${isoWeekNo(r.start)} · ${rangeText(r)}`; }
  return monthName(start,true);
}
function periodShort(kind,start){
  if(kind==='week'){ const r=reportRanges('week',start).range; return `Wk ${isoWeekNo(r.start)} · ${shortRange(r)}`; }
  return monthName(start,false);
}
function latestPeriodStart(kind){ return kind==='week'? addDays(wkStart(todayStr()),-7) : addMonthsStr(monthStartOf(todayStr()),-1); }
function stepPeriod(kind,start,n){ return kind==='week'? addDays(start,7*n) : addMonthsStr(start,n); }
function periodList(kind,count){ const out=[]; let s=latestPeriodStart(kind); for(let i=0;i<count;i++){ out.push(s); s=stepPeriod(kind,s,-1); } return out; }

/* number formatting + change cells */
function fmtSpec(v,o){
  o=o||{}; if(v===null||v===undefined||isNaN(v)) return '—';
  if(o.money) return naira(v,o.dec||0);
  if(o.pct) return pct(v);
  return fmt(v,o.dec||0)+(o.unit?' '+o.unit:'');
}
function chg(cur,prev,good,o){
  o=o||{}; if(cur===null||cur===undefined||prev===null||prev===undefined||isNaN(cur)||isNaN(prev)) return rc('—','');
  const d=cur-prev, dec=o.pct?1:(o.dec||0), unit=o.pct?100:1;
  if(Math.abs(d*unit)<Math.pow(10,-dec)/2) return rc('no change','');
  const better=good==='lower'?d<0:good==='higher'?d>0:null;
  const tone=better===null?'':(better?'good':'bad');
  const mag=Math.abs(d)*unit;
  let txt=(d>0?'▲ +':'▼ −')+(o.money?naira(Math.abs(d),o.dec||0):fmt(mag,dec)+(o.pct?' pts':(o.unit?' '+o.unit:'')));
  if(!o.pct && prev) txt+=` (${d>0?'+':'−'}${Math.abs(Math.round(d/prev*100))}%)`;
  return rc(txt,tone);
}
function tableBlock(title,head,rows,note){ return {title,head,rows,note:note||''}; }
/* A KPI table: Target | current | previous | change | status, straight from the KPI engines. */
function kpiTableBlock(title,defsCur,defsPrev,hasCur,hasPrev,L){
  const rows=defsCur.map(([label,row],i)=>{
    const prow=defsPrev[i]?defsPrev[i][1]:null;
    const st=hasCur?statusOf(row?row.ratio:null):'grey';
    const v=reportValueStr(row), pv=prow&&hasPrev?reportValueStr(prow).a:'—';
    const o={pct:row&&row.fmt==='pct',dec:row&&row.fmt!=='pct'&&row.fmt!==undefined?row.fmt:0,unit:row&&row.unit||''};
    return [label, v.t, hasCur?v.a:'—', pv, (hasCur&&hasPrev&&row&&prow)?chg(row.actual,prow.actual,row.good||'higher',o):'—', rc(hasCur?statusLabel(st):'No data', st)];
  });
  return tableBlock(title,['KPI','Target',L.cur,L.prev,'Change','Status'],rows);
}
/* A plain "measure / current / previous / change" table. m = [label, cur, prev, good, spec] */
function compareBlock(title,measures,L,note){
  return tableBlock(title,['Measure',L.cur,L.prev,'Change'],measures.map(([label,cur,prev,good,o])=>[label,fmtSpec(cur,o),fmtSpec(prev,o),chg(cur,prev,good,o)]),note);
}

function repFiltered(r){

  return {transport:f(D.transport),journey:f(D.journey),inspections:f(D.inspections),pretrip:f(D.pretrip),safety:f(D.safety),
          maintenance:f(D.maintenance),maintenanceDaily:f(D.maintenanceDaily),maintInspections:f(D.maintInspections||[]),
          cng:f(D.cngFills||[]),diesel:f(D.dieselTrips||[])};
}
function deptHasData(key,r){
  const F=repFiltered(r);
  switch(key){
    case 'transport': return F.transport.length>0;
    case 'journey': return F.journey.length>0;
    case 'inspections': return F.inspections.length+F.pretrip.length+F.maintInspections.length>0;

function whatChanged(tiles,L){
  const out=[];
  tiles.forEach(t=>{
    if(!t.has||t.cur===null||t.prev===null||t.prev===undefined) return;
    const d=t.cur-t.prev; if(Math.abs(d)<1e-9){ return; }
    const better=t.good==='lower'?d<0:d>0; const pc=t.prev?Math.round(Math.abs(d)/Math.abs(t.prev)*100):null;
    const word=d>0?'rose':'fell';
    out.push({tone:better?'green':'amber', text:`<b>${t.label}</b> ${word} to <b>${fmtSpec(t.cur,t.o)}</b> from ${fmtSpec(t.prev,t.o)}${pc!==null&&!t.o.pct?` (${d>0?'+':'−'}${pc}%)`:''} — ${better?'an improvement':'worth a look'}.`});
  });
  return out;
}
function reportPackage(kind,start,deptKeys){

  const latest=range.end>=periodRange(kind==='week'?'lastweek':'lastmonth').end;

  const depts=[];
  REPORT_DEPTS.forEach(([key,title,short,icon])=>{
    if(deptKeys&&deptKeys.indexOf(key)<0) return;
    const d=REP_BUILDERS[key](range,prev,L,recs);

    let comment=match?recs.filter(match).map(x=>x.text):[]; if(d.comment) comment=comment.concat([d.comment]);

    depts.push(Object.assign({},d,{key,title,short,icon,comment}));

function reportMarkdown(pkg,by){
  let md=`# ${reportTitle(pkg)}\n\n**Period:** ${periodTitle(pkg.kind,pkg.start)}  \n**Compared with:** ${periodTitle(pkg.kind,pkg.kind==='week'?addDays(pkg.start,-7):addMonthsStr(pkg.start,-1))}  \n**Generated:** ${pkg.generated.toLocaleString()}  \n**Prepared by:** ${by||'—'}\n\n`;
  if(!pkg.single){
    md+=`## Headlines\n\n| Measure | ${pkg.L.cur} | ${pkg.L.prev} | Change |\n|---|---|---|---|\n`;
    pkg.tiles.forEach(t=>{ md+=`| ${t.label} | ${t.has?fmtSpec(t.cur,t.o):'—'} | ${t.has&&t.prev!==null?fmtSpec(t.prev,t.o):'—'} | ${t.has&&t.cur!==null?chg(t.cur,t.prev,t.good,t.o).v:'—'} |\n`; });
    md+=`\n**Critical items:** ${pkg.red} · **Watch items:** ${pkg.amber}\n\n`;
    if(pkg.changes.length){ md+=`## What changed\n\n`; pkg.changes.forEach(c=>{ md+='- '+c.text.replace(/<\/?b>/g,'**')+'\n'; }); md+='\n'; }
  }
  pkg.depts.forEach(d=>{
    md+=`## ${d.title}\n\n`;
    if(!d.hasData) md+=`_Nothing was logged for this department in this period._\n\n`;
    d.blocks.forEach(b=>{ if(b.title) md+=`**${b.title}**\n\n`; md+=`| ${b.head.join(' | ')} |\n|${b.head.map(()=>'---').join('|')}|\n`; b.rows.forEach(r=>{ md+=`| ${r.map(c=>cellText(c).replace(/\|/g,'/')).join(' | ')} |\n`; }); md+='\n'; });
    md+=`*Commentary:* ${d.comment.length?d.comment.join(' '):'No exceptions — performance within target.'}\n\n`;
  });
  return md;
}

function triggerBlob(content,type,name){ triggerDownload(new Blob([content],{type}),name); }
function downloadReport(pkg,fmtKey,by){
  if(fmtKey==='md'){ triggerBlob(reportMarkdown(pkg,by),'text/markdown',reportFileName(pkg,'md')); }
  else if(fmtKey==='doc'){ triggerBlob('﻿'+reportStandaloneHTML(pkg,by),'application/msword',reportFileName(pkg,'doc')); }
  else if(fmtKey==='xlsx'){
    if(!window.XLSX){ showToast('The Excel library has not loaded (check your connection). Use Word or Print instead.'); return; }
    const wb=XLSX.utils.book_new(); const used={};
    const sheet=(name,aoa,widths)=>{ let n=name.replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,28)||'Sheet'; let i=1,base=n; while(used[n]){ n=base.slice(0,26)+' '+(++i); } used[n]=1; const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=(widths||[]).map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,ws,n); };
    const head=[[reportTitle(pkg)],['Period',periodTitle(pkg.kind,pkg.start)],['Compared with',periodTitle(pkg.kind,pkg.kind==='week'?addDays(pkg.start,-7):addMonthsStr(pkg.start,-1))],['Generated',pkg.generated.toLocaleString()],['Prepared by',by||'—'],[]];
    if(!pkg.single){
      const sum=head.concat([['Measure',pkg.L.cur,pkg.L.prev,'Change']]);
      pkg.tiles.forEach(t=>sum.push([t.label,t.has?fmtSpec(t.cur,t.o):'—',t.has&&t.prev!==null?fmtSpec(t.prev,t.o):'—',t.has&&t.cur!==null?chg(t.cur,t.prev,t.good,t.o).v:'—']));
      sum.push([],['Critical items',pkg.red],['Watch items',pkg.amber],[],['What changed']); pkg.changes.forEach(c=>sum.push([c.text.replace(/<[^>]+>/g,'')]));
      sum.push([],['Needs attention']); pkg.recs.filter(x=>x.severity!=='green').slice(0,12).forEach(x=>sum.push([x.dept,x.text]));
      sheet('Summary',sum,[34,22,22,26]);
    }
    pkg.depts.forEach(d=>{
      const aoa=pkg.single?head.slice():[]; aoa.push([d.title],[]);
      d.blocks.forEach(b=>{ if(b.title) aoa.push([b.title]); aoa.push(b.head); b.rows.forEach(r=>aoa.push(r.map(cellText))); aoa.push([]); });
      aoa.push(['Commentary',d.comment.length?d.comment.join(' '):'No exceptions — performance within target.']);
      sheet(d.short,aoa,[36,20,20,20,24,20]);
    });
    XLSX.writeFile(wb,reportFileName(pkg,'xlsx'));
  }
  showToast('Report downloaded.');
}
function printReport(pkg,by){

  root.innerHTML=`<style>${REPORT_PRINT_CSS}</style>`+reportDocHTML(pkg,{light:true,preparedBy:by,id:'print-doc'});

  ({transport:()=>take(D.transport),journey:()=>take(D.journey),inspections:()=>{take(D.inspections);take(D.pretrip);take(D.maintInspections);},
    safety:()=>{take(D.safety);((D.hsseScores||{}).weeks||[]).forEach(w=>{ if(w.start&&w.start<m) m=w.start; });},
    maintenance:()=>{take(D.maintenance);take(D.maintenanceDaily);take(D.maintInspections);},fuel:()=>{take(D.cngFills);take(D.dieselTrips);take(D.fuel);},port:()=>take(D.portUpdates)}[key]||(()=>{}))();
  if(key==='ALL'){ ['transport','journey','inspections','safety','maintenance','fuel','port'].forEach(k=>{ const e=earliestDate(k); if(e<m) m=e; }); }
  return m;
}
function folderPeriods(key,kind){

}

  app.querySelectorAll('[data-rep-dl]').forEach(el=>el.addEventListener('click',()=>{ const d=el.closest('details'); if(d) d.open=false; downloadReport(cur(kindOf(el)),el.getAttribute('data-rep-dl'),STATE.reportPreparedBy); }));
  // folders
  app.querySelectorAll('[data-arch-open]').forEach(el=>el.addEventListener('click',()=>{ STATE.archDept=el.getAttribute('data-arch-open'); window.scrollTo(0,0); render(); }));

  app.querySelectorAll('[data-arch-view]').forEach(el=>el.addEventListener('click',()=>{ STATE.archView={dept:STATE.archDept||'ALL',kind:STATE.archKind||'week',start:el.getAttribute('data-arch-view')}; render(); }));
  app.querySelectorAll('[data-arch-print]').forEach(el=>el.addEventListener('click',()=>printReport(archPackage(el.getAttribute('data-arch-print')),STATE.reportPreparedBy)));
  app.querySelectorAll('[data-arch-dl]').forEach(el=>el.addEventListener('click',()=>downloadReport(archPackage(el.getAttribute('data-arch-dl')),el.getAttribute('data-fmt'),STATE.reportPreparedBy)));
  app.querySelectorAll('[data-close-arch]').forEach(el=>el.addEventListener('click',(e)=>{ if(e.target===el){ STATE.archView=null; render(); } }));
  const vp=()=>{ const v=STATE.archView; return reportPackage(v.kind,v.start,v.dept==='ALL'?null:[v.dept]); };
  app.querySelectorAll('[data-arch-modal-print]').forEach(el=>el.addEventListener('click',()=>printReport(vp(),STATE.reportPreparedBy)));
  app.querySelectorAll('[data-arch-modal-dl]').forEach(el=>el.addEventListener('click',()=>downloadReport(vp(),el.getAttribute('data-arch-modal-dl'),STATE.reportPreparedBy)));
}

function isoToDMYPort(iso){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(iso||''); return m?`${m[3]}/${m[2]}/${m[1].slice(2)}`:(iso||''); }
function portLfgNo(rec){ const m=/^LFG\s*(\d+)\s*$/i.exec(rec.fileRef||''); return m?parseInt(m[1],10):null; }
function portArchived(rec){ const n=portLfgNo(rec); return n!==null&&n>=461&&n<=500; }   // LFG 461-500 are old delivered files

/* ---------- build the live records = base data + every saved daily update ---------- */
function portUpdates(){ return (STATE.data&&STATE.data.portUpdates)||[]; }

function dmyToDatePort(s){ const m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(String(s||'').trim()); if(!m) return null; const y=m[3].length===2?2000+(+m[3]):+m[3]; const d=new Date(y,+m[2]-1,+m[1]); return isNaN(d)?null:d; }
function portCustomFiles(){ return (STATE.data&&STATE.data.portFiles)||[]; }
function portBaseList(c){ return (PORT_BASE[c]||[]).concat(portCustomFiles().filter(f=>f.client===c).map(f=>{ const r=Object.assign({},f,{_custom:true}); if(PORT_EXPORT.has(c)&&!('containerNo' in r)) r.containerNo=''; if(f.delivered) r._delivered=true; if(r.daysAtPort==null||r.daysAtPort===''){ const a=dmyToDatePort(r.ata||r.truckOnSite); if(a&&!f.delivered) r.daysAtPort=Math.max(0,Math.round((Date.now()-a.getTime())/864e5)); } return r; })); }
function portClientOf(ref){ for(const c of PORT_CLIENTS){ if(portBaseList(c).some(r=>r.fileRef===ref)) return c; } return ''; }
function portRecords(includeArchived){
  const ups=portUpdates(); const out={};
  PORT_CLIENTS.forEach(c=>{
    out[c]=portBaseList(c).filter(r=>includeArchived||!portArchived(r)).map(r=>{
      const copy=Object.assign({},r,{_client:c,updates:[]}); if(r._delivered) copy._delivered=true;
      ups.filter(u=>u.ref===r.fileRef).sort((a,b)=>a.date===b.date?(String(a.id)<String(b.id)?-1:1):(a.date<b.date?-1:1)).forEach(u=>{
        Object.entries(u.fields||{}).forEach(([k,v])=>{ if(v!==''&&v!=null) copy[k]=v; });

}

function portStage(rec){

}

  {key:'network_system_issue',test:/NETWORK/,label:'port network/system outages',reco:n=>`Log port network downtime dates for SLA discussions with the terminal — cited in ${n} file${n>1?'s':''}.`},
  {key:'shipping_line_delay',test:/SHIPPING RELEASE.*OUTSTANDING|OUTSTANDING.*SHIPPING RELEASE|AWAIT SHIPPING RELEASE/,label:'shipping-line release delays',reco:n=>`Escalate outstanding shipping-line balances early to avoid held shipping release — affected ${n} file${n>1?'s':''}.`},
];
function portScanIssues(remarks){ if(!remarks) return []; const r=remarks.toUpperCase(); return PORT_ISSUES.filter(t=>t.test.test(r)).map(t=>t.key); }
function portTally(recs){ const t={}; recs.forEach(r=>portScanIssues(r.remarks).forEach(k=>{ t[k]=(t[k]||0)+1; })); return t; }
function portTopIssues(n){
  const all=portRecords(false); const t=portTally([].concat(...PORT_CLIENTS.map(c=>all[c])));
  return Object.entries(t).sort((a,b)=>b[1]-a[1]).slice(0,n||3).map(([k,c])=>({key:k,label:PORT_ISSUES.find(x=>x.key===k).label,count:c}));
}
function portAvg(vals){ const v=vals.filter(x=>x!=null&&!isNaN(x)); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null; }

/* ---------- numbers used by the reports ---------- */
function portStatsIn(range){
  const ups=portUpdates().filter(u=>u.date&&u.date>=range.start&&u.date<=range.end);
  const refs={}; let milestones=0; const delivered=[];
  ups.forEach(u=>{
    const o=refs[u.ref]||(refs[u.ref]={ref:u.ref,client:portClientOf(u.ref),n:0,last:'',lastDate:''}); o.n++;
    if(u.text&&(u.date>=o.lastDate)){ o.last=u.text; o.lastDate=u.date; }
    milestones+=Object.values(u.fields||{}).filter(v=>v!==''&&v!=null).length;
    if(u.delivered) delivered.push({ref:u.ref,client:portClientOf(u.ref),date:u.date,text:u.text||''});
  });
  const byFile=Object.values(refs).sort((a,b)=>b.n-a.n||(a.ref<b.ref?-1:1));
  return {updates:ups.length,filesUpdated:byFile.length,milestones,delivered:delivered.sort((a,b)=>a.date<b.date?-1:1),byFile};
}
function portHasData(range){ return portStatsIn(range).updates>0; }
function portSnapshot(){
  const all=portRecords(false), flags=portFlags(); const clients=[]; const tot={open:0,progress:0,pending:0,flagged:0,days:[]};
  PORT_CLIENTS.forEach(c=>{
    const open=all[c].filter(r=>portStage(r)!=='delivered');
    const o={name:c,open:open.length,progress:open.filter(r=>portStage(r)==='progress').length,pending:open.filter(r=>portStage(r)==='pending').length,flagged:open.filter(r=>flags[r.fileRef]).length,avgDays:portAvg(open.map(r=>r.daysAtPort))};
    tot.open+=o.open; tot.progress+=o.progress; tot.pending+=o.pending; tot.flagged+=o.flagged; open.forEach(r=>tot.days.push(r.daysAtPort)); clients.push(o);
  });
  tot.avgDays=portAvg(tot.days); return {clients,tot};
}

/* ---------- KPIs & recommendations ---------- */
function portKpiHTML(){
  const all=portRecords(false), flags=portFlags(); let recsAll=[]; PORT_CLIENTS.forEach(c=>recsAll=recsAll.concat(all[c]));
  const st=recsAll.map(portStage), d=st.filter(x=>x==='delivered').length, p=st.filter(x=>x==='progress').length, q=st.filter(x=>x==='pending').length;
  const avg=portAvg(recsAll.map(r=>r.daysAtPort));
  const tally={}; recsAll.forEach(r=>{ if(portStage(r)!=='delivered'){ const l=portStageLabel(r,portStage(r)); tally[l]=(tally[l]||0)+1; } });
  const rows=Object.entries(tally).sort((a,b)=>b[1]-a[1]); const mx=Math.max(1,...rows.map(r=>r[1]));
  const issues=Object.entries(portTally(recsAll)).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const clientCards=PORT_CLIENTS.map(c=>{
    const rs=all[c], s=rs.map(portStage); const ds=rs.map(r=>r.daysAtPort).filter(v=>v!=null);
    let longest=null; ds.forEach(v=>{ if(longest===null||v>longest) longest=v; }); const lf=longest!=null?rs.find(r=>r.daysAtPort===longest):null;
    const lt={}; rs.forEach(r=>{ if(portStage(r)!=='delivered'){ const l=portStageLabel(r,portStage(r)); lt[l]=(lt[l]||0)+1; } });
    const bn=Object.entries(lt).sort((a,b)=>b[1]-a[1])[0];
    const top=Object.entries(portTally(rs)).sort((a,b)=>b[1]-a[1]).slice(0,3);
    return `<div class="card pf-kcard"><div class="flex between" style="flex-wrap:wrap;gap:6px;margin-bottom:8px;"><b class="pf-ref">${esc(c)}</b><span class="dim small mono">${portAvg(ds)!=null?`avg <b>${portAvg(ds)}</b> days at port`:'no dwell data'}${lf?` · longest: <b>${esc(lf.fileRef)}</b> (${longest}d)`:''}</span></div>
      <div class="pf-mini"><span><b>${rs.length}</b> files</span><span><b>${s.filter(x=>x==='delivered').length}</b> delivered</span><span><b>${s.filter(x=>x==='progress').length}</b> in process</span><span><b>${s.filter(x=>x==='pending').length}</b> awaiting arrival</span>${bn?`<span>most open files sit at <b>${esc(bn[0])}</b> (${bn[1]})</span>`:''}</div>
      ${top.length?`<ul class="pf-reco">${top.map(([k,n])=>`<li>${esc(PORT_ISSUES.find(x=>x.key===k).reco(n))}</li>`).join('')}</ul>`:'<div class="up-good small">No recurring issues flagged in remarks — maintain current turnaround.</div>'}</div>`;
  }).join('');
  return `<div class="board"><div class="board-seg"><div class="k">Total files</div><div class="v">${recsAll.length}</div></div><div class="board-seg green"><div class="k">Delivered</div><div class="v">${d}</div></div><div class="board-seg amber"><div class="k">In process</div><div class="v">${p}</div></div><div class="board-seg"><div class="k">Ongoing files</div><div class="v">${q}</div></div><div class="board-seg"><div class="k">Avg days at port</div><div class="v">${avg!=null?avg:'—'}</div></div></div>
    <div class="section-title"><span>Where open files currently sit</span><div class="line"></div></div>
    <div class="card"><div class="pf-funnel">${rows.map(([l,n])=>`<div class="pf-frow"><div class="pf-fl">${esc(l)}</div><div class="pf-ft"><div class="pf-ff" style="width:${Math.round(n/mx*100)}%"></div></div><div class="pf-fc">${n}</div></div>`).join('')||'<div class="dim">No open files.</div>'}</div></div>
    <div class="section-title"><span>Process-level recommendations</span><div class="line"></div></div>
    <div class="rec-list">${issues.length?issues.map(([k,n])=>`<div class="rec-item amber"><div><div class="dept">Port files</div><div class="txt">${esc(PORT_ISSUES.find(x=>x.key===k).reco(n))} <span class="dim">(whole portfolio)</span></div></div></div>`).join(''):'<div class="card dim">No recurring issue patterns found in the current remarks.</div>'}</div>

}

/* ---------- events ---------- */
function portBindList(app){
  app.querySelectorAll('[data-pf-toggle]').forEach(h=>{
    const go=()=>{ const ref=h.getAttribute('data-pf-toggle'); const card=h.closest('.pf-file'); const on=card.classList.toggle('open'); STATE.portOpen[ref]=on; };
    h.addEventListener('click',go); h.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
  });
  app.querySelectorAll('[data-pf-flag]').forEach(b=>b.addEventListener('click',async e=>{ e.stopPropagation(); const ref=b.getAttribute('data-pf-flag'); const f=Object.assign({},portFlags()); if(f[ref]) delete f[ref]; else f[ref]=true; STATE.data.portFlags=f; await persist('portFlags'); }));
  app.querySelectorAll('[data-pf-update]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); STATE.portUpdFile=b.getAttribute('data-pf-update'); STATE.portView='update'; STATE.portMsg=''; window.scrollTo(0,0); render(); }));
}
function attachPortEvents(app){
  portState();
  app.querySelectorAll('[data-pf-view]').forEach(b=>b.addEventListener('click',()=>{ STATE.portView=b.getAttribute('data-pf-view'); window.scrollTo(0,0); render(); }));
  app.querySelectorAll('[data-pf-client]').forEach(b=>b.addEventListener('click',()=>{ STATE.portClient=b.getAttribute('data-pf-client'); render(); }));
  app.querySelectorAll('[data-pf-stage]').forEach(s=>s.addEventListener('change',()=>{ STATE.portStage=s.value; render(); }));
  app.querySelectorAll('[data-pf-flagf]').forEach(s=>s.addEventListener('change',()=>{ STATE.portFlagF=s.value; render(); }));
  app.querySelectorAll('[data-pf-archived]').forEach(c=>c.addEventListener('change',()=>{ STATE.portArchived=c.checked; render(); }));
  const sr=app.querySelector('#pf-search');
  if(sr) sr.addEventListener('input',()=>{ STATE.portSearch=sr.value; const box=app.querySelector('#pf-list'); if(box){ box.innerHTML=portListHTML(); portBindList(box); } });
  portBindList(app); attachPortAdd(app);
  // daily update form
  const form=app.querySelector('#pf-form');
  if(form){
    const refSel=form.querySelector('#pf-ref');
    refSel.addEventListener('change',()=>{ STATE.portUpdFile=refSel.value; const f=portUpdateFieldsHTML(refSel.value); form.querySelector('#pf-ms').innerHTML=f.ms; form.querySelector('#pf-det').innerHTML=f.det; });
    form.elements.date.addEventListener('change',()=>{ STATE.portUpdDate=form.elements.date.value; });
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      const ref=form.elements.ref.value, date=form.elements.date.value, text=form.elements.text.value.trim(), delivered=form.elements.delivered.checked;
      if(!ref){ showToast('Choose a file first.'); return; } if(!date){ showToast('Choose a date.'); return; }
      const fields={};

/* =========================================================================================
   HSSE upload: take one or several report files at once; always show the previous week
   compared with the week before
   ========================================================================================= */
async function handleHsseFiles(files){
  files=(files||[]).filter(Boolean); if(!files.length) return;
  if(typeof XLSX==='undefined'){ STATE.hsseMsg={t:'err',m:'The spreadsheet reader could not be loaded (check your internet connection) — reload the page and try again.'}; render(); return; }
  STATE.hsseMsg={t:'info',m:'Reading '+files.map(f=>f.name).join(', ')+'…'}; render();
  const tot={files:0,weeks:0,rows:0,inc:0,insp:0,ppe:0,tbt:0}, bad=[], seen=[];
  for(const file of files){
    try{
      const buf=file.arrayBuffer?await file.arrayBuffer():await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsArrayBuffer(file); });
      const p=parseHsseWorkbook(XLSX.read(buf,{type:'array'}),file.name);
      const found=p.weeks.length+p.incidents.length+p.inspections.length+p.ppe.length+p.toolbox.length+p.weekly.length;
      if(!found){ bad.push(file.name+' (nothing recognised)'); continue; }
      mergeHsse(p,file.name); tot.files++; tot.weeks+=p.weeks.length; tot.rows+=p.weeks.reduce((a,w)=>a+w.drivers.length,0);
      tot.inc+=p.incidents.length; tot.insp+=p.inspections.length; tot.ppe+=p.ppe.length; tot.tbt+=p.toolbox.length;
      p.weeks.forEach(w=>seen.push(w.n));
    }catch(e){ console.error(e); bad.push(file.name+' ('+(e&&e.message?e.message:e)+')'); }
  }
  if(!tot.files){ STATE.hsseMsg={t:'err',m:'No HSSE data was recognised in '+files.map(f=>f.name).join(', ')+'. Expected a workbook with a driver scorecard sheet (a "Driver" and a "Distance (km)" column), an "Incident Register" or a "Vehicle HSSE Inspection" sheet.'}; render(); return; }
  // always open on the previous week, compared with the week before it
  STATE.hsseWeek=null; STATE.hsseTab='overview';
  const ws=(STATE.data.hsseScores&&STATE.data.hsseScores.weeks)||[], autoN=ordOf(prevWeekStart());
  const cw=ws.find(w=>w.n===autoN), pw=ws.find(w=>w.n===autoN-1);

/* ---------- Registry clean-up: same truck entered twice ---------- */
const VEH_REF_COLLS=['transport','journey','inspections','pretrip','safety','maintenance','maintenanceDaily','fuel','maintInspections','cngFills','dieselTrips'];
function dupGroups(){
  const ign=((STATE.data.seeds||{}).dupIgnore)||[]; const by={};
  (STATE.data.vehicles||[]).forEach(v=>{ const d=String(v.regNo||'').replace(/[^0-9]/g,''); const k=d.length>=3?d:normReg(v.regNo); (by[k]||(by[k]=[])).push(v); });
  return Object.keys(by).filter(k=>by[k].length>1&&ign.indexOf(k)<0).map(k=>({key:k,list:by[k]}));
}
function vehUse(id){ let n=0; VEH_REF_COLLS.forEach(c=>(STATE.data[c]||[]).forEach(r=>{ if(r.vehicleId===id) n++; })); return n; }
const FLEET_SIZE=27;
function fcLev(a,b){ const m=a.length,n=b.length; if(!m||!n) return Math.max(m,n); let p=[...Array(n+1).keys()]; for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; } return p[n]; }
async function fcMerge(loseId,keepId){
  const keep=STATE.data.vehicles.find(v=>v.id===keepId), lose=STATE.data.vehicles.find(v=>v.id===loseId); const touched=[];
  VEH_REF_COLLS.forEach(c=>{ let ch=false; (STATE.data[c]||[]).forEach(r=>{ if(r.vehicleId===loseId){ r.vehicleId=keepId; ch=true; } }); if(ch) touched.push(c); });
  ['currentOdometer','lastServiceOdometer','lastServiceDate','model'].forEach(f=>{ if((keep[f]===undefined||keep[f]===''||keep[f]===null)&&lose[f]) keep[f]=lose[f]; });
  STATE.data.vehicles=STATE.data.vehicles.filter(v=>v.id!==loseId);
  for(const c of touched) await persist(c); await persist('vehicles');
  showToast('Merged into '+keep.regNo+'. The registry now has '+STATE.data.vehicles.length+' trucks.'); render();
}
function fleetCheckCard(){
  const vs=STATE.data.vehicles||[]; const ok=((STATE.data.seeds||{}).fleetOk); if(vs.length<=FLEET_SIZE||ok===vs.length) return '';
  const L=STATE.live||{}, mix=[]; (L.rows||[]).forEach(r=>mix.push(r.reg||r.name)); (L.silent||[]).forEach(r=>mix.push(r.reg||r.name));
  const mixKeys=mix.map(x=>normReg(x)).filter(Boolean), mixDig=mix.map(x=>String(x||'').replace(/\D/g,'')).filter(x=>x.length>=3), haveMix=mixKeys.length>0;
  const lastAct=id=>{ let d=''; VEH_REF_COLLS.forEach(c=>(STATE.data[c]||[]).forEach(r=>{ if(r.vehicleId===id&&r.date&&r.date>d) d=r.date; })); return d; };
  const seen={}, rows=vs.map(v=>{
    const k=normReg(v.regNo), dg=String(v.regNo||'').replace(/\D/g,''), use=vehUse(v.id), last=lastAct(v.id), why=[]; let score=0;
    const inMix=haveMix?(mixKeys.indexOf(k)>-1||(dg.length>=3&&mixDig.indexOf(dg)>-1)):null;
    if(inMix===false){ why.push('not among the '+mixKeys.length+' trackers in MiX'); score+=3; }
    if(use===0){ why.push('no trips, fuel or maintenance records'); score+=3; } else if(last&&last<addDays(todayStr(),-60)){ why.push('no activity since '+last); score+=1; }
    const sim=vs.filter(o=>o.id!==v.id&&fcLev(k,normReg(o.regNo))<=2); if(sim.length){ why.push('plate is almost the same as '+sim.map(o=>o.regNo).join(', ')); score+=2; }
    if(seen[k]){ why.push('same plate listed twice'); score+=4; } seen[k]=1;
    return {v,use,last,why,score,sim,inMix};
  }).sort((a,b)=>b.score-a.score||a.use-b.use);
  const top=rows.filter(r=>r.score>0).slice(0,6), n=vs.length;
  const row=r=>`<tr><td><b>${esc(r.v.regNo)}</b></td><td style="white-space:normal;">${r.why.map(esc).join('<br>')||'<span class="dim">—</span>'}</td><td>${r.use}</td><td>${r.last?fmtDate(r.last):'—'}</td><td style="white-space:normal;">${r.use===0?`<button class="btn small danger" data-fc-remove="${r.v.id}">Remove</button>`:`<select data-fc-into="${r.v.id}" style="width:auto;max-width:150px;">${vs.filter(o=>o.id!==r.v.id).sort((a,b)=>(r.sim.includes(b)?1:0)-(r.sim.includes(a)?1:0)||String(a.regNo).localeCompare(String(b.regNo))).map(o=>`<option value="${o.id}">${esc(o.regNo)}</option>`).join('')}</select> <button class="btn small" data-fc-merge="${r.v.id}">Merge into</button>`}</td></tr>`;
  return `<div class="card" style="margin:0 0 16px;border-left:3px solid var(--amber);"><div style="font-weight:600;font-size:14px;">Fleet check — the registry has ${n} trucks, you have ${FLEET_SIZE}</div>
   <div class="dim small" style="margin:3px 0 10px;line-height:1.55;">${haveMix?'Compared with the '+mixKeys.length+' trucks MiX tracks, and with each truck’s trip, fuel and maintenance history.':'Open the Live Map once so MiX can be compared. Meanwhile this uses trip, fuel and maintenance history only.'} The likeliest extra ${n-FLEET_SIZE===1?'truck is':'trucks are'} at the top.</div>
   ${top.length?`<div class="table-wrap"><table><thead><tr><th>Plate</th><th>Why it stands out</th><th>Records</th><th>Last activity</th><th>Fix</th></tr></thead><tbody>${top.map(row).join('')}</tbody></table></div>`:'<div class="dim small">Nothing stands out. Every plate has records and appears in MiX — check the list below for a plate that does not belong to SKB.</div>'}
   <div style="margin-top:10px;"><button class="btn small ghost" data-fc-ok="1">Keep all ${n} — this is correct</button></div></div>`;
}
function regDupCard(){ return regDupCardCore()+fleetCheckCard(); }
function regDupCardCore(){
  const g=dupGroups(); if(!g.length) return '';

  return `<div class="card" style="margin:0 0 16px;border-left:3px solid var(--red);"><div style="font-weight:600;font-size:14px;">Registry check — ${g.length} truck${g.length>1?'s look':' looks'} like duplicates</div>
  <div class="dim small" style="margin:3px 0 10px;line-height:1.5;">The registry has ${total} trucks. Trucks with the same plate number are probably one truck entered twice. Choose the one to keep — all its history, entries and maintenance from the other are moved across.</div>
  ${g.map(x=>{ const best=x.list.slice().sort((a,b)=>vehUse(b.id)-vehUse(a.id))[0]; return `<div style="border-top:1px solid var(--line);padding:10px 0;" data-dupg="${esc(x.key)}"><div class="flex gap8" style="flex-wrap:wrap;align-items:center;">${x.list.map(v=>`<label style="display:flex;gap:6px;align-items:center;text-transform:none;font-size:13px;color:var(--text);"><input type="radio" name="dup-${esc(x.key)}" value="${esc(v.id)}" ${v.id===best.id?'checked':''} style="width:auto;"> Keep <b>${esc(v.regNo)}</b> <span class="dim small">(${vehUse(v.id)} records)</span></label>`).join('')}
  <button type="button" class="btn small primary" data-dup-merge="${esc(x.key)}">Merge</button><button type="button" class="btn small ghost" data-dup-ignore="${esc(x.key)}">They are different trucks</button></div></div>`; }).join('')}</div>`;
}
async function mergeDup(key){
  const g=dupGroups().find(x=>x.key===key); if(!g) return;
  const sel=document.querySelector(`input[name="dup-${CSS.escape(key)}"]:checked`); const keepId=sel?sel.value:g.list[0].id; const lose=g.list.filter(v=>v.id!==keepId).map(v=>v.id);
  const keep=g.list.find(v=>v.id===keepId); const touched=[];
  VEH_REF_COLLS.forEach(c=>{ let ch=false; (STATE.data[c]||[]).forEach(r=>{ if(lose.indexOf(r.vehicleId)>=0){ r.vehicleId=keepId; ch=true; } }); if(ch) touched.push(c); });
  g.list.filter(v=>lose.indexOf(v.id)>=0).forEach(v=>{ ['currentOdometer','lastServiceOdometer','lastServiceDate','model'].forEach(f=>{ if((keep[f]===undefined||keep[f]===''||keep[f]===null)&&v[f]) keep[f]=v[f]; }); });
  STATE.data.vehicles=STATE.data.vehicles.filter(v=>lose.indexOf(v.id)<0);
  for(const c of touched) await persist(c); await persist('vehicles');
  showToast('Merged into '+keep.regNo+'. The registry now has '+STATE.data.vehicles.length+' trucks.'); render();
}

function fwMap(lat,lon,label){ return `<a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" rel="noopener" style="color:var(--teal);">${label||(Number(lat).toFixed(4)+', '+Number(lon).toFixed(4))}</a>`; }
function fwRouteLabel(k){ return (ROUTES[k]&&ROUTES[k].label)||k; }
function fwRef(k){ const r=(STATE.data.routeRefs||{})[k]; return r&&r.pts&&r.pts.length>1?r:null; }
function fwCorridor(k,planId){ const parts=jCorridors(k,planId); if(parts.length) return {parts,pts:parts[0].pts,km:parts[0].km,saved:true,plan:true}; const r=fwRef(k); if(r) return {parts:[{pts:r.pts,km:3}],pts:r.pts,km:3,saved:true}; const d=FW_DEFAULT[k]; return d?{parts:[{pts:d.pts,km:d.km}],pts:d.pts,km:d.km,saved:false}:null; }
function fwCorCheck(p,cor){ let best=1e9,off=true; cor.parts.forEach(x=>{ const d=fwPolyDist(p,x.pts); if(d<best) best=d; if(d<=x.km) off=false; }); return {d:best,off}; }

/* ---------- data loading ---------- */
async function fetchLive(manual){
  if(!GAS_CONFIGURED) return; const L=STATE.live; if(L.busy) return; L.busy=true; if(manual||!L.rows.length){ L.status='loading'; if(STATE.tab==='live') render(); }
  try{
    let j=null; const get=async a=>{ const res=await fetch(`${GAS_URL}?action=${a}&_=${Date.now()}`); const txt=await res.text(); try{ return JSON.parse(txt); }catch(e){ return null; } };
    j=await get('watch');
    if(j&&j.ok&&Array.isArray(j.trucks)){ L.rows=j.trucks; L.silent=j.silent||[]; L.watchOff=false; L.at=j.at||new Date().toISOString(); L.status='ok'; L.msg=''; }
    else { j=await get('positions');
      if(j&&j.ok&&Array.isArray(j.positions)){ L.rows=j.positions; L.silent=j.noPosition||[]; L.watchOff=true; L.at=j.at||new Date().toISOString(); L.status='ok'; L.msg=''; }
      else if(j&&j.ok===false){ L.status='error'; L.msg=String(j.error||'The tracking feed returned an error.'); }
      else { L.status='notset'; L.msg=''; } }
    if(L.status==='ok') fwRememberPositions();
  }catch(e){ L.status='error'; L.msg='Could not reach the backend: '+(e&&e.message?e.message:e); }
  L.busy=false; if(STATE.tab==='live'||STATE.tab==='maintenance') render();
  if(L.status==='ok'&&!L.watchOff&&STATE.tab==='live') fetchHist();
}
async function fetchHist(hours){
  const L=STATE.live; hours=Math.max(hours||48,(L.sub==='fuel'||L.win>48)?168:0); if(L.histBusy||L.watchOff) return; if(L.hist&&L.histHours>=hours&&Date.now()-L.histAt<300000) return; L.histBusy=true;
  try{ const res=await fetch(`${GAS_URL}?action=history&hours=${hours}&_=${Date.now()}`); const j=JSON.parse(await res.text()); if(j&&j.ok){ L.hist=j; L.histAt=Date.now(); L.histHours=hours; } else L.hist={ok:false,error:(j&&j.error)||'history not available',trucks:{}}; }catch(e){ L.hist={ok:false,error:'history not available',trucks:{}}; } L.histHours=hours; L.histAt=Date.now();
  L.histBusy=false; if(STATE.tab==='live') render();
}
async function fetchEvents(force){
  const L=STATE.live; if(L.evBusy||L.watchOff) return; if(!force&&L.ev&&Date.now()-L.evAt<600000) return; L.evBusy=true; if(STATE.tab==='live') render();
  try{ const res=await fetch(`${GAS_URL}?action=events&hours=72&_=${Date.now()}`); const j=JSON.parse(await res.text()); L.ev=j&&j.ok?j:{ok:false,error:(j&&j.error)||'events not available',events:[],counts:{},names:{},drivers:{}}; L.evAt=Date.now(); }catch(e){ L.ev={ok:false,error:'MiX events could not be loaded',events:[],counts:{},names:{},drivers:{}}; }
  L.evBusy=false; if(STATE.tab==='live') render();
}
/* keep the last place every truck was ever seen, so trucks that go silent still have a last position */
function fwRememberPositions(){
  const ls=STATE.data.lastSeen||(STATE.data.lastSeen={}); let ch=false;
  liveRows().forEach(r=>{ if(r.lat==null||r.lon==null||!r.ts) return; const k=normReg(r.label), o=ls[k]; if(!o||String(r.ts)>String(o.ts)){ ls[k]={ts:r.ts,lat:r.lat,lon:r.lon,speed:r.speed==null?null:r.speed,addr:r.addr||'',label:r.label}; ch=true; } });
  if(ch&&Date.now()-STATE.live.lsSaved>600000){ STATE.live.lsSaved=Date.now(); persist('lastSeen'); }
}

/* ---------- pair feed rows with the registry ---------- */
function liveRows(){
  const vs=STATE.data.vehicles||[], raw=STATE.live.rows||[];
  const hit=raw.map(p=>matchTruck(p.reg||p.name||'').v||null);
  const usedV={}; hit.forEach(v=>{ if(v) usedV[v.id]=1; });
  const dg=t=>String(t||'').replace(/\D/g,'');
  raw.forEach((p,i)=>{ if(hit[i]) return; const d=dg(p.reg||p.name); if(d.length<3) return;
    const fc=raw.filter((q,j)=>!hit[j]&&dg(q.reg||q.name)===d), vc=vs.filter(v=>!usedV[v.id]&&dg(v.regNo)===d);
    if(fc.length===1&&vc.length===1){ hit[i]=vc[0]; usedV[vc[0].id]=1; p._fuzzy=1; } });
  return raw.map((p,i)=>{ const v=hit[i]; const key=v?v.id:('~'+normReg(p.reg||p.name));
    const mix=String(p.reg||p.name||'').toUpperCase();
    return Object.assign({},p,{key,vid:v?v.id:'',label:v?v.regNo:mix||'—',mixName:(v&&normReg(v.regNo)!==normReg(mix))?mix:'',inReg:!!v,st:liveStatus(p),driver:lastDriverOf(key)||''}); });
}
function fwAssign(key){
  const t=todayStr(), y=new Date(Date.now()-86400000), ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0'); let best=null;
  (STATE.data.transport||[]).forEach(r=>{ if(trKey(r)!==key||!r.route||r.date<ys||r.date>t) return; if(!best||r.date>best.date) best=r; });
  (STATE.data.journey||[]).forEach(r=>{ if(r.vehicleId!==key||!r.route||r.date<ys||r.date>t) return; if(!best||r.date>=best.date) best=r; });
  let jp=null; (STATE.data.jplans||[]).forEach(p=>{ if(p.vehicleId!==key||!(p.planId||p.routeKey)||p.date<ys||p.date>t||(p.appr&&p.appr.status==='Rejected')) return; if(!jp||p.date>=jp.date) jp=p; });
  if(jp&&(!best||jp.date>=best.date)) return {route:jp.routeKey||'other',date:jp.date,driver:jp.driverName||'',dest:jp.dest||'',planId:jp.planId||'',planRef:jp.ref};
  return best?{route:best.route,date:best.date,driver:best.driverName||'',dest:best.destination||'',planId:best.planId||''}:null;
}
/* one row per truck: all registry trucks first, then any MiX unit that is not in the registry */
function fleetRows(){
  const L=STATE.live, feed=liveRows(), byKey={}; feed.forEach(r=>{ byKey[r.key]=r; });
  const ls=STATE.data.lastSeen||{}, out=[], seen={};
  const add=(key,vid,label,cur,inReg)=>{
    const nk=normReg(label); if(seen[nk]) return; seen[nk]=1;
    const hs=fwHistFor(cur&&cur.id,label); let pos=null,src='none';
    if(cur&&cur.lat!=null){ pos={lat:cur.lat,lon:cur.lon,ts:cur.ts,speed:cur.speed,addr:cur.addr||''}; src='live'; }
    else if(ls[nk]){ pos=ls[nk]; src='saved'; }
    else if(hs&&hs.p.length){ const q=hs.p[hs.p.length-1]; pos={lat:q[1],lon:q[2],ts:new Date(q[0]*1000).toISOString(),speed:q[3],addr:''}; src='log'; }
    let st; if(cur) st=cur.st; else if(pos){ const a=liveAge(pos.ts); st={k:'red',t:a!==null&&a<4320?'No signal':'Silent since '+liveAgo(pos.ts)}; } else st={k:'red',t:'No GPS from tracker'};
    out.push({key,vid,label,mixName:cur?cur.mixName:'',inReg,cur,pos,src,st,hs,pts:hs?hs.p:[],driver:(cur&&cur.driver)||lastDriverOf(key)||'',asg:fwAssign(key),assetId:cur&&cur.id});
  };
  const vs=STATE.data.vehicles||[]; vs.forEach(v=>{ const cur=feed.find(r=>r.vid===v.id); add(v.id,v.id,v.regNo,cur||null,true); });
  feed.forEach(r=>{ if(!r.inReg) add(r.key,'',r.label,r,false); });
  return out.sort((a,b)=>({green:0,amber:1,red:2,grey:3})[a.st.k]-({green:0,amber:1,red:2,grey:3})[b.st.k]||String(a.label).localeCompare(String(b.label),undefined,{numeric:true}));
}
function fwHistFor(assetId,label){
  const H=STATE.live.hist; if(!H||!H.trucks) return null; if(assetId&&H.trucks[assetId]) return H.trucks[assetId];
  const nk=normReg(label), dg=String(label).replace(/\D/g,''); const ids=Object.keys(H.trucks);
  for(const id of ids){ if(normReg(H.trucks[id].reg)===nk) return H.trucks[id]; }
  if(dg.length>=3){ const m=ids.filter(id=>String(H.trucks[id].reg).replace(/\D/g,'')===dg); if(m.length===1) return H.trucks[m[0]]; }
  return null;
}

/* ---------- movement analysis from the saved trail ---------- */
function fwStops(pts,minMin){
  // a stop = consecutive fixes that are slow and stay within 250 m; length is until the next moving fix
  const out=[]; let i=0; minMin=minMin||20;
  while(i<pts.length){ const p=pts[i]; if(num(p[3])>=5){ i++; continue; }
    let j=i; while(j+1<pts.length&&num(pts[j+1][3])<5&&fwHav(p[1],p[2],pts[j+1][1],pts[j+1][2])<0.25) j++;
    const endT=(j+1<pts.length?pts[j+1][0]:pts[j][0]); const m=(endT-p[0])/60;
    if(m>=minMin) out.push({t0:p[0],t1:endT,min:m,lat:p[1],lon:p[2],open:j+1>=pts.length}); i=j+1; }
  return out;
}
function fwKm(pts){ let k=0; for(let i=1;i<pts.length;i++){ const d=fwHav(pts[i-1][1],pts[i-1][2],pts[i][1],pts[i][2]), dt=pts[i][0]-pts[i-1][0]; if(dt>0&&d/(dt/3600)<160) k+=d; } return k; }
function fwOdoFactor(pts){ const r=[]; for(let i=1;i<pts.length;i++){ const a=pts[i-1],b=pts[i]; if(a[4]==null||b[4]==null) continue; const d=fwHav(a[1],a[2],b[1],b[2]); if(b[0]-a[0]<=1200&&d>=1&&b[4]>a[4]) r.push((b[4]-a[4])/d); } if(r.length<5) return null; r.sort((x,y)=>x-y); const m=r[r.length>>1]; return m>200?1/1000:1; }
function fwKnownPlaces(rows){
  const all=[]; rows.forEach(r=>fwStops(r.pts,20).forEach(s=>all.push({lat:s.lat,lon:s.lon,key:r.key}))); const cl=[];
  all.forEach(s=>{ let c=cl.find(x=>fwHav(x.lat,x.lon,s.lat,s.lon)<0.4); if(!c){ c={lat:s.lat,lon:s.lon,n:0,trucks:{}}; cl.push(c); } c.n++; c.trucks[s.key]=1; });
  return cl.filter(c=>c.n>=3||Object.keys(c.trucks).length>=2);
}

/* ---------- the rules ("Fleet Watch") ---------- */
function fwAnalyze(rows){
  const gf=fwOdoFactor([].concat(...rows.map(x=>x.pts))), L=STATE.live, A={}, F=[], now=Date.now(), nowS=now/1000, hasHist=!!(L.hist&&L.hist.ok&&!L.hist.empty);
  const evs=(L.ev&&L.ev.ok)?L.ev:null; const places=hasHist?fwKnownPlaces(rows):[];
  const push=(r,sev,type,title,detail,fix)=>{ const f={key:r.key,label:r.label,sev,type,title,detail,fix}; F.push(f); (A[r.key]=A[r.key]||[]).push(f); };
  rows.forEach(r=>{
    const pts=r.pts, last=r.pos, age=last?liveAge(last.ts):null, cur=r.cur, drvR=(r.asg&&r.asg.driver)||r.driver||'the driver', drv=esc(drvR), ad=last&&last.addr?esc(last.addr):'';
    const recent=pts.filter(p=>p[0]>nowS-86400);
    // --- tamper / device health ---
    if(last&&age!==null&&age>45&&age<10080&&num(last.speed)>=5) push(r,'high','tamper','Tracker went quiet while the truck was moving',`Last report ${liveAgo(last.ts)} at ${Math.round(num(last.speed))} km/h${ad?' near '+ad:''}. Nothing since. This is the pattern of an unplugged, cut or jammed tracker (or a dead battery / no network).`,`Call ${drvR} now and ask where the truck is. If it stays silent, send someone to inspect the tracker power and aerial.`);
    if(r.asg&&(!last||age===null||age>720)) push(r,'high','tamper','Truck has a trip logged but the tracker is silent',`${r.asg.date} trip on ${fwRouteLabel(r.asg.route)} (${drv}) but the tracker ${last?'last reported '+liveAgo(last.ts):'has never reported'}. The truck cannot be followed.`,'Check the tracker power and SIM today; ask the driver to confirm the truck’s position and give the odometer reading.');
    if(cur&&age!==null&&age<=30){ const bad=[]; if(cur.sats!=null&&cur.sats<=3) bad.push(cur.sats+' satellites'); if(cur.hdop!=null&&cur.hdop>=5) bad.push('HDOP '+cur.hdop); if(cur.avl===false) bad.push('GPS fix not valid'); if(bad.length) push(r,'med','tamper','Poor or blocked GPS signal',bad.join(', ')+'. A jammer or covered aerial gives this, so does a bad aerial or parking under cover.','If it repeats outside a depot or underpass, have the aerial checked or look for a GPS jammer in the cab.'); }
    if(hasHist&&pts.length>3){
      const f=fwOdoFactor(pts)||gf, c72=pts.filter(p=>p[0]>nowS-72*3600);
      if(f){ for(let i=1;i<c72.length;i++){ const a=c72[i-1],b=c72[i]; if(b[0]-a[0]>1500&&a[4]!=null&&b[4]!=null){ const odo=(b[4]-a[4])*f, d=fwHav(a[1],a[2],b[1],b[2]); if(odo-d>10){ push(r,'high','tamper','Distance travelled while the tracker was off',`Between ${fwTime(a[0])} and ${fwTime(b[0])} the odometer advanced about ${Math.round(odo)} km but no route was recorded (${fwDur((b[0]-a[0])/60)} gap, only ${Math.round(d)} km in a straight line).`,`Ask ${drvR} what the truck did in that window. The tracker was disconnected, jammed or without power while it drove.`); break; } } } }
      for(let i=1;i<recent.length;i++){ const a=recent[i-1],b=recent[i], d=fwHav(a[1],a[2],b[1],b[2]), dt=(b[0]-a[0])/3600; if(dt>0&&dt<2&&d>5&&d/dt>160){ push(r,'med','tamper','Position jumped',`Between ${fwTime(a[0])} and ${fwTime(b[0])} the position moved ${Math.round(d)} km (${Math.round(d/dt)} km/h). That is not possible by road. It is a GPS glitch or a spoofing device.`,'Compare with the driver’s trip record. Repeated jumps on one truck means inspect the tracker.'); break; } }
      let gaps=0; for(let i=1;i<recent.length;i++){ const a=recent[i-1],b=recent[i]; if(b[0]-a[0]>1800&&num(a[3])>=5) gaps++; }
      if(gaps>=3) push(r,'med','tamper','Tracker drops out repeatedly while moving',`${gaps} times in the last 24 h the tracker stopped reporting for 30+ min straight after the truck had been moving.`,'Loose wiring or a switched-off tracker. Have the installer check the connector and fuse.');
    }
    if(evs){ const hit=evs.events.filter(e=>String(e.a)===String(r.assetId)&&FW_TAMPER_RE.test(evs.names[e.t]||'')); if(hit.length){ const nm=evs.names[hit[0].t]; push(r,'high','tamper','MiX reported a device event: '+nm,`${hit.length} such event${hit.length>1?'s':''} in the last 72 h, latest ${hit[0].ts?new Date(hit.sort((a,b)=>String(b.ts).localeCompare(String(a.ts)))[0].ts).toLocaleString():''}.`,'Treat as a tamper report: confirm with the driver and the installer.'); } }
    // --- route deviation ---
    if(r.asg&&r.asg.route){ const cor=fwCorridor(r.asg.route,r.asg.planId);
      if(cor){ const day0=Date.parse(r.asg.date+'T00:00:00')/1000, w=pts.filter(p=>p[0]>=Math.max(day0,nowS-72*3600)); let run=[],worst=null;
        const ptsAll=w.slice(); if(cur&&cur.lat!=null&&age!==null&&age<=30&&num(cur.speed)>=5) ptsAll.push([now/1000,cur.lat,cur.lon,cur.speed]);
        ptsAll.forEach(p=>{ const cc=fwCorCheck([p[1],p[2]],cor), d=cc.d; if(cc.off&&num(p[3])>=5){ run.push([p,d]); if(!worst||d>worst[1]) worst=[p,d]; if(run.length>=3&&worst) r._off=worst; } else if(run.length<3) run=[]; });
        if(r._off){ const p=r._off[0]; push(r,'high','route',`Off the ${fwRouteLabel(r.asg.route)} route`,`${Math.round(r._off[1])} km away from the ${cor.plan?'approved route':cor.saved?'saved standard':'expected'} corridor at ${fwTime(p[0])} (${fwMap(p[1],p[2],'see place')}). ${drv} was moving at ${Math.round(num(p[3]))} km/h.${cor.saved?'':' (Corridor is approximate — save a real standard route in Trails & routes to make this exact.)'}`,`Ask ${drvR} for the reason. Check the trip time and diesel used against the route average.`); }
        delete r._off; }
      else if(r.asg.route!=='east'&&r.asg.route!=='other') { /* no corridor yet for this route */ }
    }
    if(!r.asg&&cur&&age!==null&&age<=30&&num(cur.speed)>=20) push(r,'low','route','Truck is moving with no trip logged',`Moving at ${Math.round(num(cur.speed))} km/h${cur.addr?' near '+esc(cur.addr):''} but there is no Transport Ops entry for it in the last 2 days.`,'Ask dispatch which trip this is, or log it in Transport Ops.');
    if(hasHist&&r.asg){ const parts=jCorridors(r.asg.route,r.asg.planId); if(parts.length){ const idleMin=Math.min(...parts.map(x=>x.plan.idleMin||20)), sp=[]; parts.forEach(x=>(x.plan.stops||[]).forEach(s=>{ if(s.lat!=null&&s.lon!=null) sp.push(s); }));
      const bad=fwStops(recent,idleMin).filter(s=>!sp.some(q=>fwHav(q.lat,q.lon,s.lat,s.lon)<1.2)).sort((a,b)=>b.min-a.min);
      if(bad.length){ const s=bad[0]; push(r,'med','route','Idling away from the approved stops',`Stopped ${fwDur(s.min)} from ${fwTime(s.t0)} at ${fwMap(s.lat,s.lon,'this spot')}, which is not one of the stops on the approved route${bad.length>1?` (${bad.length} such stops in 24 h)`:''}.`,`Ask ${drvR} why the truck stopped there.`); } } }
    // --- driver safety ---
    if(recent.length){ const fast=recent.filter(p=>num(p[3])>FW_SPEED); if(fast.length>=2){ const mx=Math.max(...fast.map(p=>num(p[3]))); push(r,mx>=100?'high':'med','safety','Speeding on the road',`${fast.length} readings above ${FW_SPEED} km/h in the last 24 h, top speed ${Math.round(mx)} km/h.`,`Speak to ${drvR}. Feed this into the weekly HSSE scorecard.`); } }
    // --- stops away from usual places ---
    if(hasHist&&r.asg&&!jCorridors(r.asg.route,r.asg.planId).length){ fwStops(recent,45).forEach(s=>{ if(places.length&&!places.some(c=>fwHav(c.lat,c.lon,s.lat,s.lon)<0.5)){ if(!r._unplanned) r._unplanned=s; } }); if(r._unplanned){ const s=r._unplanned; push(r,'low','route','Long stop away from the usual places',`Stopped ${fwDur(s.min)} from ${fwTime(s.t0)} at ${fwMap(s.lat,s.lon,'this spot')}, which is not a place trucks normally stop.`,'Ask the driver (rest stop, breakdown, queue or unauthorised stop).'); delete r._unplanned; } }
    if(!hasHist) return;
  });
  // fuel hints from the existing route insights
  try{ const S=routeFuelStats('lastweek'); routeFuelInsights(S).filter(x=>x.sev==='red').slice(0,3).forEach(x=>F.push({key:'',label:'Fuel',sev:'med',type:'fuel',title:'Fuel outlier last week',detail:x.text,fix:'Open Fuel & Deliveries → Route insights.'})); }catch(e){}
  const o={high:0,med:1,low:2}; F.sort((a,b)=>o[a.sev]-o[b.sev]||String(a.label).localeCompare(String(b.label),undefined,{numeric:true}));
  return {A,F,hasHist,places};
}

/* ---------- rendering ---------- */
function fwSevTag(s){ return s==='high'?'red':(s==='med'?'amber':'teal'); }
function fwChips(A,key){ const a=A[key]||[]; if(!a.length) return '<span class="dim small">—</span>'; const m={}; a.forEach(x=>{ m[x.type]=Math.max(m[x.type]||0,x.sev==='high'?3:x.sev==='med'?2:1); }); const nm={tamper:'Device',route:'Route',safety:'Speed',fuel:'Fuel'}; return Object.keys(m).map(t=>`<span class="tag ${m[t]===3?'red':m[t]===2?'amber':'teal'}">${nm[t]||t}</span>`).join(' '); }
function fwFindingsCard(F,limit,title){
  const list=limit?F.slice(0,limit):F;
  if(!F.length) return `<div class="card" style="border-left:3px solid var(--green);margin-bottom:14px;"><div style="font-weight:600;">Fleet Watch — nothing needs attention right now</div><div class="dim small" style="margin-top:4px;">No tamper signs, route deviations or speeding found in the data received so far.</div></div>`;
  return `<div class="card" style="border-left:3px solid var(--${F.some(x=>x.sev==='high')?'red':'amber'});margin-bottom:14px;"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;"><div style="font-weight:600;">${esc(title||'Fleet Watch — what needs your attention')}</div><div class="dim small">${F.filter(x=>x.sev==='high').length} urgent · ${F.filter(x=>x.sev==='med').length} to check · ${F.filter(x=>x.sev==='low').length} for information</div></div>
   <div style="margin-top:8px;display:grid;gap:8px;">${list.map(f=>`<div style="padding:9px 11px;border-radius:9px;background:var(--panel-2);"><div><span class="tag ${fwSevTag(f.sev)}">${f.sev==='high'?'Urgent':f.sev==='med'?'Check':'Info'}</span> <b>${esc(f.label)}</b> — ${esc(f.title)}</div><div class="small" style="margin-top:4px;line-height:1.55;">${f.detail}</div><div class="small" style="margin-top:3px;color:var(--teal);">→ ${esc(f.fix)}</div></div>`).join('')}</div>
   ${limit&&F.length>limit?`<div class="dim small" style="margin-top:8px;">${F.length-limit} more — see the Tamper watch and Trails tabs.</div>`:''}<div class="dim small" style="margin-top:8px;">Automatic checks on tracker data, trip entries and fuel records (rule-based, not guesses). A flag means “look at this”, not proof by itself.</div></div>`;

    if(r.pos) { L.circleMarker([r.pos.lat,r.pos.lon],{radius:9,color:'#0b0e13',weight:1.5,fillColor:col[r.st.k],fillOpacity:.95}).addTo(map).bindTooltip(r.label+' — '+liveAgo(r.pos.ts)); b.push([r.pos.lat,r.pos.lon]); }
    if(b.length) map.fitBounds(b,{padding:[30,30],maxZoom:12}); else map.setView([6.9,3.4],9); return;
  }

    const m=L.circleMarker([r.pos.lat,r.pos.lon],{radius:live?8:7,color:bad?'#e1543f':'#0b0e13',weight:bad?3:1.5,fillColor:col[r.st.k],fillOpacity:live?.95:.35}).addTo(map);
    m.bindPopup(`<b>${esc(r.label)}</b><br>${esc(r.st.t)}${r.cur&&r.cur.speed!=null?' · '+fmt(num(r.cur.speed))+' km/h':''}<br>${live?'':'Last known: '}${esc(liveAgo(r.pos.ts))}${r.pos.addr?'<br>'+esc(r.pos.addr):''}${r.driver?'<br>Driver: '+esc(r.driver):''}${(AN.A[r.key]||[]).map(f=>'<br><span style="color:#c0392b">⚠ '+esc(f.title)+'</span>').join('')}`); m.bindTooltip(r.label,{direction:'top'}); b.push([r.pos.lat,r.pos.lon]); });
  map.fitBounds(b,{padding:[30,30],maxZoom:13});
}

/* ===== Route fuel insights: diesel litres and gas (SCM) per route, outliers and recommendations ===== */
const RF_PERIODS=[['lastweek','Last week'],['prevweek','Week before'],['month','This month'],['lastmonth','Last month']];
function routeOfLocations(l,o){
  const t=s=>String(s||'').toLowerCase(); const A=t(l)+' | '+t(o);
  const has=re=>re.test(A); const apapa=has(/apapa/), adu=has(/adu[nm]{1,2}bu/), ew=has(/ewek?oro/), sg=has(/sh?agamu/), it=has(/itori/);
  if(apapa&&ew) return 'gypsum_ewekoro'; if(apapa&&sg) return 'gypsum_sagamu'; if(adu&&ew) return 'gypsum_adumbu'; if(adu&&sg) return 'gypsum_adumbu_sagamu';
  if((ew||it)&&sg) return 'clinker'; return 'other';
}
function rfLabel(k){ return k==='other'?'Other / unmatched':(ROUTES[k]?ROUTES[k].label:k); }
function routeFuelStats(period){
  const inP=r=>inPeriod(r.date,period); const R={}; const get=k=>R[k]||(R[k]={key:k,dTrips:0,dDist:0,dL:0,dCost:0,kmLDist:0,kmLLit:0,dTruck:{},gQty:0,gCost:0,gTrips:0,gTon:0,gTruck:{},trips:0,ton:0});
  let unmatched=0;
  (STATE.data.dieselTrips||[]).filter(inP).forEach(r=>{ const k=routeOfLocations(r.loadingLocation,r.offloadingLocation); if(k==='other') unmatched++; const c=dieselCalc(r), x=get(k); x.dTrips++; x.dL+=c.lt; x.dCost+=c.ct; if(c.dist>0){ x.dDist+=c.dist; if(c.lt>0){ x.kmLDist+=c.dist; x.kmLLit+=c.lt; } }
    const t=x.dTruck[r.vehicleId||'none']||(x.dTruck[r.vehicleId||'none']={vid:r.vehicleId,trips:0,L:0,dist:0}); t.trips++; t.L+=c.lt; t.dist+=c.dist; });
  const W=cngWeights(); const units={}, trips={}, ton={}; // per truck, per route
  (STATE.data.transport||[]).filter(inP).forEach(r=>{ const k=r.route||'other'; const x=get(k); x.trips+=num(r.tripsActual); x.ton+=num(r.tonnageActual); if(!r.vehicleId) return; const v=r.vehicleId; const u=num(r.tripsActual)*(tripKind(k)==='adumbu'?W.wa:W.wl);
    (units[v]=units[v]||{})[k]=(units[v][k]||0)+u; (trips[v]=trips[v]||{})[k]=(trips[v][k]||0)+num(r.tripsActual); (ton[v]=ton[v]||{})[k]=(ton[v][k]||0)+num(r.tonnageActual); });
  const fills={}; (STATE.data.cngFills||[]).filter(inP).forEach(r=>{ if(!r.vehicleId) return; const f=fills[r.vehicleId]||(fills[r.vehicleId]={q:0,c:0,n:0}); f.q+=num(r.quantity); f.c+=num(r.cost); f.n++; });
  const noFill=[];
  Object.keys(units).forEach(v=>{ const U=Object.values(units[v]).reduce((a,b)=>a+b,0), f=fills[v]; if(!f){ if(U>0) noFill.push({vid:v,trips:Object.values(trips[v]).reduce((a,b)=>a+b,0)}); return; } if(U<=0) return;
    Object.keys(units[v]).forEach(k=>{ const share=units[v][k]/U, x=get(k), q=f.q*share, c=f.c*share; x.gQty+=q; x.gCost+=c; x.gTrips+=trips[v][k]; x.gTon+=ton[v][k]; x.gTruck[v]={vid:v,q,c,trips:trips[v][k],ton:ton[v][k]}; }); });
  const order=MAT_GROUPS.map(g=>g[1][0]).concat(['east','other']); const rows=Object.values(R).sort((a,b)=>(order.indexOf(a.key)<0?99:order.indexOf(a.key))-(order.indexOf(b.key)<0?99:order.indexOf(b.key)));
  rows.forEach(x=>{ x.kmL=x.kmLLit>0?x.kmLDist/x.kmLLit:null; x.lPerTrip=x.dTrips?x.dL/x.dTrips:null; x.costPerTrip=x.dTrips?x.dCost/x.dTrips:null; x.lPer100=x.kmLDist>0?x.kmLLit/x.kmLDist*100:null; x.scmPerTrip=x.gTrips?x.gQty/x.gTrips:null; x.scmPerTon=x.gTon>0?x.gQty/x.gTon:null; x.gCostPerTrip=x.gTrips?x.gCost/x.gTrips:null; });
  return {rows,unmatched,noFill};
}
function routeFuelInsights(S){
  const out=[]; const name=v=>v&&v!=='none'?vehicleLabel(v):'Unassigned truck';
  S.rows.forEach(x=>{
    const dl=Object.values(x.dTruck).filter(t=>t.trips>=1&&t.L>0);
    if(x.dTrips>=3&&dl.length>=2){ dl.forEach(t=>{ const p=t.L/t.trips, d=(p/x.lPerTrip-1)*100; if(d>=15) out.push({sev:d>=30?'red':'amber',text:`${name(t.vid)} used ${fmt(p,0)} L per trip on ${rfLabel(x.key)} — ${fmt(d,0)}% above the route average of ${fmt(x.lPerTrip,0)} L. Check for idling, a detour, a fuel leak or fuel drawn outside the trip.`}); }); }
    if(x.kmL!==null&&x.dTrips>=3){ dl.forEach(t=>{ if(t.dist>0&&t.L>0){ const kl=t.dist/t.L; if(kl<x.kmL*0.8) out.push({sev:'amber',text:`${name(t.vid)} managed ${fmt(kl,2)} km/L on ${rfLabel(x.key)} against ${fmt(x.kmL,2)} km/L for the route. Worth a service check (injectors, filters, tyre pressure) or a driver coaching session.`}); } }); }
    const gl=Object.values(x.gTruck).filter(t=>t.trips>0);
    if(gl.length>=2&&x.scmPerTrip>0){ gl.forEach(t=>{ const p=t.q/t.trips, d=(p/x.scmPerTrip-1)*100; if(d>=20) out.push({sev:d>=40?'red':'amber',text:`${name(t.vid)} took ${fmt(p,1)} SCM of gas per trip on ${rfLabel(x.key)} — ${fmt(d,0)}% above the route average of ${fmt(x.scmPerTrip,1)} SCM. Check fill volumes against trips logged and look for regulator or leak problems.`}); }); }
  });
  if(S.noFill.length) out.push({sev:'amber',text:`${S.noFill.length} truck${S.noFill.length>1?'s':''} did trips in this period but have no CNG fill-up logged (${S.noFill.slice(0,5).map(n=>vehicleLabel(n.vid)).join(', ')}${S.noFill.length>5?'…':''}). Their gas use is missing from these figures — log the fills or confirm they ran on diesel only.`});
  if(S.unmatched) out.push({sev:'amber',text:`${S.unmatched} diesel trip${S.unmatched>1?'s':''} could not be matched to a route. Use the place names Apapa, Adumbu, Itori, Ewekoro or Sagamu as the loading/offloading locations so every trip lands on the right route.`});
  const withC=S.rows.filter(x=>x.costPerTrip>0&&x.dTrips>=3&&x.key!=='other'); if(withC.length>=2){ const hi=withC.slice().sort((a,b)=>b.costPerTrip-a.costPerTrip)[0], lo=withC.slice().sort((a,b)=>a.costPerTrip-b.costPerTrip)[0]; out.push({sev:'info',text:`Diesel cost per trip is highest on ${rfLabel(hi.key)} (${naira(hi.costPerTrip)}) and lowest on ${rfLabel(lo.key)} (${naira(lo.costPerTrip)}). Use this when quoting or reviewing route rates.`}); }
  return out.sort((a,b)=>({red:0,amber:1,info:2})[a.sev]-({red:0,amber:1,info:2})[b.sev]);
}
function renderRouteFuel(){
  const p=STATE.rfPeriod||'lastweek'; const S=routeFuelStats(p); const rows=S.rows; const ins=routeFuelInsights(S);
  const tot=rows.reduce((a,x)=>{ a.dL+=x.dL; a.dC+=x.dCost; a.q+=x.gQty; a.gc+=x.gCost; a.dt+=x.dTrips; return a; },{dL:0,dC:0,q:0,gc:0,dt:0});
  const tabs=`<div class="tabs" style="margin-bottom:12px;">${RF_PERIODS.map(([k,l])=>`<button type="button" data-rf-period="${k}" class="${p===k?'active':''}">${l}<span class="dim small" style="margin-left:6px;">${esc(rangeText(periodRange(k)))}</span></button>`).join('')}</div>`;
  if(!rows.length) return tabs+`<div class="card dim" style="padding:24px;text-align:center;">No transport, diesel or gas entries in this period.</div>`;
  const tag=s=>s==='red'?'red':s==='amber'?'amber':'teal'; const dash='<span class="dim">—</span>';
  return tabs+`<div class="grid cols-3" style="margin-bottom:12px;"><div class="card kpi"><div class="label">Diesel used (logged trips)</div><div class="value">${fmt(tot.dL,0)} L</div><div class="dim small">${fmt(tot.dt)} trips · ${naira(tot.dC)}</div></div><div class="card kpi"><div class="label">Gas used (allocated)</div><div class="value">${fmt(tot.q,0)} SCM</div><div class="dim small">${naira(tot.gc)}</div></div><div class="card kpi"><div class="label">Insights to act on</div><div class="value" style="color:${ins.some(i=>i.sev==='red')?'var(--red)':ins.some(i=>i.sev==='amber')?'var(--amber)':'var(--green)'};">${ins.filter(i=>i.sev!=='info').length}</div></div></div>
  <div class="section-sub" style="margin:8px 0;">Diesel by route</div>
  <div class="table-wrap"><table><thead><tr><th>Route</th><th>Diesel trips logged</th><th>Litres</th><th>Litres / trip</th><th>km / L</th><th>L / 100 km</th><th>Cost / trip</th></tr></thead><tbody>${rows.map(x=>`<tr><td style="white-space:normal;">${esc(rfLabel(x.key))}</td><td>${fmt(x.dTrips)}</td><td>${x.dL?fmt(x.dL,0):dash}</td><td>${x.lPerTrip?fmt(x.lPerTrip,0):dash}</td><td>${x.kmL?fmt(x.kmL,2):dash}</td><td>${x.lPer100?fmt(x.lPer100,1):dash}</td><td>${x.costPerTrip?naira(x.costPerTrip):dash}</td></tr>`).join('')}</tbody></table></div>
  <div class="section-sub" style="margin:16px 0 8px;">Gas (CNG) by route <span class="dim small" style="font-weight:400;">— each truck’s fills are shared across its routes by the trips it did</span></div>
  <div class="table-wrap"><table><thead><tr><th>Route</th><th>Trips (trucks with fills)</th><th>Gas (SCM)</th><th>SCM / trip</th><th>SCM / tonne</th><th>Cost / trip</th></tr></thead><tbody>${rows.map(x=>`<tr><td style="white-space:normal;">${esc(rfLabel(x.key))}</td><td>${fmt(x.gTrips)} <span class="dim small">of ${fmt(x.trips)}</span></td><td>${x.gQty?fmt(x.gQty,1):dash}</td><td>${x.scmPerTrip?fmt(x.scmPerTrip,1):dash}</td><td>${x.scmPerTon?fmt(x.scmPerTon,2):dash}</td><td>${x.gCostPerTrip?naira(x.gCostPerTrip):dash}</td></tr>`).join('')}</tbody></table></div>

}
