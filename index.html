  // plain-language summary
  const say=[]; const dB=A.breakdowns-B.breakdowns;
  say.push([dB>0?'amber':'green',`<b>${A.breakdowns}</b> breakdown/repair event(s) in the week reviewed versus <b>${B.breakdowns}</b> the week before${dB?` (${dB>0?'+':''}${dB})`:''}.${dB>0?' Reactive work is rising.':dB<0?' Reactive work is falling.':''}`]);
  const recurring=tids.filter(t=>A.truck[t]&&B.truck[t]); if(recurring.length) say.push(['red',`${recurring.map(t=>esc(vehicleLabel(t))).join(', ')} broke down in <b>both</b> weeks — look at root cause, not another quick fix.`]);
  const fresh=tids.filter(t=>A.truck[t]&&!B.truck[t]); if(fresh.length) say.push(['amber',`New in the week reviewed: ${fresh.map(t=>esc(vehicleLabel(t))).join(', ')}.`]);
  A.repeatList.slice(0,4).forEach(r=>{ const x=H.byId[r.id]; say.push(['red',`Repeat: <b>${esc(vehicleLabel(r.vehicleId))}</b> — ${esc(x.ck.replace(/^Other — /,''))} repaired again ${x.sinceSame} day(s) after the last time (time #${x.nth}).`]); });
  A.partsAgainList.slice(0,4).forEach(p=>say.push([p.prevGap<=30?'red':'amber',`Part bought again: <b>${esc(partTitle(p.name))}</b> for ${esc(vehicleLabel(p.vehicleId))} — last bought ${p.prevGap} day(s) earlier (${fmtDate(p.prevDate)}).`]));
  if(A.downtime!==B.downtime) say.push([A.downtime>B.downtime?'amber':'green',`Repair downtime ${A.downtime>B.downtime?'rose':'fell'} from ${fmt(B.downtime,1)} h to ${fmt(A.downtime,1)} h.`]);
  if(A.cost||B.cost) say.push([A.cost>B.cost?'amber':'green',`Maintenance spend ${A.cost>B.cost?'rose':'fell'} from ${naira(B.cost)} to ${naira(A.cost)}.`]);
  if(!A.breakdowns&&!B.breakdowns&&!A.scheduled&&!B.scheduled) say.push(['amber','Nothing was logged in either week. Log services, breakdowns and repairs in the KPIs &amp; Registry tab to see the comparison.']);
  const sum=say.map(([sev,t])=>`<div class="rec-item ${sev}"><div class="txt">${t}</div></div>`).join('');
  return bar+`<div class="section-title" style="margin-top:6px;"><span>What changed</span><div class="line"></div></div><div class="rec-list">${sum}</div>
  <div class="section-title"><span>Week-on-week comparison</span><div class="line"></div></div>
  <div class="table-wrap"><table><thead><tr><th>Measure</th><th>${weekRangeText(start)}</th><th>${weekRangeText(prevStart)}</th><th>Change</th></tr></thead><tbody>${trs}</tbody></table></div>
  <div class="grid cols-2" style="margin-top:14px;">
    <div><div class="section-sub" style="margin:0 0 8px;">Breakdowns by component</div><div class="table-wrap"><table><thead><tr><th>Component</th><th>Reviewed week</th><th>Week before</th><th>Change</th></tr></thead><tbody>${compRows||'<tr class="empty-row"><td colspan="4">No breakdowns in either week.</td></tr>'}</tbody></table></div></div>
    <div><div class="section-sub" style="margin:0 0 8px;">Breakdowns by truck</div><div class="table-wrap"><table><thead><tr><th>Truck</th><th>Reviewed week</th><th>Week before</th><th>Change</th><th>Status</th><th></th></tr></thead><tbody>${truckRows||'<tr class="empty-row"><td colspan="6">No breakdowns in either week.</td></tr>'}</tbody></table></div></div>
  </div>
  ${maintDriverSection(start)}`;
}

/* ---------- safety: weekly comparison + best / worst 3 drivers ---------- */
function hsseWeekNums(w){
  const ds=(w&&w.drivers||[]).filter(d=>!d.na); const c={RED:0,AMBER:0,GREEN:0}; ds.forEach(d=>c[bandOf(d.t||0)]++);
  const v={HB:0,HA:0,OS:0,HOS:0}; ds.forEach(d=>(d.v||[]).forEach(k=>{ if(v[k]!==undefined) v[k]++; }));
  return {count:ds.length,avg:ds.length?ds.reduce((a,d)=>a+(d.t||0),0)/ds.length:0,RED:c.RED,AMBER:c.AMBER,GREEN:c.GREEN,viol:ds.filter(d=>(d.v||[]).length).length,v,dist:ds.reduce((a,d)=>a+(d.d||0),0)};
}
function hsseLogNums(startIso){
  if(!startIso) return null; const raw=STATE.data.hsseLogs||{}; const inW=iso=>!!iso&&iso>=startIso&&iso<=addDays(startIso,6);
  const insp=(raw.inspections||[]).filter(x=>inW(x.iso));
  return {incidents:(raw.incidents||[]).filter(i=>inW(i.iso)).length,inspGaps:insp.filter(x=>inspectionIssues(x).length).length,insp:insp.length,toolbox:(raw.toolbox||[]).filter(x=>inW(x.iso)).length,ppeFail:(raw.ppe||[]).filter(x=>inW(parseLooseDate(x.period))&&/fail|non|^no/i.test(x.status)).length};
}
function hsseCompare(A){
  const F=A.focus; if(!F.latest) return '';
  const cur=hsseWeekNums(F.latest), prv=F.prev?hsseWeekNums(F.prev):null;
  const cl=hsseLogNums(F.start), pl=F.start?hsseLogNums(addDays(F.start,-7)):null;
  const head=`<div class="section-title" style="margin-top:6px;"><span>This week vs the week before</span><div class="line"></div><span class="dim small mono">${esc(wkLabel(F.latest))}${F.prev?' vs '+esc(wkLabel(F.prev)):''}</span></div>`;
  if(!prv) return head+`<div class="note warn">No scorecard has been uploaded for the week before, so there is nothing to compare with yet. Upload the previous week’s HSSE report and the comparison appears automatically.</div>`;
  const rows=[['Drivers scored',cur.count,prv.count,null,0],['Fleet average score',cur.avg,prv.avg,'lower',2],['RED drivers (≥ 5.0)',cur.RED,prv.RED,'lower',0],['AMBER drivers (2.0 – 4.99)',cur.AMBER,prv.AMBER,'lower',0],['GREEN drivers (< 2.0)',cur.GREEN,prv.GREEN,'higher',0],['Drivers with any violation',cur.viol,prv.viol,'lower',0],['Harsh braking',cur.v.HB,prv.v.HB,'lower',0],['Harsh acceleration',cur.v.HA,prv.v.HA,'lower',0],['Over-speeding',cur.v.OS,prv.v.OS,'lower',0],['Hours-of-service exceeded',cur.v.HOS,prv.v.HOS,'lower',0]];
  if(cl&&pl) rows.push(['Incidents reported',cl.incidents,pl.incidents,'lower',0],['Vehicle inspections with gaps',cl.inspGaps,pl.inspGaps,'lower',0],['Toolbox talks held',cl.toolbox,pl.toolbox,'higher',0],['PPE checks failed',cl.ppeFail,pl.ppeFail,'lower',0]);
  const trs=rows.map(r=>`<tr><td><b>${r[0]}</b></td><td>${fmt(r[1],r[4])}</td><td class="dim">${fmt(r[2],r[4])}</td><td>${deltaCell(r[1],r[2],r[3],r[4])}</td></tr>`).join('');
  // driver movers
  const mv=A.activeP.filter(p=>p.delta!==null&&p.trend!=='New').slice();
  const better=mv.filter(p=>p.delta<-0.5).sort((a,b)=>a.delta-b.delta).slice(0,3), worse=mv.filter(p=>p.delta>0.5).sort((a,b)=>b.delta-a.delta).slice(0,3);
  const mvl=(l,cls)=>l.length?l.map(p=>`<div class="small" style="margin-bottom:4px;cursor:pointer;" data-driver-detail="${esc(p.key)}"><b>${esc(p.name)}</b> <span class="${cls}">${p.delta>0?'▲ +':'▼ −'}${fmt(Math.abs(p.delta),2)}</span> <span class="dim">(${fmt(p.score-p.delta,2)} → ${fmt(p.score,2)})</span></div>`).join(''):'<div class="dim small">None.</div>';
  const dAvg=cur.avg-prv.avg;
  const lead=`<div class="rec-item ${dAvg>0.05?'amber':'green'}" style="margin-bottom:12px;"><div class="txt">Fleet average score is <b>${fmt(cur.avg,2)}</b> versus <b>${fmt(prv.avg,2)}</b> the week before — ${Math.abs(dAvg)<0.05?'unchanged':dAvg>0?'<b>worse</b> (higher is worse)':'<b>better</b> (lower is better)'}. ${cur.RED-prv.RED>0?`${cur.RED-prv.RED} more driver(s) are in the RED band.`:cur.RED-prv.RED<0?`${prv.RED-cur.RED} fewer driver(s) are in the RED band.`:''}</div></div>`;
  return head+lead+`<div class="grid cols-2"><div class="table-wrap"><table><thead><tr><th>Measure</th><th>${esc(wkLabel(F.latest))}</th><th>${esc(wkLabel(F.prev))}</th><th>Change</th></tr></thead><tbody>${trs}</tbody></table></div>
    <div class="card"><div style="font-weight:600;font-size:13.5px;margin-bottom:8px;">Biggest driver movers</div><div class="section-sub" style="margin:0 0 6px;">Most improved</div>${mvl(better,'up-good')}<div class="section-sub" style="margin:12px 0 6px;">Most worsened</div>${mvl(worse,'up-bad')}</div></div>`;
}
function hsseBestWorst(A){
  const F=A.focus; const pool=A.activeP.filter(p=>p.band!=='NA'&&p.tele);
  const head=`<div class="section-title"><span>Best &amp; worst 3 drivers — safety</span><div class="line"></div><span class="dim small mono">${F.latest?esc(wkLabel(F.latest)):''}</span></div>`;
  if(!pool.length) return head+`<div class="card dim" style="text-align:center;padding:22px;">No scored drivers for this week.</div>`;
  const sorted=pool.slice().sort((a,b)=>a.score-b.score||b.dist-a.dist); const k=pickN(sorted);
  const best=sorted.slice(0,k); const rest=sorted.filter(x=>!best.includes(x)); const worst=rest.slice().sort((a,b)=>b.score-a.score||b.rating-a.rating).slice(0,k);
  const map=p=>({...p,click:p.key});
  const trend=p=>p.delta===null?'<span class="dim">new</span>':(Math.abs(p.delta)<0.5?'<span class="dim">stable</span>':`<span class="${p.delta<0?'up-good':'up-bad'}">${p.delta<0?'▼ −':'▲ +'}${fmt(Math.abs(p.delta),1)}</span>`);
  const cols=[{h:'Score',f:p=>`<b>${fmt(p.score,2)}</b>`},{h:'Band',f:p=>p.band?`<span class="tag ${BAND_TAG[p.band]}">${p.band}</span>`:'—'},{h:'Distance',f:p=>fmt(p.dist,0)+' km'},{h:'Violations',f:p=>p.viol.length?p.viol.map(k=>esc(HSSE_VIOL[k])).join(', '):'<span class="dim">none</span>'},{h:'vs last week',f:trend}];

  <div class="grid cols-2">${rankCard('Safest drivers','good',best.map(map),cols)}${rankCard('Highest-risk drivers','bad',worst.map(map),cols)}</div>`;
}

function lastDriverFor(vid){

/* ---------- v5 event wiring ---------- */
function attachEventsV5(app){
  app.querySelectorAll('[data-edit]').forEach(btn=>btn.addEventListener('click',(e)=>{ e.preventDefault(); e.stopPropagation(); const [coll,id]=btn.getAttribute('data-edit').split(':'); STATE.editing={coll,id}; STATE.truckDetail=null; render(); }));
  app.querySelectorAll('[data-close-edit]').forEach(el=>el.addEventListener('click',(e)=>{ if(e.target===el){ STATE.editing=null; render(); } }));
  const ef=app.querySelector('[data-edit-form]');
  if(ef){
    const oi=ef.elements['otherDetail'], cs=ef.elements['component'];
    if(oi&&cs){ const sync=()=>{ oi.required=cs.value==='Other'; }; cs.addEventListener('change',sync); sync(); }
    ef.addEventListener('submit',async(e)=>{
      e.preventDefault(); const ed=STATE.editing; if(!ed) return;
      const arr=STATE.data[ed.coll]||[]; const idx=arr.findIndex(r=>r.id===ed.id); if(idx<0){ STATE.editing=null; render(); return; }
      const rec={...arr[idx]}; new FormData(ef).forEach((v,k)=>{ rec[k]=v; }); if(ed.coll==='transport') normalizeCombo(rec);
      if(ed.coll==='vehicles'){
        const dup=arr.find(v=>v.id!==rec.id&&String(v.regNo).toLowerCase()===String(rec.regNo).trim().toLowerCase());
        if(dup){ alert('Another vehicle already uses the reg no. '+rec.regNo+'.'); return; }
        rec.regNo=String(rec.regNo).trim();
      }
      if(ed.coll==='dieselTrips'){ const er=dieselValidate(rec); if(er){ alert(er); return; } }
      if(ed.coll==='maintenance'){ prepMaintRec(rec); if(rec.status!=='Open') delete rec.completedDate; }
      STATE.data[ed.coll]=arr.map((r,i)=>i===idx?rec:r); STATE.editing=null;
      const rc=ed.coll==='maintenance'&&reconcileServices();
      await persist(ed.coll); if(rc) await persist('vehicles'); showToast(rc?'Changes saved — truck registry updated.':'Changes saved.');
    });
  }
  app.querySelectorAll('[data-mlog-filter]').forEach(el=>el.addEventListener('change',()=>{ if(el.getAttribute('data-mlog-filter')==='truck') STATE.mlogTruck=el.value; else STATE.mlogType=el.value; STATE.mlogAll=false; render(); }));
  const ma=app.querySelector('[data-mlog-all]'); if(ma) ma.addEventListener('click',()=>{ STATE.mlogAll=true; render(); });
  app.querySelectorAll('[data-hist-filter]').forEach(el=>el.addEventListener('change',()=>{ const k=el.getAttribute('data-hist-filter'); if(k==='truck') STATE.histTruck=el.value; else if(k==='type') STATE.histType=el.value; else STATE.histWin=parseInt(el.value,10)||0; render(); }));
  app.querySelectorAll('[data-hist-truck]').forEach(d=>d.addEventListener('toggle',()=>{ STATE.histOpen=STATE.histOpen||{}; STATE.histOpen[d.getAttribute('data-hist-truck')]=d.open; }));
  app.querySelectorAll('[data-parts-filter]').forEach(el=>el.addEventListener('change',()=>{ if(el.getAttribute('data-parts-filter')==='truck') STATE.partsTruck=el.value; else STATE.partsWin=parseInt(el.value,10)||0; STATE.partsAll=false; render(); }));
  const pa=app.querySelector('[data-parts-all]'); if(pa) pa.addEventListener('click',()=>{ STATE.partsAll=true; render(); });
  const lt=app.querySelector('[data-part-lookup="truck"]'), lp=app.querySelector('[data-part-lookup="part"]'), lo=app.querySelector('#part-lookup-out');
  if(lt&&lp&&lo){ const go=()=>{ lo.innerHTML=lp.value.trim()?partHintHTML(lt.value,lp.value):''; }; lt.addEventListener('change',go); lp.addEventListener('input',go); lp.addEventListener('change',go); }
  app.querySelectorAll('[data-maint-week]').forEach(el=>el.addEventListener('change',()=>{ STATE.maintWeek=el.value; render(); }));
  app.querySelectorAll('[data-maint-wk]').forEach(el=>el.addEventListener('click',()=>{ const cur=wkStart(todayStr()); STATE.maintWeek=el.getAttribute('data-maint-wk')==='cur'?cur:null; render(); }));
  const mf=app.querySelector('form[data-log-form="maintenance"]');
  if(mf){
    const hint=mf.querySelector('#parts-hint'), wrap=mf.querySelector('#other-wrap');
    const upd=()=>{ if(hint) hint.innerHTML=partHintHTML(mf.elements['vehicleId'].value,mf.elements['parts'].value); };
    const oth=()=>{ const on=mf.elements['component'].value==='Other'; wrap.style.display=on?'':'none'; mf.elements['otherDetail'].required=on; };
    mf.addEventListener('input',e=>{ if(e.target.name==='parts') upd(); });
    mf.addEventListener('change',e=>{ if(e.target.name==='vehicleId'||e.target.name==='parts') upd(); if(e.target.name==='component') oth(); });
    mf.addEventListener('reset',()=>setTimeout(()=>{ upd(); oth(); },0));
  }
  const tf=app.querySelector('form[data-log-form="transport"]');
  if(tf) tf.addEventListener('change',e=>{ if(e.target.name!=='vehicleId'||!e.target.value) return; const dn=tf.elements['driverName']; if(dn&&!dn.value){ const n=lastDriverFor(e.target.value); if(n) dn.value=n; } });
}

/* ---------- Daily Inputs: everything entered on a given day, across every department ---------- */
function enteredAt(id){ const t=parseInt(String(id||'').slice(10),36); return (t>1.5e12&&t<4e12)?new Date(t):null; }
function humanKey(k){ return k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()); }
function genericDesc(r){
  const out=[]; if(r.vehicleId) out.push(vehicleLabel(r.vehicleId));
  Object.keys(r).forEach(k=>{ if(['id','date','vehicleId','srcId','srcItem','raised','completedDate','time'].includes(k)||k.indexOf('c_')===0) return; const v=r[k]; if(v===''||v===null||v===undefined) return; if(typeof v==='object') return; out.push(humanKey(k)+': '+String(v).slice(0,40)); });
  return out.slice(0,7);
}
const DAILY_DEPTS=[['Transport Ops','transport'],['Journey Mgmt','journey'],['Inspections','inspections'],['Safety (HSE)','safety'],['Maintenance','maintenance'],['Fuel & Deliveries','fuel'],['Port Files','port']];
const DAILY_SRC=[
  {k:'transport',dept:'Transport Ops',what:()=>'Tonnage entry',d:r=>[trLabelCell(r),r.driverName,ROUTES[r.route]?ROUTES[r.route].label:'',r.material,r.tripsActual!==undefined&&r.tripsActual!==''?r.tripsActual+' trip(s)':'',r.tonnageActual?r.tonnageActual+' MT':'']},
  {k:'journey',dept:'Journey Mgmt',what:()=>'Trip',d:r=>[vehicleLabel(r.vehicleId),r.driverName,ROUTES[r.route]?ROUTES[r.route].label:r.route,r.durationActual?r.durationActual+' h':'',r.onTime==='No'?'Late':'On time']},
  {k:'pretrip',dept:'Journey Mgmt',what:r=>(r.type||'Trip')+' check',d:r=>[vehicleLabel(r.vehicleId),r.driverName,r.result,r.defects?splitKeys(r.defects).length+' defect(s)':'']},
  {k:'inspections',dept:'Inspections',what:()=>'Inspection summary',d:genericDesc},
  {k:'safety',dept:'Safety (HSE)',what:()=>'Daily safety entry',d:r=>['Hours worked: '+num(r.hoursWorked),'Incidents: '+num(r.incidents),'Near-misses: '+num(r.nearMisses),'Trucks inspected: '+num(r.trucksInspected),'Patrols: '+num(r.roadPatrols),'Toolbox talks: '+num(r.toolboxTalks)]},
  {k:'maintenance',dept:'Maintenance',what:r=>typeLabel(r.type),d:r=>[vehicleLabel(r.vehicleId),whatDone(r),r.status==='Open'?'Open job':'',r.downtimeHours?r.downtimeHours+' h down':'',r.parts?'Parts: '+r.parts:'',r.cost?naira(num(r.cost)):'',r.notes]},
  {k:'maintenanceDaily',dept:'Maintenance',what:()=>'Daily activity',d:r=>['Trucks inspected: '+num(r.trucksInspected),'Patrols: '+num(r.roadPatrols),'Toolbox talks: '+num(r.toolboxTalks)]},
  {k:'maintInspections',dept:'Maintenance',what:()=>'Truck inspection',d:r=>[vehicleLabel(r.vehicleId),r.inspector&&('By '+r.inspector),r.odometer?fmt(num(r.odometer))+' km':'',r.result]},
  {k:'fuel',dept:'Fuel & Deliveries',what:()=>'Fuel log',d:genericDesc},
  {k:'portUpdates',dept:'Port Files',what:r=>r.delivered?'File delivered':'File update',d:r=>[r.ref,r.text,Object.entries(r.fields||{}).filter(([k,v])=>v!==''&&v!=null).map(([k,v])=>k+': '+v).join(', ')]},
  {k:'cngFills',dept:'Fuel & Deliveries',what:()=>'CNG fill-up',d:r=>[vehicleLabel(r.vehicleId),r.driverName,r.station,r.quantity?r.quantity+' SCM':'',r.cost?naira(num(r.cost)):'']},
  {k:'dieselTrips',dept:'Fuel & Deliveries',what:()=>'Diesel trip',d:r=>{ const c=dieselCalc(r); return [vehicleLabel(r.vehicleId),r.driverName,(r.loadingLocation||'?')+' → '+(r.offloadingLocation||'?'),c.lt?fmt(c.lt,0)+' L':'',c.ct?naira(c.ct):'',c.dist?fmt(c.dist)+' km':'']; }},
];
function dailyEntries(date){
  const out=[];
  DAILY_SRC.forEach(s=>(STATE.data[s.k]||[]).forEach(r=>{ if(r.date!==date) return; const at=enteredAt(r.id); out.push({dept:s.dept,what:s.what(r),desc:s.d(r).filter(Boolean),at,src:s.k,id:r.id,date}); }));
  out.sort((a,b)=>(a.at?a.at.getTime():0)-(b.at?b.at.getTime():0));
  return out;
}
function dayName(s){ const d=new Date(s+'T00:00:00'); return d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short',year:'numeric'}); }
function yesterdayBanner(){

    <button class="btn small" data-goto="daily">See what was entered →</button></div></div>`;
}

/* ---------- service baseline ---------- */
function nearestReading(pts,date){
  let best=null,bd=1e9; pts.forEach(p=>{ const d=Math.abs(daysBetween(p.date,date)); if(d<bd||(d===bd&&best&&p.odo>best.odo)){ bd=d; best=p; } });
  return best&&bd<=21?best.odo:0;
}
const SERVICE_WORDS=/\b(full |routine |general |major |minor |scheduled |pm )?servic(e|ed|ing)\b|oil change|\bpms\b/i;
/* Keeps every truck's last-service date / odometer in step with the log, and the registry odometer in step with the newest reading.
   Runs on load, on every save and on every screen refresh, so the Overdue / Due Soon status can never lag behind what was logged. */
function reconcileServices(){
  let changed=false;
  (STATE.data.vehicles||[]).forEach(v=>{
    const pts=odoPoints(v);
    const evs=(STATE.data.maintenance||[]).filter(r=>r.vehicleId===v.id&&r.type==='Scheduled'&&r.status!=='Open'&&r.date);
    evs.forEach(r=>{ if(num(r.odometer)>0) pts.push({date:r.date,odo:num(r.odometer)}); });
    pts.sort(dateSort);
    if(pts.length){
      const top=pts.reduce((m,p)=>p.odo>m?p.odo:m,0);
      if(top>num(v.currentOdometer) && top-num(v.currentOdometer)<=30000){ v.currentOdometer=String(top); changed=true; }
    }
    if(evs.length){
      const last=evs.reduce((m,r)=>r.date>m.date?r:m);
      if(!v.lastServiceDate || last.date>v.lastServiceDate){
        let odo=num(last.odometer)||nearestReading(pts,last.date);
        if(!odo||odo<num(v.lastServiceOdometer)) odo=num(v.currentOdometer);       // no usable reading: assume serviced at the current reading
        v.lastServiceDate=last.date; v.lastServiceOdometer=String(odo); changed=true;
      }
      // an odometer typed on any logged service also moves the km baseline forward (odometers only go up)
      const topExp=Math.max(0,...evs.map(r=>num(r.odometer)));
      if(topExp>num(v.lastServiceOdometer) && topExp<=num(v.currentOdometer)){ v.lastServiceOdometer=String(topExp); changed=true; }
    }
  });
  return changed;
}

function maintenanceStatusForVehicle(v){
  const kmRemaining = num(v.serviceIntervalKm) - (num(v.currentOdometer) - num(v.lastServiceOdometer));
  let daysRemaining = null;
  if(v.lastServiceDate && v.serviceIntervalDays){
    const last = new Date(v.lastServiceDate+'T00:00:00');
    const due = new Date(last.getTime() + num(v.serviceIntervalDays)*86400000);
    daysRemaining = Math.round((due - new Date())/86400000);
  }
  let status='green', reason='Within service interval', hint='';
  const kmCritical = kmRemaining<=0, kmWarn = kmRemaining>0 && kmRemaining<500;
  const dayCritical = daysRemaining!==null && daysRemaining<=0, dayWarn = daysRemaining!==null && daysRemaining>0 && daysRemaining<=7;
  if(kmCritical || dayCritical){ status='red'; reason = kmCritical? 'Service overdue by '+fmt(Math.abs(kmRemaining))+' km' : 'Service overdue by '+Math.abs(daysRemaining)+' days'; if(kmCritical&&dayCritical) reason+=' and '+Math.abs(daysRemaining)+' days'; }
  else if(kmWarn || dayWarn){ status='amber'; reason = kmWarn? fmt(kmRemaining)+' km until service due' : daysRemaining+' days until service due'; }
  if(status!=='green'){
    const base=v.lastServiceDate||'';
    const mt=STATE.data.maintenance||[];
    const open=mt.filter(r=>r.vehicleId===v.id&&r.type==='Scheduled'&&r.status==='Open'&&r.date>=base).sort((a,b)=>a.date<b.date?1:-1)[0];
    if(open){ status='amber'; reason='Service in progress since '+fmtDate(open.date)+' — mark the job complete when it is finished'; }
    else {
      const misfiled=mt.filter(r=>r.vehicleId===v.id&&isBd(r)&&r.date>base&&SERVICE_WORDS.test([r.notes,r.otherDetail,r.parts].filter(Boolean).join(' '))).sort((a,b)=>a.date<b.date?1:-1)[0];
      if(misfiled) hint='A “service” was logged as a repair on '+fmtDate(misfiled.date)+' — edit that entry and set the type to Scheduled service.';
    }
  }
  return {status, reason, hint, kmRemaining, daysRemaining};
}

function parseBulkWorkbook(wb){
  const ws=wb.Sheets['Transport Entries']||wb.Sheets[wb.SheetNames[0]]; if(!ws) return {rows:[],err:'No sheet found in that file.'};
  const grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  let hi=grid.findIndex((r,i)=>i<12&&r.map(hdrKey).includes('date')&&r.map(hdrKey).includes('truck'));
  if(hi<0) return {rows:[],err:'Could not find the column headings (Date, Truck Reg No, Driver Name …). Please use the FleetDesk template and do not rename the headings.'};
  const cols={}; grid[hi].forEach((h,i)=>{ const k=hdrKey(h); if(k&&cols[k]===undefined) cols[k]=i; });
  const vmap={}; (STATE.data.vehicles||[]).forEach(v=>{ vmap[normKey(v.regNo)]=v; });
  const ex={}; (STATE.data.transport||[]).forEach(r=>{ ex[[r.date,r.vehicleId,r.route].join('|')]=r.id; });
  const seen={}; const rows=[];
  for(let i=hi+1;i<grid.length;i++){
    const g=k=>cols[k]===undefined?'':grid[i][cols[k]];
    const driver=String(g('driver')||'').trim(), routeTxt=String(g('route')||'').trim(), truckTxt=String(g('truck')||'').trim();
    const nums=['tripsTarget','tripsActual','tonnageTarget','tonnageActual','turnaroundTarget','turnaroundActual','transitTarget','transitActual'];
    const hasData=driver||routeTxt||g('tripsActual')!==''||g('tonnageActual')!==''||g('tonnageTarget')!==''||g('turnaroundActual')!==''||g('transitActual')!=='';
    if(!hasData) continue;                                     // truck listed but did not run: ignore
    const r={line:i+1,date:xlDate(g('date')),truckTxt,driver,routeTxt,errs:[],warns:[]};
    const v=vmap[normKey(truckTxt)]; r.vehicleId=v?v.id:''; r.regNo=v?v.regNo:truckTxt;
    r.route=matchRoute(routeTxt);
    r.material=String(g('material')||'').trim();
    nums.forEach(k=>{ const raw=g(k); if(raw===''||raw===null) { r[k]=''; return; } const n=parseFloat(String(raw).replace(/,/g,'')); if(isNaN(n)||n<0){ r.errs.push('“'+raw+'” is not a valid number for '+k.replace(/([A-Z])/g,' $1').toLowerCase()); r[k]=''; } else r[k]=n; });
    if(!r.date) r.errs.push('Date missing or not recognised');
    if(!truckTxt) r.errs.push('Truck Reg No missing'); else if(!v) r.errs.push('Truck “'+truckTxt+'” is not in the registry');
    if(!driver) r.errs.push('Driver Name missing');
    if(!routeTxt) r.errs.push('Route missing'); else if(!r.route) r.errs.push('Route “'+routeTxt+'” not recognised — pick it from the drop-down');
    if(r.tripsActual==='') r.errs.push('Trips Actual missing');
    const rt=ROUTES[r.route];
    if(rt){                                                    // same auto-fill as the Transport Ops form
      if(!r.material&&rt.material) r.material=rt.material;
      if(r.tripsTarget===''&&rt.tripsPerDayTarget) r.tripsTarget=rt.tripsPerDayTarget;
      if(r.turnaroundTarget===''&&rt.durationTargetHrs!==null&&rt.durationTargetHrs!==undefined) r.turnaroundTarget=rt.durationTargetHrs;
      if(r.tonnageTarget===''&&r.tripsTarget!==''&&num(STATE.targets.tonnagePerTripTarget)>0) r.tonnageTarget=num(r.tripsTarget)*num(STATE.targets.tonnagePerTripTarget);
    }
    if(!r.errs.length){
      const key=[r.date,r.vehicleId,r.route].join('|');
      if(seen[key]){ r.errs.push('Same date + truck + route appears twice in the file (line '+seen[key]+')'); }
      else { seen[key]=r.line; if(ex[key]){ r.dupId=ex[key]; r.warns.push('Already in Transport Ops'); } }
    }
    r.state=r.errs.length?'error':(r.dupId?'dup':'ok'); rows.push(r);
  }
  return {rows,err:rows.length?'':'The template has no filled-in rows. Fill in the driver, route, trips and tonnage for each truck that ran.'};
}
async function handleBulkFile(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ alert('The spreadsheet reader could not be loaded. Check your internet connection and reload the page.'); return; }
  try{
    const buf=file.arrayBuffer?await file.arrayBuffer():await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsArrayBuffer(file); });
    const wb=XLSX.read(buf,{type:'array'}); const out=parseBulkWorkbook(wb);

  }catch(e){ console.error(e); STATE.bulk={file:file.name,rows:[],err:'Could not read that file: '+(e&&e.message?e.message:e),replace:false}; render(); }
}

/* =================== v8: Fuel & Deliveries rebuilt — CNG fill-ups vs trips, and diesel trip fuel =================== */

/* ---------- shared ---------- */
function monDay(s){ return fmtDay(s); }
function wkText(start){ return fmtDay(start)+' – '+fmtDate(addDays(start,6)); }
function fuelWeekStart(){ return STATE.fuelWk||addDays(wkStart(todayStr()),-7); }
function fuelWeekOptions(sel){
  const cur=wkStart(todayStr()); const out=[]; for(let i=0;i<30;i++) out.push(addDays(cur,-7*i));
  if(sel&&out.indexOf(sel)<0) out.push(sel); return out;
}
function latestOdo(vid){
  const v=findVehicle(vid); if(!v) return 0; const pts=odoPoints(v); let top=num(v.currentOdometer);
  pts.forEach(p=>{ if(p.odo>top) top=p.odo; }); return top;
}
function datalistOf(id,arr){ return `<datalist id="${id}">${arr.map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>`; }
function uniqVals(arr,key){ const s={}; arr.forEach(r=>{ const v=String(r[key]||'').trim(); if(v&&!s[v.toLowerCase()]) s[v.toLowerCase()]=v; }); return Object.values(s).sort(); }

/* ---------- CNG: allowance rule + weekly calculation ----------
   One fill-up covers EITHER 2 clinker/gypsum trips, OR 5 Adumbu trips + 1 clinker/gypsum trip.
   => a clinker/gypsum trip uses 1/2 of a fill-up, an Adumbu trip uses (1 − 1/2) / 5 = 1/10.                         */
function cngWeights(){
  let L=num(STATE.targets.cngLongTripsPerFill), A=num(STATE.targets.cngAdumbuTripsPerFill); if(!(L>=1)) L=2; if(!(A>=1)) A=5;
  const wl=1/L, wa=Math.max(0,(1-wl)/A); return {L,A,wl,wa};
}
function tripKind(route){ return route==='gypsum_adumbu'?'adumbu':((!route||route==='other')?'other':'long'); }
function cngWeek(start,endOpt){
  const end=endOpt||addDays(start,6), W=cngWeights(), inW=d=>!!d&&d>=start&&d<=end;
  const trips=(STATE.data.transport||[]).filter(r=>inW(r.date)), fills=(STATE.data.cngFills||[]).filter(r=>inW(r.date)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const T={}; const get=vid=>T[vid]||(T[vid]={vid,regNo:vehicleLabel(vid),long:0,adum:0,other:0,ton:0,fills:0,qty:0,cost:0,entries:[]});
  let unassigned=0, unassignedTrips=0;
  trips.forEach(r=>{ if(!r.vehicleId){ unassigned++; unassignedTrips+=num(r.tripsActual); return; } const t=get(r.vehicleId); const n=num(r.tripsActual), k=tripKind(r.route); if(k==='long') t.long+=n; else if(k==='adumbu') t.adum+=n; else t.other+=n; t.ton+=num(r.tonnageActual); t.entries.push(r); });
  fills.forEach(r=>{ if(!r.vehicleId) return; const t=get(r.vehicleId); t.fills++; t.qty+=num(r.quantity); t.cost+=num(r.cost); });
  const byMat={}, byRoute={}; let unallocated=0;
  const rows=Object.values(T).map(t=>{
    t.trips=t.long+t.adum+t.other; t.units=(t.long+t.other)*W.wl+t.adum*W.wa; t.expected=Math.round(t.units*10)/10; t.diff=t.fills-t.units;
    t.cpt=t.trips?t.cost/t.trips:null; t.cpm=t.ton?t.cost/t.ton:null; t.qpt=t.trips?t.qty/t.trips:null;
    t.avgFill=t.fills?t.cost/t.fills:0; t.extra=t.diff>0.25?t.diff*t.avgFill:0;
    if(!t.fills&&t.trips) t.status={tag:'red',text:'No fill-up logged'};
    else if(t.fills&&!t.trips) t.status={tag:'amber',text:'Fill-up but no trips logged'};
    else if(t.diff>0.75) t.status={tag:'red',text:'Over allowance by '+fmt(t.diff,1)};
    else if(t.diff>0.25) t.status={tag:'amber',text:'Slightly over'};
    else if(t.diff<-0.75) t.status={tag:'amber',text:'Fewer fill-ups than trips need — check'};
    else t.status={tag:'green',text:'Within allowance'};
    const per=t.units>0?t.cost/t.units:0; if(t.units<=0) unallocated+=t.cost;
    t.entries.forEach(r=>{ const n=num(r.tripsActual), u=n*(tripKind(r.route)==='adumbu'?W.wa:W.wl), c=u*per;
      const mk=matKey(r.material)||'—', mn=r.material?String(r.material).trim():'Unspecified', rk=r.route||'none';
      const m=byMat[mk]||(byMat[mk]={name:mn,trips:0,ton:0,units:0,cost:0}); m.trips+=n; m.ton+=num(r.tonnageActual); m.units+=u; m.cost+=c;
      const q=byRoute[rk]||(byRoute[rk]={name:rk==='none'?'Unassigned route':(ROUTES[rk]?ROUTES[rk].label:rk),kind:tripKind(r.route),trips:0,ton:0,units:0,cost:0}); q.trips+=n; q.ton+=num(r.tonnageActual); q.units+=u; q.cost+=c; });
    return t;
  }).sort((a,b)=>b.cost-a.cost||b.trips-a.trips||String(a.regNo).localeCompare(String(b.regNo)));
  const tot=rows.reduce((a,t)=>{ a.trips+=t.trips; a.long+=t.long; a.adum+=t.adum; a.other+=t.other; a.ton+=t.ton; a.fills+=t.fills; a.qty+=t.qty; a.cost+=t.cost; a.expected+=t.units; a.extra+=t.extra; if(t.diff>0.75) a.over++; return a; },{trips:0,long:0,adum:0,other:0,ton:0,fills:0,qty:0,cost:0,expected:0,extra:0,over:0});
  tot.diff=tot.fills-tot.expected; tot.cpt=tot.trips?tot.cost/tot.trips:null; tot.cpm=tot.ton?tot.cost/tot.ton:null; tot.qpt=tot.trips?tot.qty/tot.trips:null;

}

/* ---------- Diesel: per-trip maths + weekly calculation ---------- */
function dieselCalc(r){
  const o0=num(r.odoBefore), o1=num(r.odoAdditional), o2=num(r.odoOffload);
  const l1=num(r.litresReceived), l2=num(r.litresAdditional), c1=num(r.costReceived), c2=num(r.costAdditional);
  const dist=(o0>0&&o2>o0)?o2-o0:0, lt=l1+l2, ct=c1+c2;
  return {dist,l1,l2,c1,c2,lt,ct,kmL:lt>0&&dist>0?dist/lt:null,costKm:dist>0?ct/dist:null,
    kmToTopup:(l2>0&&o1>o0&&o0>0)?o1-o0:null, kmAfterTopup:(l2>0&&o2>o1&&o1>0)?o2-o1:null};
}
function dieselValidate(r){
  const o0=num(r.odoBefore), o1=num(r.odoAdditional), o2=num(r.odoOffload), l2=num(r.litresAdditional);
  if(!r.vehicleId) return 'Please choose the truck.';
  if(!(o0>0)) return 'Enter the odometer before the trip.';
  if(!(o2>0)) return 'Enter the odometer at the offloading location.';
  if(o2<=o0) return 'The odometer at offloading ('+fmt(o2)+') must be higher than the odometer before the trip ('+fmt(o0)+').';
  if(l2>0){
    if(!(o1>0)) return 'You entered additional diesel — please enter the odometer where it was collected.';
    if(o1<o0||o1>o2) return 'The odometer where the additional diesel was collected ('+fmt(o1)+') must be between the start ('+fmt(o0)+') and the offloading odometer ('+fmt(o2)+').';
  }
  return '';
}
function dieselWeek(start,endOpt){
  const end=endOpt||addDays(start,6), inW=d=>!!d&&d>=start&&d<=end;
  const trips=(STATE.data.dieselTrips||[]).filter(r=>inW(r.date)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const T={}; trips.forEach(r=>{ const c=dieselCalc(r); const k=r.vehicleId||'none'; const t=T[k]||(T[k]={vid:r.vehicleId,regNo:r.vehicleId?vehicleLabel(r.vehicleId):'—',trips:0,dist:0,l1:0,l2:0,lt:0,ct:0,c1:0,c2:0,topups:0,valid:0});
    t.trips++; t.l1+=c.l1; t.l2+=c.l2; t.c1+=c.c1; t.c2+=c.c2; t.lt+=c.lt; t.ct+=c.ct; if(c.l2>0) t.topups++; if(c.dist>0){ t.dist+=c.dist; if(c.lt>0) t.valid+=c.dist; } t.kmLDist=(t.kmLDist||0)+(c.dist>0&&c.lt>0?c.dist:0); t.kmLLit=(t.kmLLit||0)+(c.dist>0&&c.lt>0?c.lt:0); });
  const rows=Object.values(T).map(t=>{ t.kmL=t.kmLLit>0?t.kmLDist/t.kmLLit:null; t.costKm=t.dist>0?t.ct/t.dist:null; return t; });
  const med=median(rows.map(t=>t.kmL).filter(x=>x!==null&&x>0));

  rows.sort((a,b)=>b.ct-a.ct||b.trips-a.trips);
  const tot=rows.reduce((a,t)=>{ a.trips+=t.trips; a.dist+=t.dist; a.l1+=t.l1; a.l2+=t.l2; a.lt+=t.lt; a.c1+=t.c1; a.c2+=t.c2; a.ct+=t.ct; a.topups+=t.topups; a.kmLDist+=t.kmLDist||0; a.kmLLit+=t.kmLLit||0; return a; },{trips:0,dist:0,l1:0,l2:0,lt:0,c1:0,c2:0,ct:0,topups:0,kmLDist:0,kmLLit:0});
  tot.kmL=tot.kmLLit>0?tot.kmLDist/tot.kmLLit:null; tot.costKm=tot.dist>0?tot.ct/tot.dist:null;
  return {start,end,trips,rows,tot,med};
}

function downloadCngTemplate(start){

  if(!vs.length){ alert('Register your trucks first (Maintenance tab → Add a vehicle) so they can be listed in the sheet.'); return; }
  try{ triggerDownload(buildCngXlsx(start,vs,cngWeek(start)),'FleetDesk_CNG_Weekly_'+start+'.xlsx'); }
  catch(e){ console.error(e); alert('Could not build the sheet: '+(e&&e.message?e.message:e)); }
}
function parseCngWorkbook(wb){
  const ws=wb.Sheets['CNG Fill-ups']||wb.Sheets[wb.SheetNames[0]]; if(!ws) return {rows:[],err:'No sheet found in that file.'};
  const grid=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const hi=grid.findIndex((r,i)=>i<12&&r.map(cngHdrKey).includes('date')&&r.map(cngHdrKey).includes('truck')&&r.map(cngHdrKey).includes('quantity'));
  if(hi<0) return {rows:[],err:'Could not find the column headings (Fill Date, Truck Reg No, Quantity …). Please use the FleetDesk CNG sheet and do not rename the headings.'};
  const cols={}; grid[hi].forEach((h,i)=>{ const k=cngHdrKey(h); if(k&&cols[k]===undefined) cols[k]=i; });
  const vmap={}; (STATE.data.vehicles||[]).forEach(v=>{ vmap[normKey(v.regNo)]=v; });
  const ex={}; (STATE.data.cngFills||[]).forEach(r=>{ ex[[r.date,r.vehicleId,num(r.quantity),num(r.cost)].join('|')]=r.id; });
  const rows=[]; const seen={};
  for(let i=hi+1;i<grid.length;i++){
    const g=k=>cols[k]===undefined?'':grid[i][cols[k]];
    const qtyRaw=g('quantity'), costRaw=g('cost'), truckTxt=String(g('truck')||'').trim();
    if((qtyRaw===''||qtyRaw===null)&&(costRaw===''||costRaw===null)) continue;      // truck listed but no fill-up
    const r={line:i+1,date:xlDate(g('date')),truckTxt,driver:String(g('driver')||'').trim(),station:String(g('station')||'').trim(),notes:String(g('notes')||'').trim(),errs:[]};
    const v=vmap[normKey(truckTxt)]; r.vehicleId=v?v.id:''; r.regNo=v?v.regNo:truckTxt;
    const q=parseFloat(String(qtyRaw).replace(/,/g,'')), c=costRaw===''?0:parseFloat(String(costRaw).replace(/,/g,'')), od=g('odometer')===''?'':parseFloat(String(g('odometer')).replace(/,/g,''));
    r.quantity=q; r.cost=c; r.odometer=(od===''||isNaN(od))?'':od;
    if(!r.date) r.errs.push('Fill date missing or not recognised');
    if(!truckTxt) r.errs.push('Truck Reg No missing'); else if(!v) r.errs.push('Truck “'+truckTxt+'” is not in the registry');
    if(isNaN(q)||q<=0) r.errs.push('Quantity (SCM) must be a number above 0');
    if(isNaN(c)||c<0){ r.errs.push('Total cost is not a valid number'); }
    if(!r.errs.length){ const key=[r.date,r.vehicleId,q,c].join('|'); if(ex[key]) r.dupId=ex[key]; if(seen[key]) r.errs.push('Same date, truck, quantity and cost appears twice (row '+seen[key]+')'); else seen[key]=r.line; }
    if(!r.errs.length&&!c) r.warn='No cost entered';
    r.state=r.errs.length?'error':(r.dupId?'dup':'ok'); rows.push(r);
  }
  return {rows,err:rows.length?'':'The sheet has no fill-ups entered. Fill in Quantity (SCM) and Total Cost for each truck that filled.'};
}
async function handleCngFile(file){
  if(!file) return;
  if(typeof XLSX==='undefined'){ alert('The spreadsheet reader could not be loaded. Check your internet connection and reload the page.'); return; }
  try{
    const buf=file.arrayBuffer?await file.arrayBuffer():await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsArrayBuffer(file); });
    const out=parseCngWorkbook(XLSX.read(buf,{type:'array'})); STATE.cngBulk={file:file.name,rows:out.rows,err:out.err}; render();
  }catch(e){ console.error(e); STATE.cngBulk={file:file.name,rows:[],err:'Could not read that file: '+(e&&e.message?e.message:e)}; render(); }
}

async function importCng(){
  const b=STATE.cngBulk; if(!b) return; const add=[];
  b.rows.forEach(r=>{ if(r.state!=='ok') return; const rec={id:uid(),date:r.date,vehicleId:r.vehicleId,driverName:r.driver,station:r.station,quantity:String(r.quantity),cost:r.cost?String(r.cost):'',odometer:r.odometer===''?'':String(r.odometer),notes:r.notes}; compactRec(rec); add.push(rec); });

function dieselHintHTML(f){
  const rec={}; new FormData(f).forEach((v,k)=>{ rec[k]=v; }); const c=dieselCalc(rec);

}
function fuelCsv(start){
  const L=[]; const row=a=>L.push(a.map(csvCell).join(','));
  if((STATE.fuelView||'cng')==='diesel'){
    const A=dieselWeek(start); row(['FleetDesk — Diesel trips','Week',start+' to '+addDays(start,6)]); row([]);
    row(['Date','Truck','Driver','Loading','Offloading','Received before departure (L)','Cost (₦)','Additional (L)','Additional cost (₦)','Odometer before','Odometer at top-up','Odometer at offloading','Distance (km)','km/L','Cost per km']);
    A.trips.forEach(r=>{ const c=dieselCalc(r); row([r.date,vehicleLabel(r.vehicleId),r.driverName||'',r.loadingLocation||'',r.offloadingLocation||'',c.l1,c.c1,c.l2,c.c2,r.odoBefore||'',r.odoAdditional||'',r.odoOffload||'',c.dist||'',c.kmL===null?'':c.kmL.toFixed(2),c.costKm===null?'':Math.round(c.costKm)]); });
  } else {
    const A=cngWeek(start); row(['FleetDesk — CNG fill-ups vs trips','Week',start+' to '+addDays(start,6)]); row([]);
    row(['Truck','Clinker/Gypsum trips','Adumbu trips','Other trips','Tonnage (MT)','Fill-ups allowed','Fill-ups logged','Difference','CNG used (SCM)','CNG cost (₦)','Cost per trip','Cost per MT','Status']);
    A.rows.forEach(t=>row([t.regNo,t.long,t.adum,t.other,t.ton,t.expected,t.fills,Math.round(t.diff*10)/10,t.qty,t.cost,t.cpt===null?'':Math.round(t.cpt),t.cpm===null?'':Math.round(t.cpm),t.status.text]));
    row([]); row(['Fill-ups']); row(['Date','Truck','Driver','Station','Quantity (SCM)','Cost (₦)','Odometer','Notes']);
    A.fills.forEach(r=>row([r.date,vehicleLabel(r.vehicleId),r.driverName||'',r.station||'',r.quantity||'',r.cost||'',r.odometer||'',r.notes||'']));
  }
  return L.join('\n');
}
function downloadFuelCsv(){

/* ---------- small helpers ---------- */
const rc = (v,tone)=>({v:String(v===undefined||v===null?'':v), tone:tone||''});
const cellText = c => (c && typeof c==='object') ? c.v : String(c===undefined||c===null?'':c);
const cellTone = c => (c && typeof c==='object') ? c.tone : '';
function isoWeekNo(start){
  const d=new Date(start+'T00:00:00'); d.setDate(d.getDate()+3);
  const jan4=new Date(d.getFullYear(),0,4); const w1=new Date(jan4); w1.setDate(jan4.getDate()-((jan4.getDay()+6)%7));
  return Math.floor(Math.round((d-w1)/864e5)/7)+1;
}
function shortRange(r){
  const a=new Date(r.start+'T00:00:00'), b=new Date(r.end+'T00:00:00');
  const mo=x=>x.toLocaleDateString(undefined,{month:'short'});
  return a.getMonth()===b.getMonth()? `${a.getDate()}–${b.getDate()} ${mo(b)}` : `${a.getDate()} ${mo(a)} – ${b.getDate()} ${mo(b)}`;
}
function monthName(start,long){ return new Date(start.slice(0,7)+'-01T00:00:00').toLocaleDateString(undefined,{month:long?'long':'short',year:'numeric'}); }
function reportRanges(kind,start){
  if(kind==='week'){ const s=wkStart(start); return {range:{start:s,end:addDays(s,6)}, prev:{start:addDays(s,-7),end:addDays(s,-1)}}; }
  const s=monthStartOf(start); const ps=addMonthsStr(s,-1);
  return {range:{start:s,end:monthEndOf(s)}, prev:{start:ps,end:monthEndOf(ps)}};
}
function periodTitle(kind,start,long){
  if(kind==='week'){ const r=reportRanges('week',start).range; return `Week ${isoWeekNo(r.start)} · ${rangeText(r)}`; }
  return monthName(start,true);
}
function periodShort(kind,start){
  if(kind==='week'){ const r=reportRanges('week',start).range; return `Wk ${isoWeekNo(r.start)} · ${shortRange(r)}`; }
  return monthName(start,false);
}
function latestPeriodStart(kind){ return kind==='week'? addDays(wkStart(todayStr()),-7) : addMonthsStr(monthStartOf(todayStr()),-1); }
function stepPeriod(kind,start,n){ return kind==='week'? addDays(start,7*n) : addMonthsStr(start,n); }
function periodList(kind,count){ const out=[]; let s=latestPeriodStart(kind); for(let i=0;i<count;i++){ out.push(s); s=stepPeriod(kind,s,-1); } return out; }

/* number formatting + change cells */
function fmtSpec(v,o){
  o=o||{}; if(v===null||v===undefined||isNaN(v)) return '—';
  if(o.money) return naira(v,o.dec||0);
  if(o.pct) return pct(v);
  return fmt(v,o.dec||0)+(o.unit?' '+o.unit:'');
}
function chg(cur,prev,good,o){
  o=o||{}; if(cur===null||cur===undefined||prev===null||prev===undefined||isNaN(cur)||isNaN(prev)) return rc('—','');
  const d=cur-prev, dec=o.pct?1:(o.dec||0), unit=o.pct?100:1;
  if(Math.abs(d*unit)<Math.pow(10,-dec)/2) return rc('no change','');
  const better=good==='lower'?d<0:good==='higher'?d>0:null;
  const tone=better===null?'':(better?'good':'bad');
  const mag=Math.abs(d)*unit;
  let txt=(d>0?'▲ +':'▼ −')+(o.money?naira(Math.abs(d),o.dec||0):fmt(mag,dec)+(o.pct?' pts':(o.unit?' '+o.unit:'')));
  if(!o.pct && prev) txt+=` (${d>0?'+':'−'}${Math.abs(Math.round(d/prev*100))}%)`;
  return rc(txt,tone);
}
function tableBlock(title,head,rows,note){ return {title,head,rows,note:note||''}; }
/* A KPI table: Target | current | previous | change | status, straight from the KPI engines. */
function kpiTableBlock(title,defsCur,defsPrev,hasCur,hasPrev,L){
  const rows=defsCur.map(([label,row],i)=>{
    const prow=defsPrev[i]?defsPrev[i][1]:null;
    const st=hasCur?statusOf(row?row.ratio:null):'grey';
    const v=reportValueStr(row), pv=prow&&hasPrev?reportValueStr(prow).a:'—';
    const o={pct:row&&row.fmt==='pct',dec:row&&row.fmt!=='pct'&&row.fmt!==undefined?row.fmt:0,unit:row&&row.unit||''};
    return [label, v.t, hasCur?v.a:'—', pv, (hasCur&&hasPrev&&row&&prow)?chg(row.actual,prow.actual,row.good||'higher',o):'—', rc(hasCur?statusLabel(st):'No data', st)];
  });
  return tableBlock(title,['KPI','Target',L.cur,L.prev,'Change','Status'],rows);
}
/* A plain "measure / current / previous / change" table. m = [label, cur, prev, good, spec] */
function compareBlock(title,measures,L,note){
  return tableBlock(title,['Measure',L.cur,L.prev,'Change'],measures.map(([label,cur,prev,good,o])=>[label,fmtSpec(cur,o),fmtSpec(prev,o),chg(cur,prev,good,o)]),note);
}

/* ---------- data for a period ---------- */
function repFiltered(r){
  const D=STATE.data, f=a=>filterRange(a,r.start,r.end);
  return {transport:f(D.transport),journey:f(D.journey),inspections:f(D.inspections),pretrip:f(D.pretrip),safety:f(D.safety),
          maintenance:f(D.maintenance),maintenanceDaily:f(D.maintenanceDaily),maintInspections:f(D.maintInspections||[]),
          cng:f(D.cngFills||[]),diesel:f(D.dieselTrips||[])};
}
function deptHasData(key,r){
  const F=repFiltered(r);
  switch(key){
    case 'transport': return F.transport.length>0;
    case 'journey': return F.journey.length>0;
    case 'inspections': return F.inspections.length+F.pretrip.length+F.maintInspections.length>0;
    case 'safety': return F.safety.length>0 || hsseWeeksIn(r).length>0;
    case 'maintenance': return F.maintenance.length+F.maintenanceDaily.length+F.maintInspections.length>0;
    case 'fuel': return F.cng.length+F.diesel.length+filterRange(STATE.data.fuel||[],r.start,r.end).length>0;
    case 'port': return portHasData(r);
  }
  return false;
}
function hsseWeeksIn(r){ return ((STATE.data.hsseScores||{}).weeks||[]).filter(w=>w.start&&w.start>=r.start&&w.start<=r.end); }
function hsseRangeNums(r){
  const ws=hsseWeeksIn(r); if(!ws.length) return null;
  const nums=ws.map(hsseWeekNums); const sum=k=>nums.reduce((a,x)=>a+(x[k]||0),0);
  const vs=k=>nums.reduce((a,x)=>a+((x.v||{})[k]||0),0);
  return {weeks:ws.length, avg:nums.reduce((a,x)=>a+x.avg,0)/nums.length, RED:sum('RED'), AMBER:sum('AMBER'), GREEN:sum('GREEN'), viol:sum('viol'), HB:vs('HB'), HA:vs('HA'), OS:vs('OS'), HOS:vs('HOS')};
}
function hsseLogRange(r){
  const raw=STATE.data.hsseLogs||{}; const inR=iso=>!!iso&&iso>=r.start&&iso<=r.end; const insp=(raw.inspections||[]).filter(x=>inR(x.iso));
  const has=(raw.incidents||[]).length+(raw.inspections||[]).length+(raw.toolbox||[]).length>0; if(!has) return null;
  return {incidents:(raw.incidents||[]).filter(i=>inR(i.iso)).length, inspGaps:insp.filter(x=>inspectionIssues(x).length).length, toolbox:(raw.toolbox||[]).filter(x=>inR(x.iso)).length, ppeFail:(raw.ppe||[]).filter(x=>inR(parseLooseDate(x.period))&&/fail|non|^no/i.test(x.status)).length};
}
function groupSum(recs,keyFn,fields){
  const m={}; recs.forEach(r=>{ const k=keyFn(r); if(k===undefined||k===null) return; const g=m[k]||(m[k]=Object.assign({key:k,n:0},...fields.map(f=>({[f]:0})))); g.n++; fields.forEach(f=>{ g[f]+=num(r[f]); }); }); return m;
}

/* ---------- department builders: each returns {blocks, headline, hasData, commentary} ---------- */
function repTransport(r,p,L,recs){
  const F=repFiltered(r), G=repFiltered(p), hasCur=F.transport.length>0, hasPrev=G.transport.length>0;
  const blocks=[kpiTableBlock('Transport KPIs',REPORT_ROW_DEFS.transport(kpisTransport(F.transport)),REPORT_ROW_DEFS.transport(kpisTransport(G.transport)),hasCur,hasPrev,L)];
  const byTruck=(recs)=>groupSum(recs,x=>trKey(x)||null,['tripsActual','tonnageActual']);
  const A=byTruck(F.transport), B=byTruck(G.transport);
  const ids=[...new Set([...Object.keys(A),...Object.keys(B)])].sort((x,y)=>((A[y]||{}).tonnageActual||0)-((A[x]||{}).tonnageActual||0)).slice(0,10);
  if(ids.length) blocks.push(tableBlock('Trucks — trips and tonnage (top 10 by tonnage)',['Truck','Trips',`Trips (${L.prevShort})`,'Tonnage (MT)',`Tonnage (${L.prevShort})`,'Change'],
    ids.map(id=>{ const a=A[id]||{tripsActual:0,tonnageActual:0}, b=B[id]||{tripsActual:0,tonnageActual:0}; return [trKeyLabel(id),fmt(a.tripsActual),fmt(b.tripsActual),fmt(a.tonnageActual,1),fmt(b.tonnageActual,1),chg(a.tonnageActual,b.tonnageActual,'higher',{dec:1})]; })));
  const rt=(recs)=>groupSum(recs,x=>x.route||'other',['tripsActual','tonnageActual']);
  const RA=rt(F.transport), RB=rt(G.transport); const rk=[...new Set([...Object.keys(RA),...Object.keys(RB)])];
  if(rk.length) blocks.push(tableBlock('Routes — trips and tonnage',['Route','Trips',`Trips (${L.prevShort})`,'Tonnage (MT)',`Tonnage (${L.prevShort})`,'Change'],
    rk.map(k=>{ const a=RA[k]||{tripsActual:0,tonnageActual:0}, b=RB[k]||{tripsActual:0,tonnageActual:0}; return [ROUTES[k]?ROUTES[k].label:k,fmt(a.tripsActual),fmt(b.tripsActual),fmt(a.tonnageActual,1),fmt(b.tonnageActual,1),chg(a.tonnageActual,b.tonnageActual,'higher',{dec:1})]; })));
  const trips=sumBy(F.transport,'tripsActual'), ton=sumBy(F.transport,'tonnageActual');
  return {blocks,hasData:hasCur,headline:hasCur?`${fmt(trips)} trips · ${fmt(ton)} MT`:'No entries'};
}
function repJourney(r,p,L){
  const F=repFiltered(r), G=repFiltered(p), hasCur=F.journey.length>0, hasPrev=G.journey.length>0;
  const kc_=kpisJourneyOverall(F.journey,r), kp_=kpisJourneyOverall(G.journey,p);

function repInspections(r,p,L){
  const F=repFiltered(r), G=repFiltered(p), hasCur=F.inspections.length>0, hasPrev=G.inspections.length>0;
  const blocks=[kpiTableBlock('Inspection KPIs',REPORT_ROW_DEFS.inspections(kpisInspections(F.inspections)),REPORT_ROW_DEFS.inspections(kpisInspections(G.inspections)),hasCur,hasPrev,L)];
  const pc=kpisPrePost(F.pretrip), pp=kpisPrePost(G.pretrip); const g=(a,k)=>a.find(x=>x.key===k);
  const defsC=[['Pre-trip pass rate',g(pc,'pre')],['Post-trip pass rate',g(pc,'post')],['Pre-trip checks logged',g(pc,'prechecks')],['Post-trip checks logged',g(pc,'postchecks')]];
  const defsP=[['',g(pp,'pre')],['',g(pp,'post')],['',g(pp,'prechecks')],['',g(pp,'postchecks')]];
  blocks.push(kpiTableBlock('Driver pre-trip / post-trip checks',defsC,defsP,F.pretrip.length>0,G.pretrip.length>0,L));
  const mi=(a)=>({n:a.length,trucks:new Set(a.map(x=>x.vehicleId)).size,def:a.filter(x=>x.outcome==='Pass with defects').length,fail:a.filter(x=>x.outcome==='Fail').length});
  const a=mi(F.maintInspections), b=mi(G.maintInspections);
  blocks.push(compareBlock('Maintenance inspections (mechanics)',[['Inspections done',a.n,b.n,'higher'],['Trucks inspected',a.trucks,b.trucks,'higher'],['Passed with defects',a.def,b.def,'lower'],['Failed',a.fail,b.fail,'lower']],L));
  const done=sumBy(F.inspections,'vehiclesInspected'), due=sumBy(F.inspections,'vehiclesDue');
  return {blocks,hasData:hasCur||F.pretrip.length>0||a.n>0,headline:(hasCur||a.n)?`${fmt(done)} of ${fmt(due)} vehicles inspected${a.n?' · '+a.n+' mechanic inspections':''}`:'No entries'};

function repSafety(r,p,L){
  const F=repFiltered(r), G=repFiltered(p), hasCur=F.safety.length>0, hasPrev=G.safety.length>0;
  const blocks=[kpiTableBlock('Safety KPIs',REPORT_ROW_DEFS.safety(kpisSafety(F.safety,r)),REPORT_ROW_DEFS.safety(kpisSafety(G.safety,p)),hasCur,hasPrev,L)];
  const hc=hsseRangeNums(r), hp=hsseRangeNums(p);
  if(hc){
    const q=hp||{}; blocks.push(compareBlock('Driver telematics scorecard (HSSE report)',[
      ['Scorecard weeks in period',hc.weeks,hp?hp.weeks:null,null],['Fleet average score (lower is safer)',hc.avg,hp?hp.avg:null,'lower',{dec:2}],
      ['RED driver-weeks (score ≥ 5.0)',hc.RED,q.RED,'lower'],['AMBER driver-weeks',hc.AMBER,q.AMBER,'lower'],['GREEN driver-weeks',hc.GREEN,q.GREEN,'higher'],
      ['Drivers with a violation',hc.viol,q.viol,'lower'],['Harsh braking flags',hc.HB,q.HB,'lower'],['Harsh acceleration flags',hc.HA,q.HA,'lower'],['Over-speeding flags',hc.OS,q.OS,'lower'],['Hours-of-service flags',hc.HOS,q.HOS,'lower']],L,
      hp?'':'No scorecard was uploaded for the previous period, so there is nothing to compare with.'));

function reportStandaloneHTML(pkg,by){

function triggerBlob(content,type,name){ triggerDownload(new Blob([content],{type}),name); }
function downloadReport(pkg,fmtKey,by){
  if(fmtKey==='md'){ triggerBlob(reportMarkdown(pkg,by),'text/markdown',reportFileName(pkg,'md')); }
  else if(fmtKey==='doc'){ triggerBlob('﻿'+reportStandaloneHTML(pkg,by),'application/msword',reportFileName(pkg,'doc')); }
  else if(fmtKey==='xlsx'){
    if(!window.XLSX){ showToast('The Excel library has not loaded (check your connection). Use Word or Print instead.'); return; }
    const wb=XLSX.utils.book_new(); const used={};
    const sheet=(name,aoa,widths)=>{ let n=name.replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,28)||'Sheet'; let i=1,base=n; while(used[n]){ n=base.slice(0,26)+' '+(++i); } used[n]=1; const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=(widths||[]).map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,ws,n); };
    const head=[[reportTitle(pkg)],['Period',periodTitle(pkg.kind,pkg.start)],['Compared with',periodTitle(pkg.kind,pkg.kind==='week'?addDays(pkg.start,-7):addMonthsStr(pkg.start,-1))],['Generated',pkg.generated.toLocaleString()],['Prepared by',by||'—'],[]];
    if(!pkg.single){
      const sum=head.concat([['Measure',pkg.L.cur,pkg.L.prev,'Change']]);
      pkg.tiles.forEach(t=>sum.push([t.label,t.has?fmtSpec(t.cur,t.o):'—',t.has&&t.prev!==null?fmtSpec(t.prev,t.o):'—',t.has&&t.cur!==null?chg(t.cur,t.prev,t.good,t.o).v:'—']));
      sum.push([],['Critical items',pkg.red],['Watch items',pkg.amber],[],['What changed']); pkg.changes.forEach(c=>sum.push([c.text.replace(/<[^>]+>/g,'')]));
      sum.push([],['Needs attention']); pkg.recs.filter(x=>x.severity!=='green').slice(0,12).forEach(x=>sum.push([x.dept,x.text]));
      sheet('Summary',sum,[34,22,22,26]);
    }
    pkg.depts.forEach(d=>{
      const aoa=pkg.single?head.slice():[]; aoa.push([d.title],[]);
      d.blocks.forEach(b=>{ if(b.title) aoa.push([b.title]); aoa.push(b.head); b.rows.forEach(r=>aoa.push(r.map(cellText))); aoa.push([]); });
      aoa.push(['Commentary',d.comment.length?d.comment.join(' '):'No exceptions — performance within target.']);
      sheet(d.short,aoa,[36,20,20,20,24,20]);
    });
    XLSX.writeFile(wb,reportFileName(pkg,'xlsx'));
  }
  showToast('Report downloaded.');
}
function printReport(pkg,by){
  let root=document.getElementById('print-root'); if(!root){ root=document.createElement('div'); root.id='print-root'; document.body.appendChild(root); }
  root.innerHTML=`<style>${REPORT_PRINT_CSS}</style>`+reportDocHTML(pkg,{light:true,preparedBy:by,id:'print-doc'});
  document.body.classList.add('printing');
  const done=()=>{ document.body.classList.remove('printing'); root.innerHTML=''; window.removeEventListener('afterprint',done); };

function earliestDate(key){
  const D=STATE.data; let m='9999-99-99';
  const take=a=>(a||[]).forEach(r=>{ if(r.date&&r.date<m) m=r.date; });
  ({transport:()=>take(D.transport),journey:()=>take(D.journey),inspections:()=>{take(D.inspections);take(D.pretrip);take(D.maintInspections);},
    safety:()=>{take(D.safety);((D.hsseScores||{}).weeks||[]).forEach(w=>{ if(w.start&&w.start<m) m=w.start; });},
    maintenance:()=>{take(D.maintenance);take(D.maintenanceDaily);take(D.maintInspections);},fuel:()=>{take(D.cngFills);take(D.dieselTrips);take(D.fuel);},port:()=>take(D.portUpdates)}[key]||(()=>{}))();
  if(key==='ALL'){ ['transport','journey','inspections','safety','maintenance','fuel','port'].forEach(k=>{ const e=earliestDate(k); if(e<m) m=e; }); }
  return m;
}
function folderPeriods(key,kind){
  const first=earliestDate(key); if(first==='9999-99-99') return [];
  const out=[]; let s=latestPeriodStart(kind); const cap=kind==='week'?156:36;
  for(let i=0;i<cap;i++){
    const {range}=reportRanges(kind,s); if(range.end<first) break;
    const has=key==='ALL'?REPORT_DEPTS.some(d=>deptHasData(d[0],range)):deptHasData(key,range);
    out.push({start:s,range,has}); s=stepPeriod(kind,s,-1);
  }
  return out;
}
function deptHeadlineFor(key,range,kind){
  if(key==='ALL'){ const t=headlineTiles(range,reportRanges(kind,range.start).prev,kind); return t.filter(x=>x.has).slice(0,3).map(x=>`${fmtSpec(x.cur,x.o)} ${x.label.toLowerCase()}`).join(' · ')||'No entries'; }

  return REP_BUILDERS[key](range,{start:addDays(range.start,-1),end:addDays(range.start,-1)},{cur:'',prev:'',prevShort:''}).headline;
}

function attachReportEvents(app){
  const kindOf=el=>el.getAttribute('data-rep-kind');
  app.querySelectorAll('[data-rep-select]').forEach(el=>el.addEventListener('change',()=>{ STATE[repStateKey(el.getAttribute('data-rep-select'))]=el.value; render(); }));
  app.querySelectorAll('[data-rep-step]').forEach(el=>el.addEventListener('click',()=>{ const k=kindOf(el), n=parseInt(el.getAttribute('data-rep-step'),10); let s=stepPeriod(k,repSelected(k),n); const l=latestPeriodStart(k); if(s>l) s=l; STATE[repStateKey(k)]=s; render(); }));
  app.querySelectorAll('[data-rep-latest]').forEach(el=>el.addEventListener('click',()=>{ STATE[repStateKey(el.getAttribute('data-rep-latest'))]=null; render(); }));
  app.querySelectorAll('[data-rep-dept]').forEach(el=>el.addEventListener('change',()=>{ STATE.repDept=el.value; render(); }));
  const pb=app.querySelector('#report-prepared-by'); if(pb) pb.addEventListener('change',()=>{ STATE.reportPreparedBy=pb.value; render(); });
  const cur=(k)=>{ const d=STATE.repDept||'ALL'; return reportPackage(k,repSelected(k),d==='ALL'?null:[d]); };
  app.querySelectorAll('[data-rep-print]').forEach(el=>el.addEventListener('click',()=>printReport(cur(el.getAttribute('data-rep-print')),STATE.reportPreparedBy)));
  app.querySelectorAll('[data-rep-dl]').forEach(el=>el.addEventListener('click',()=>{ const d=el.closest('details'); if(d) d.open=false; downloadReport(cur(kindOf(el)),el.getAttribute('data-rep-dl'),STATE.reportPreparedBy); }));
  // folders
  app.querySelectorAll('[data-arch-open]').forEach(el=>el.addEventListener('click',()=>{ STATE.archDept=el.getAttribute('data-arch-open'); window.scrollTo(0,0); render(); }));
  app.querySelectorAll('[data-arch-back]').forEach(el=>el.addEventListener('click',()=>{ STATE.archDept=null; render(); }));
  app.querySelectorAll('[data-arch-kind]').forEach(el=>el.addEventListener('click',()=>{ STATE.archKind=el.getAttribute('data-arch-kind'); render(); }));
  app.querySelectorAll('[data-arch-empty]').forEach(el=>el.addEventListener('change',()=>{ STATE.archEmpty=el.checked; render(); }));
  app.querySelectorAll('[data-arch-view]').forEach(el=>el.addEventListener('click',()=>{ STATE.archView={dept:STATE.archDept||'ALL',kind:STATE.archKind||'week',start:el.getAttribute('data-arch-view')}; render(); }));
  app.querySelectorAll('[data-arch-print]').forEach(el=>el.addEventListener('click',()=>printReport(archPackage(el.getAttribute('data-arch-print')),STATE.reportPreparedBy)));
  app.querySelectorAll('[data-arch-dl]').forEach(el=>el.addEventListener('click',()=>downloadReport(archPackage(el.getAttribute('data-arch-dl')),el.getAttribute('data-fmt'),STATE.reportPreparedBy)));
  app.querySelectorAll('[data-close-arch]').forEach(el=>el.addEventListener('click',(e)=>{ if(e.target===el){ STATE.archView=null; render(); } }));
  const vp=()=>{ const v=STATE.archView; return reportPackage(v.kind,v.start,v.dept==='ALL'?null:[v.dept]); };
  app.querySelectorAll('[data-arch-modal-print]').forEach(el=>el.addEventListener('click',()=>printReport(vp(),STATE.reportPreparedBy)));
  app.querySelectorAll('[data-arch-modal-dl]').forEach(el=>el.addEventListener('click',()=>downloadReport(vp(),el.getAttribute('data-arch-modal-dl'),STATE.reportPreparedBy)));
}

      const copy=Object.assign({},r,{_client:c,updates:[]});
      ups.filter(u=>u.ref===r.fileRef).sort((a,b)=>a.date===b.date?(String(a.id)<String(b.id)?-1:1):(a.date<b.date?-1:1)).forEach(u=>{

function portStatsIn(range){
  const ups=portUpdates().filter(u=>u.date&&u.date>=range.start&&u.date<=range.end);
  const refs={}; let milestones=0; const delivered=[];

    if(u.text&&(u.date>=o.lastDate)){ o.last=u.text; o.lastDate=u.date; }
    milestones+=Object.values(u.fields||{}).filter(v=>v!==''&&v!=null).length;
    if(u.delivered) delivered.push({ref:u.ref,client:portClientOf(u.ref),date:u.date,text:u.text||''});

  const byFile=Object.values(refs).sort((a,b)=>b.n-a.n||(a.ref<b.ref?-1:1));

function portKpiHTML(){

  const rows=Object.entries(tally).sort((a,b)=>b[1]-a[1]); const mx=Math.max(1,...rows.map(r=>r[1]));
  const issues=Object.entries(portTally(recsAll)).sort((a,b)=>b[1]-a[1]).slice(0,4);

    const rs=all[c], s=rs.map(portStage); const ds=rs.map(r=>r.daysAtPort).filter(v=>v!=null);

    const lt={}; rs.forEach(r=>{ if(portStage(r)!=='delivered'){ const l=portStageLabel(r,portStage(r)); lt[l]=(lt[l]||0)+1; } });
    const bn=Object.entries(lt).sort((a,b)=>b[1]-a[1])[0];

      <div class="pf-mini"><span><b>${rs.length}</b> files</span><span><b>${s.filter(x=>x==='delivered').length}</b> delivered</span><span><b>${s.filter(x=>x==='progress').length}</b> in process</span><span><b>${s.filter(x=>x==='pending').length}</b> awaiting arrival</span>${bn?`<span>most open files sit at <b>${esc(bn[0])}</b> (${bn[1]})</span>`:''}</div>
      ${top.length?`<ul class="pf-reco">${top.map(([k,n])=>`<li>${esc(PORT_ISSUES.find(x=>x.key===k).reco(n))}</li>`).join('')}</ul>`:'<div class="up-good small">No recurring issues flagged in remarks — maintain current turnaround.</div>'}</div>`;

    <div class="section-title"><span>Where open files currently sit</span><div class="line"></div></div>
    <div class="card"><div class="pf-funnel">${rows.map(([l,n])=>`<div class="pf-frow"><div class="pf-fl">${esc(l)}</div><div class="pf-ft"><div class="pf-ff" style="width:${Math.round(n/mx*100)}%"></div></div><div class="pf-fc">${n}</div></div>`).join('')||'<div class="dim">No open files.</div>'}</div></div>
    <div class="section-title"><span>Process-level recommendations</span><div class="line"></div></div>
    <div class="rec-list">${issues.length?issues.map(([k,n])=>`<div class="rec-item amber"><div><div class="dept">Port files</div><div class="txt">${esc(PORT_ISSUES.find(x=>x.key===k).reco(n))} <span class="dim">(whole portfolio)</span></div></div></div>`).join(''):'<div class="card dim">No recurring issue patterns found in the current remarks.</div>'}</div>

/* ---------- events ---------- */
function portBindList(app){
  app.querySelectorAll('[data-pf-toggle]').forEach(h=>{
    const go=()=>{ const ref=h.getAttribute('data-pf-toggle'); const card=h.closest('.pf-file'); const on=card.classList.toggle('open'); STATE.portOpen[ref]=on; };
    h.addEventListener('click',go); h.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
  });
  app.querySelectorAll('[data-pf-flag]').forEach(b=>b.addEventListener('click',async e=>{ e.stopPropagation(); const ref=b.getAttribute('data-pf-flag'); const f=Object.assign({},portFlags()); if(f[ref]) delete f[ref]; else f[ref]=true; STATE.data.portFlags=f; await persist('portFlags'); }));
  app.querySelectorAll('[data-pf-update]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); STATE.portUpdFile=b.getAttribute('data-pf-update'); STATE.portView='update'; STATE.portMsg=''; window.scrollTo(0,0); render(); }));
}
function attachPortEvents(app){
  portState();
  app.querySelectorAll('[data-pf-view]').forEach(b=>b.addEventListener('click',()=>{ STATE.portView=b.getAttribute('data-pf-view'); window.scrollTo(0,0); render(); }));
  app.querySelectorAll('[data-pf-client]').forEach(b=>b.addEventListener('click',()=>{ STATE.portClient=b.getAttribute('data-pf-client'); render(); }));
  app.querySelectorAll('[data-pf-stage]').forEach(s=>s.addEventListener('change',()=>{ STATE.portStage=s.value; render(); }));
  app.querySelectorAll('[data-pf-flagf]').forEach(s=>s.addEventListener('change',()=>{ STATE.portFlagF=s.value; render(); }));
  app.querySelectorAll('[data-pf-archived]').forEach(c=>c.addEventListener('change',()=>{ STATE.portArchived=c.checked; render(); }));
  const sr=app.querySelector('#pf-search');
  if(sr) sr.addEventListener('input',()=>{ STATE.portSearch=sr.value; const box=app.querySelector('#pf-list'); if(box){ box.innerHTML=portListHTML(); portBindList(box); } });
  portBindList(app);
  // daily update form
  const form=app.querySelector('#pf-form');
  if(form){
    const refSel=form.querySelector('#pf-ref');
    refSel.addEventListener('change',()=>{ STATE.portUpdFile=refSel.value; const f=portUpdateFieldsHTML(refSel.value); form.querySelector('#pf-ms').innerHTML=f.ms; form.querySelector('#pf-det').innerHTML=f.det; });
    form.elements.date.addEventListener('change',()=>{ STATE.portUpdDate=form.elements.date.value; });
    form.addEventListener('submit',async e=>{
      e.preventDefault();
      const ref=form.elements.ref.value, date=form.elements.date.value, text=form.elements.text.value.trim(), delivered=form.elements.delivered.checked;
      if(!ref){ showToast('Choose a file first.'); return; } if(!date){ showToast('Choose a date.'); return; }
      const fields={};
      form.querySelectorAll('[data-pf-fkey]').forEach(inp=>{ const v=inp.value.trim(); if(v==='') return; const t=inp.getAttribute('data-pf-ftype'); fields[inp.getAttribute('data-pf-fkey')]=t==='date'?isoToDMYPort(v):(t==='number'?Number(v):v); });
      if(!text&&!delivered&&!Object.keys(fields).length){ showToast('Add some update text, a milestone, or mark it delivered.'); return; }
      STATE.data.portUpdates=[...portUpdates(),{id:uid(),ref,date,text,fields,delivered}];
      STATE.portUpdFile=ref; STATE.portUpdDate=date; STATE.portMsg='Saved update for '+ref+'.';
      await persist('portUpdates'); showToast('Saved update for '+ref+'.');
    });
  }
  app.querySelectorAll('[data-pf-del]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('Delete this update?')) return;
    STATE.data.portUpdates=portUpdates().filter(u=>u.id!==b.getAttribute('data-pf-del')); await persist('portUpdates'); showToast('Update deleted.');
  }));
}

  const red=recs.filter(r=>r.severity==='red').length, amber=recs.filter(r=>r.severity==='amber').length;

    <div class="board-seg" style="cursor:pointer" data-goto="port"><div class="k">Port files open</div><div class="v">${snap.tot.open}<small>${snap.tot.flagged} flagged</small></div></div>

/* =========================================================================================
   Transport Ops: pick the truck / driver from a list, or type your own when something changes
   ========================================================================================= */
const COMBO_OTHER='__other__';
function normReg(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }
function trKey(r){ return r.vehicleId || (r.regNoText?'~'+normReg(r.regNoText):''); }
function trKeyLabel(k){
  if(k&&k[0]==='~'){ const r=(STATE.data.transport||[]).find(x=>!x.vehicleId&&trKey(x)===k); return r?String(r.regNoText).trim().toUpperCase():k.slice(1); }
  return vehicleLabel(k);
}
function trLabelCell(r){ return r.vehicleId?vehicleLabel(r.vehicleId):(r.regNoText?String(r.regNoText).trim().toUpperCase():''); }
function comboField(f,val){
  const ed=STATE.editing; const rec=ed?((STATE.data[ed.coll]||[]).find(r=>r.id===ed.id)||{}):{};
  const req=f.required?'required':'';
  if(f.key==='vehicleId'){
    const typed=(!val&&rec.regNoText)?String(rec.regNoText):'';
    const opts=STATE.data.vehicles.map(v=>`<option value="${esc(v.id)}" ${val&&val===v.id?'selected':''}>${esc(v.regNo)}</option>`).join('');
    return `<div class="combo" data-combo="1"><label>${esc(f.label)}</label>
      <select name="vehicleId" data-combo-sel="1" ${req}><option value="">Select truck…</option>${opts}<option value="${COMBO_OTHER}" ${typed?'selected':''}>✎ Not listed — type truck no.</option></select>
      <input type="text" name="regNoText" data-combo-txt="1" placeholder="Type the truck reg no." value="${esc(typed)}" autocapitalize="characters" style="display:${typed?'block':'none'};margin-top:6px;"></div>`;
  }
  const names=knownDrivers(); const cur=String(val||'').trim();
  const inList=cur&&names.some(n=>n.toUpperCase()===cur.toUpperCase());
  const typedD=cur&&!inList?cur:'';
  return `<div class="combo" data-combo="1"><label>${esc(f.label)}</label>
    <select name="driverName" data-combo-sel="1" ${req}><option value="">Select driver…</option>${names.map(n=>`<option value="${esc(n)}" ${inList&&n.toUpperCase()===cur.toUpperCase()?'selected':''}>${esc(n)}</option>`).join('')}<option value="${COMBO_OTHER}" ${typedD?'selected':''}>✎ New / not listed — type name</option></select>
    <input type="text" name="driverNameText" data-combo-txt="1" placeholder="Type the driver’s name" value="${esc(typedD)}" style="display:${typedD?'block':'none'};margin-top:6px;"></div>`;
}
/* turn the "type it yourself" choices into the saved record */
function normalizeCombo(rec){
  if(rec.vehicleId===COMBO_OTHER){
    const t=String(rec.regNoText||'').trim().toUpperCase(); const hit=t?STATE.data.vehicles.find(v=>normReg(v.regNo)===normReg(t)):null;
    if(hit){ rec.vehicleId=hit.id; delete rec.regNoText; } else { rec.vehicleId=''; rec.regNoText=t; }
  } else delete rec.regNoText;
  if(rec.driverName===COMBO_OTHER){ rec.driverName=String(rec.driverNameText||'').trim(); }
  delete rec.driverNameText;
  return rec;
}
function syncCombos(root){
  root.querySelectorAll('[data-combo]').forEach(c=>{
    const sel=c.querySelector('[data-combo-sel]'), txt=c.querySelector('[data-combo-txt]'); if(!sel||!txt) return;
    const other=sel.value===COMBO_OTHER; txt.style.display=other?'block':'none'; txt.required=other;
    if(other&&!txt.__focused){ txt.__focused=1; }
  });
}
function attachCombos(app){
  syncCombos(app);
  app.querySelectorAll('[data-combo-sel]').forEach(sel=>sel.addEventListener('change',()=>{ syncCombos(app); if(sel.value===COMBO_OTHER){ const t=sel.closest('[data-combo]').querySelector('[data-combo-txt]'); if(t) t.focus(); } }));
  app.querySelectorAll('form').forEach(f=>f.addEventListener('reset',()=>setTimeout(()=>syncCombos(app),0)));
}

/* =========================================================================================
   HSSE upload: take one or several report files at once; always show the previous week
   compared with the week before
   ========================================================================================= */
async function handleHsseFiles(files){
  files=(files||[]).filter(Boolean); if(!files.length) return;
  if(typeof XLSX==='undefined'){ STATE.hsseMsg={t:'err',m:'The spreadsheet reader could not be loaded (check your internet connection) — reload the page and try again.'}; render(); return; }
  STATE.hsseMsg={t:'info',m:'Reading '+files.map(f=>f.name).join(', ')+'…'}; render();
  const tot={files:0,weeks:0,rows:0,inc:0,insp:0,ppe:0,tbt:0}, bad=[], seen=[];
  for(const file of files){
    try{
      const buf=file.arrayBuffer?await file.arrayBuffer():await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(fr.error); fr.readAsArrayBuffer(file); });
      const p=parseHsseWorkbook(XLSX.read(buf,{type:'array'}),file.name);
      const found=p.weeks.length+p.incidents.length+p.inspections.length+p.ppe.length+p.toolbox.length+p.weekly.length;
      if(!found){ bad.push(file.name+' (nothing recognised)'); continue; }
      mergeHsse(p,file.name); tot.files++; tot.weeks+=p.weeks.length; tot.rows+=p.weeks.reduce((a,w)=>a+w.drivers.length,0);
      tot.inc+=p.incidents.length; tot.insp+=p.inspections.length; tot.ppe+=p.ppe.length; tot.tbt+=p.toolbox.length;
      p.weeks.forEach(w=>seen.push(w.n));
    }catch(e){ console.error(e); bad.push(file.name+' ('+(e&&e.message?e.message:e)+')'); }
  }
  if(!tot.files){ STATE.hsseMsg={t:'err',m:'No HSSE data was recognised in '+files.map(f=>f.name).join(', ')+'. Expected a workbook with a driver scorecard sheet (a "Driver" and a "Distance (km)" column), an "Incident Register" or a "Vehicle HSSE Inspection" sheet.'}; render(); return; }
  // always open on the previous week, compared with the week before it
  STATE.hsseWeek=null; STATE.hsseTab='overview';
  const ws=(STATE.data.hsseScores&&STATE.data.hsseScores.weeks)||[], autoN=ordOf(prevWeekStart());
  const cw=ws.find(w=>w.n===autoN), pw=ws.find(w=>w.n===autoN-1);
  let tail;
  if(cw) tail=' Showing the previous week ('+wkLabel(cw)+')'+(pw?' compared with the week before ('+wkLabel(pw)+').':'. The week before ('+wkLabel({start:addDays(prevWeekStart(),-7)})+') has no scorecard yet — you can select both weeks’ reports together when uploading.');
  else if(tot.weeks) tail=' These scorecards are for other weeks ('+[...new Set(seen)].sort((a,b)=>a-b).map(n=>wkLabel(ws.find(w=>w.n===n))).join(', ')+'), not the previous week ('+wkLabel({start:prevWeekStart()})+'), so the latest uploaded week is shown.';
  else tail=' No driver scorecard was found, so no driver scores were added — check the workbook has a sheet with a "Driver" column and a "Distance (km)" column.';
  STATE.hsseMsg={t:(cw||tot.weeks)?'ok':'err',m:`Loaded ${tot.files} file(s): ${tot.weeks} weekly scorecard(s) (${tot.rows} driver rows), ${tot.inc} incident(s), ${tot.insp} vehicle inspection(s), ${tot.ppe} PPE check(s), ${tot.tbt} toolbox talk(s).`+tail+(bad.length?' Skipped: '+bad.join('; ')+'.':'')};
  await persistHsse(); showToast('HSSE report'+(tot.files>1?'s':'')+' uploaded and synced.');
}
async function handleHsseFile(file){ return handleHsseFiles([file]); }
