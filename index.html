<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0E13">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FleetDesk">
<meta name="description" content="FleetDesk — fleet operations, maintenance, safety, fuel, port files and weekly/monthly reports in one app.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>FleetDesk — Vehicle Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0E13; --panel:#141920; --panel-2:#191F28; --border:#232B36; --border-lite:#2C3644;
    --text:#E7EBF0; --muted:#8996A6; --dim:#5B6675;
    --amber:#E8A33D; --green:#3FB37F; --red:#E1543F; --teal:#4FA8C9;
    --amber-bg:rgba(232,163,61,0.12); --green-bg:rgba(63,179,127,0.12); --red-bg:rgba(225,84,63,0.13); --teal-bg:rgba(79,168,201,0.12);
    --radius:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{font-family:'Space Grotesk',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace;}
  ::selection{background:var(--amber);color:#0B0E13;}
  a{color:var(--teal);}
  a.btn{text-decoration:none;color:var(--text);} a.btn.primary{color:#0B0E13;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:'IBM Plex Mono',monospace;background:var(--panel-2);border:1px solid var(--border-lite);color:var(--text);border-radius:6px;padding:7px 9px;font-size:13px;width:100%;}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--amber);outline-offset:0;border-color:var(--amber);}
  label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}

  #shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
  @media (max-width:860px){#shell{grid-template-columns:1fr;} #sidebar{position:sticky;top:0;z-index:50;}}

  #sidebar{background:var(--panel);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:2px;}
  .brand{display:flex;align-items:center;gap:9px;padding:6px 8px 18px 8px;}
  .brand-mark{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--amber),#c97a1f);display:flex;align-items:center;justify-content:center;font-weight:700;color:#0B0E13;font-size:13px;flex:none;}
  .brand-name{font-weight:700;font-size:15px;letter-spacing:.01em;}
  .brand-sub{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-top:1px;}

  .navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:10px 10px;border-radius:7px;font-size:13.5px;font-weight:500;transition:background .12s,color .12s;}
  .navbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);flex:none;}
  .navbtn:hover{background:var(--panel-2);color:var(--text);}
  .navbtn.active{background:var(--amber-bg);color:var(--amber);}
  .navbtn.active .dot{background:var(--amber);}
  .navbtn .badge{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:10px;background:var(--red);color:#fff;border-radius:20px;padding:1px 6px;}

  .sidebar-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);font-size:11px;color:var(--dim);}
  .sync-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex:none;}
  .sync-dot.busy{background:var(--amber);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  #main{padding:22px 26px 60px;max-width:1320px;}
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .topbar h1{font-size:21px;margin:0 0 3px;font-weight:700;}
  .topbar .sub{color:var(--muted);font-size:13px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}

  .btn{background:var(--panel-2);border:1px solid var(--border-lite);color:var(--text);padding:8px 13px;border-radius:7px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;width:auto;}
  .btn:hover{border-color:var(--amber);}
  .btn.primary{background:var(--amber);color:#0B0E13;border-color:var(--amber);font-weight:600;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{background:transparent;border-color:var(--border);color:var(--muted);}
  .btn.small{padding:5px 10px;font-size:11.5px;}

  .board{display:flex;gap:0;border:1px solid var(--border-lite);border-radius:9px;overflow:hidden;margin-bottom:22px;background:#0E1319;flex-wrap:wrap;}
  .board-seg{flex:1;min-width:140px;padding:13px 16px;border-right:1px solid var(--border);position:relative;}
  .board-seg:last-child{border-right:none;}
  .board-seg .k{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);margin-bottom:6px;}
  .board-seg .v{font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;display:flex;align-items:baseline;gap:6px;}
  .board-seg .v small{font-size:11px;color:var(--muted);font-weight:400;}
  .board-seg.red .v{color:var(--red);}
  .board-seg.amber .v{color:var(--amber);}
  .board-seg.green .v{color:var(--green);}

  .grid{display:grid;gap:12px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:900px){.grid.cols-4,.grid.cols-3{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;}
  .card.kpi{position:relative;}
  .kpi .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .kpi .value{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:600;margin-bottom:5px;}
  .kpi .target{font-size:11.5px;color:var(--dim);}
  .kpi .bar-track{height:5px;background:var(--border);border-radius:4px;margin-top:9px;overflow:hidden;}
  .kpi .bar-fill{height:100%;border-radius:4px;}
  .tag{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:20px;white-space:nowrap;}
  .tag.green{background:var(--green-bg);color:var(--green);}
  .tag.amber{background:var(--amber-bg);color:var(--amber);}
  .tag.red{background:var(--red-bg);color:var(--red);}
  .tag.teal{background:var(--teal-bg);color:var(--teal);}
  .tag.grey{background:var(--border);color:var(--muted);}

  .section-title{font-size:14px;font-weight:600;margin:26px 0 10px;display:flex;align-items:center;gap:8px;}
  .section-title .line{flex:1;height:1px;background:var(--border);}
  .section-sub{color:var(--muted);font-size:12px;margin:-6px 0 14px;}

  .tabs{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--border);padding:3px;border-radius:8px;width:max-content;margin-bottom:16px;}
  .tabs button{background:none;border:none;color:var(--muted);padding:7px 14px;border-radius:6px;font-size:12.5px;font-weight:500;width:auto;}
  .tabs button.active{background:var(--amber);color:#0B0E13;font-weight:600;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);padding:9px 10px;border-bottom:1px solid var(--border-lite);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  tr:hover td{background:var(--panel-2);}
  .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--panel);margin-bottom:8px;}
  .empty-row td{color:var(--dim);font-style:italic;text-align:center;padding:22px;font-family:'Space Grotesk';white-space:normal;}

  .form-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:18px;}
  .form-card summary{cursor:pointer;font-weight:600;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:8px;}
  .form-card summary::-webkit-details-marker{display:none;}
  .form-card summary:before{content:'+';color:var(--amber);font-size:16px;width:18px;}
  .form-card[open] summary:before{content:'−';}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px;}
  .form-actions{margin-top:14px;display:flex;gap:8px;align-items:center;}

  .rec-list{display:flex;flex-direction:column;gap:10px;}
  .rec-item{display:flex;gap:12px;background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:7px;padding:12px 14px;}
  .rec-item.red{border-left-color:var(--red);}
  .rec-item.amber{border-left-color:var(--amber);}
  .rec-item.green{border-left-color:var(--green);}
  .rec-item .txt{font-size:13px;color:var(--text);}
  .rec-item .dept{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;font-family:'IBM Plex Mono',monospace;}

  .modal-bg{position:fixed;inset:0;background:rgba(5,7,10,0.72);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
  .modal{background:var(--panel);border:1px solid var(--border-lite);border-radius:10px;padding:22px;max-width:560px;width:100%;max-height:85vh;overflow:auto;}
  .modal h3{margin:0 0 14px;font-size:16px;}
  .toast{position:fixed;bottom:20px;right:20px;background:var(--panel);border:1px solid var(--green);color:var(--green);padding:11px 16px;border-radius:8px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.4);}

  .util-chart{display:flex;flex-direction:column;gap:7px;max-height:620px;overflow-y:auto;padding-right:4px;}
  .util-row{display:grid;grid-template-columns:110px 1fr 90px 56px;gap:10px;align-items:center;}
  .util-name{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .util-track{position:relative;height:16px;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;}
  .util-fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;}
  .util-target{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--text);opacity:.8;}
  .util-val{font-size:11.5px;text-align:right;white-space:nowrap;}
  .util-pct{text-align:right;}
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px 0 8px;}
  .legend-line{display:inline-block;width:0;height:12px;border-left:2px dashed var(--text);margin:0 4px 0 8px;}
  @media(max-width:560px){.util-row{grid-template-columns:80px 1fr 70px 46px;gap:6px;}}
  .tabs{max-width:100%;overflow-x:auto;}
  .tabs button{white-space:nowrap;}
  .hb-chart{display:flex;flex-direction:column;gap:7px;}
  .hb-row.wide{grid-template-columns:minmax(70px,110px) 1fr 150px;}
  .hb-row{display:grid;grid-template-columns:minmax(110px,190px) 1fr 84px;gap:10px;align-items:center;}
  .hb-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text);}
  .hb-track{position:relative;height:16px;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;}
  .hb-fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;}
  .hb-mark{position:absolute;top:-3px;bottom:-3px;width:0;border-left:2px dashed var(--text);opacity:.7;}
  .hb-val{font-size:11.5px;text-align:right;white-space:nowrap;}
  .hb-track.stack{display:flex;overflow:hidden;}
  .stack-seg{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:#0B0E13;min-width:0;}
  .vb-chart{display:flex;align-items:flex-end;gap:10px;height:210px;padding-top:6px;overflow-x:auto;}
  .vb-col{flex:1;min-width:46px;max-width:110px;height:100%;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .vb-bar-wrap{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;}
  .vb-bar{width:70%;border-radius:4px 4px 0 0;min-height:0;}
  .vb-val{font-size:11px;} .vb-lab{font-size:10.5px;color:var(--muted);text-align:center;white-space:nowrap;}
  .rate-track{width:70px;height:8px;background:var(--border);border-radius:5px;overflow:hidden;flex:none;}
  .rate-fill{height:100%;border-radius:5px;}
  @media(max-width:560px){.hb-row{grid-template-columns:90px 1fr 70px;gap:6px;}}
  .pair-tracks{display:flex;flex-direction:column;gap:3px;}
  .pair-tracks .hb-track{height:9px;}
  .kp-grid{display:grid;grid-template-columns:minmax(150px,1.1fr) repeat(4,minmax(0,1fr));gap:10px 16px;align-items:center;}
  .kp-hdr{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
  .kp-name{font-size:12.5px;font-weight:500;}
  .kp-track{position:relative;height:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:4px;}
  .kp-fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--dim);}
  .kp-fill.green{background:var(--green);} .kp-fill.amber{background:var(--amber);} .kp-fill.red{background:var(--red);} .kp-fill.grey{background:var(--dim);opacity:.5;}
  .kp-100{position:absolute;top:-3px;bottom:-3px;left:66.667%;width:0;border-left:2px dashed var(--text);opacity:.75;}
  .kp-txt{display:flex;justify-content:space-between;gap:6px;font-size:11px;margin-top:3px;}
  .kp-txt span{color:var(--muted);font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kp-cell::before{content:attr(data-p);display:none;font-size:10px;text-transform:uppercase;color:var(--muted);margin-bottom:2px;}
  @media(max-width:760px){ .kp-grid{grid-template-columns:1fr;} .kp-hdr{display:none;} .kp-name{margin-top:10px;font-weight:600;} .kp-cell::before{display:block;} }
  .chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:6px 18px;margin-top:14px;}
  .chk-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);}
  .chk-lab{font-size:12.5px;}
  .chk-opts{display:flex;gap:4px;flex:none;}
  .chk-opt{cursor:pointer;position:relative;} .chk-opt input{position:absolute;opacity:0;pointer-events:none;}
  .chk-opt span{display:inline-block;padding:3px 9px;border:1px solid var(--border-lite);border-radius:5px;font-size:11px;color:var(--muted);user-select:none;}
  .chk-opt input:checked + span{background:var(--green-bg);border-color:var(--green);color:var(--green);}
  .chk-opt.bad input:checked + span{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .chk-opt.warn input:checked + span{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);}
  .chk-opt input:focus-visible + span{outline:2px solid var(--teal);}
  .chk-inline{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;}
  @media(max-width:560px){ .chk-grid{grid-template-columns:1fr;} }
  .muted{color:var(--muted);} .dim{color:var(--dim);} .small{font-size:11.5px;}
  .flex{display:flex;align-items:center;} .between{justify-content:space-between;} .gap8{gap:8px;}

  @media(prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important;}}

  .report-toolbar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:20px;}
  .report-toolbar > div{display:flex;flex-direction:column;gap:4px;min-width:160px;}
  #report-doc{background:#0F141B;border:1px solid var(--border);border-radius:10px;padding:34px 38px;}
  .report-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--amber);padding-bottom:16px;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .report-head .rt{font-size:22px;font-weight:700;}
  .report-head .rs{color:var(--muted);font-size:13px;margin-top:3px;}
  .report-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  @media(max-width:700px){.report-meta{grid-template-columns:repeat(2,1fr);}}
  .report-meta div{background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:10px 12px;}
  .report-meta .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:3px;font-family:'IBM Plex Mono',monospace;}
  .report-meta .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;}
  .report-dept{margin-bottom:26px;page-break-inside:avoid;}
  .report-dept h3{font-size:15px;margin:0 0 10px;padding-left:10px;border-left:3px solid var(--amber);}
  .report-dept h4{font-size:12px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;}
  .report-table{width:100%;border-collapse:collapse;margin-bottom:10px;}
  .report-table th{background:var(--panel-2);text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border:1px solid var(--border);}
  .report-table td{padding:8px 10px;border:1px solid var(--border);font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  .report-notes{font-size:12.5px;color:var(--muted);background:var(--panel);border:1px dashed var(--border-lite);border-radius:7px;padding:10px 12px;margin-top:6px;}
  .report-notes b{color:var(--text);}
  .signoff{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px;padding-top:20px;border-top:1px solid var(--border);}
  .signoff .line{border-bottom:1px solid var(--border-lite);height:34px;}
  .signoff .cap{font-size:11px;color:var(--dim);margin-top:5px;text-transform:uppercase;letter-spacing:.05em;}

  /* ===== v5: tidy-up, clearer tables, friendlier navigation ===== */
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  .navgroup{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:16px 10px 5px;}
  .navgroup:first-of-type{padding-top:4px;}
  .row-actions{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:nowrap;}
  .btn.danger{background:transparent;border-color:var(--border);color:var(--muted);}
  .btn.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-bg);}
  .table-wrap{max-height:72vh;}
  .table-wrap th{position:sticky;top:0;z-index:2;background:var(--panel);}
  .filterbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:0 0 16px;}
  .filterbar > div{min-width:170px;flex:0 1 220px;}
  .note{padding:10px 12px;border-radius:7px;font-size:12.5px;line-height:1.5;border:1px solid var(--border);margin:10px 0;}
  .note.warn{background:var(--amber-bg);border-color:rgba(232,163,61,.35);color:var(--amber);}
  .note.ok{background:var(--green-bg);border-color:rgba(63,179,127,.35);color:var(--green);}
  .up-good{color:var(--green);font-weight:600;} .up-bad{color:var(--red);font-weight:600;}
  .rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;color:#0B0E13;}
  .rank.good{background:var(--green);} .rank.bad{background:var(--red);}
  .rank-card.good{border-top:3px solid var(--green);} .rank-card.bad{border-top:3px solid var(--red);}
  .rank-card .table-wrap{max-height:none;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  details.hist{padding:12px 16px;margin-bottom:10px;}
  details.hist summary{flex-wrap:wrap;gap:10px;}
  .form-card summary:hover{color:var(--amber);}
  .section-sub{max-width:900px;line-height:1.5;}
  .tabs button:hover:not(.active){color:var(--text);}

/* Large datasets are split across several cells (a Sheets cell holds at most 50,000 characters).
   Data under the limit is stored exactly as before, so existing data stays compatible. */
const CELL_MAX = 45000, MAX_CHUNKS = 40, CHUNK_MARK = '~CHUNKED~';
const CELL_CACHE = {};
function toCells(str){
  if(str.length <= CELL_MAX) return [str];
  const parts = []; let i = 0;
  while(i < str.length){
    let end = Math.min(i + CELL_MAX, str.length);
    if(end < str.length){ const c = str.charCodeAt(end-1); if(c >= 0xD800 && c <= 0xDBFF) end--; }
    parts.push(str.slice(i, end)); i = end;
  }
  if(parts.length > MAX_CHUNKS) throw new Error('Dataset too large to store');
  return [CHUNK_MARK + parts.length + '~' + parts[0], ...parts.slice(1).map(p=>'c|'+p)];
}
function chunkCount(v){ const m = typeof v === 'string' ? /^~CHUNKED~(\d+)~/.exec(v) : null; return m ? parseInt(m[1],10) : 1; }
async function gasGetAllChunked(keys){
  const first = await gasGetAll(keys);
  const need = [];
  keys.forEach(k=>{ const n = chunkCount(first[k]); for(let i=1;i<n;i++) need.push(k+'~'+i); });
  const extra = {};
  for(let i=0;i<need.length;i+=20) Object.assign(extra, await gasGetAll(need.slice(i,i+20)));
  const out = {};
  keys.forEach(k=>{
    const v = first[k]; const n = chunkCount(v);
    if(n <= 1){ out[k] = v; CELL_CACHE[k] = (v===null||v===undefined) ? [] : [String(v)]; return; }
    const m = /^~CHUNKED~(\d+)~/.exec(v); const cells = [v]; let str = v.slice(m[0].length);
    for(let i=1;i<n;i++){
      const c = extra[k+'~'+i];
      if(typeof c !== 'string' || c.indexOf('c|') !== 0) throw new Error('Incomplete data for '+k+' (chunk '+i+' missing) — please refresh.');
      cells.push(c); str += c.slice(2);
    }
    out[k] = str; CELL_CACHE[k] = cells;
  });
  return out;
}
async function gasSetChunked(key, str){
  const cells = toCells(str); const old = CELL_CACHE[key] || [];
  for(let i=cells.length-1;i>=0;i--){            // continuation cells first, header cell last
    if(old[i] !== cells[i]){ await gasSet(i===0 ? key : key+'~'+i, cells[i]); old[i] = cells[i]; }
  }
  CELL_CACHE[key] = cells;
}
async function gasSet(key, valueStr){
  const res = await fetch(GAS_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight against Apps Script
    body: JSON.stringify({action:'set', key, value: valueStr})
  });
  if(!res.ok) throw new Error('Backend returned '+res.status);
  return await res.json();
}

    const changed = !silent || JSON.stringify(newData)!==JSON.stringify(STATE.data) || JSON.stringify(newTargets)!==JSON.stringify(STATE.targets);

/* ---------------- date / math helpers ---------------- */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
/* ---- Calendar periods ------------------------------------------------------------------
   Weeks run Monday–Sunday and months run 1st–last day.
   'week' / 'month'      = the current period so far
   'lastweek'/'lastmonth' = the last COMPLETED period (the default "in review")
   'prevweek'/'prevmonth' = the period before that (used for comparison)                     */
function monthStartOf(s){ return s.slice(0,8)+'01'; }
function monthEndOf(s){ const d=new Date(s.slice(0,7)+'-01T00:00:00'); d.setMonth(d.getMonth()+1); d.setDate(0); return isoLocal(d); }
function addMonthsStr(s,n){ const d=new Date(s.slice(0,7)+'-01T00:00:00'); d.setMonth(d.getMonth()+n); return isoLocal(d); }
function periodRange(period){
  if(period && typeof period==='object') return period;
  const t=todayStr();
  switch(period){
    case 'day': return {start:t,end:t};
    case 'week': return {start:wkStart(t),end:t};
    case 'lastweek': { const s=addDays(wkStart(t),-7); return {start:s,end:addDays(s,6)}; }
    case 'prevweek': { const s=addDays(wkStart(t),-14); return {start:s,end:addDays(s,6)}; }
    case 'month': return {start:monthStartOf(t),end:t};
    case 'lastmonth': { const s=addMonthsStr(t,-1); return {start:s,end:monthEndOf(s)}; }
    case 'prevmonth': { const s=addMonthsStr(t,-2); return {start:s,end:monthEndOf(s)}; }
  }
  return null;
}
function periodDays(period){
  if(typeof period==='number') return period;
  const r=periodRange(period); if(!r) return 7;
  return Math.round((new Date(r.end+'T00:00:00')-new Date(r.start+'T00:00:00'))/86400000)+1;
}
const PERIOD_WORD={day:'today',week:'this week',lastweek:'last week',prevweek:'the week before',month:'this month',lastmonth:'last month',prevmonth:'the month before'};
function periodWord(p){ return (typeof p==='string'&&PERIOD_WORD[p])||'in this period'; }
function prevPeriodOf(p){ return p==='lastweek'?'prevweek':(p==='lastmonth'?'prevmonth':null); }
function rangeText(r){ if(!r) return ''; const o={day:'numeric',month:'short'}, oy={day:'numeric',month:'short',year:'numeric'}; const a=new Date(r.start+'T00:00:00'), b=new Date(r.end+'T00:00:00'); return r.start===r.end? b.toLocaleDateString(undefined,oy) : a.toLocaleDateString(undefined,a.getFullYear()===b.getFullYear()?o:oy)+' – '+b.toLocaleDateString(undefined,oy); }
function inPeriod(dateStr, period){
  if(!dateStr) return false;
  const r=periodRange(period); if(!r) return true;
  return dateStr>=r.start && dateStr<=r.end;
}
function filterPeriod(recs, period){ return (recs||[]).filter(r=>inPeriod(r.date, period)); }
function filterRange(recs,s,e){ return (recs||[]).filter(r=>r.date&&r.date>=s&&r.date<=e); }
function inWeekRange(dateStr, endDateStr){
  if(!dateStr || !endDateStr) return false;
  const d = new Date(dateStr+'T00:00:00'), end = new Date(endDateStr+'T00:00:00');
  const start = new Date(end.getTime() - 6*86400000);
  return d>=start && d<=end;
}
function filterWeekRange(recs, endDateStr){ return recs.filter(r=>inWeekRange(r.date, endDateStr)); }
function weekRangeLabel(endDateStr){
  const end = new Date(endDateStr+'T00:00:00'), start = new Date(end.getTime() - 6*86400000);
  const opts = {day:'numeric', month:'short', year:'numeric'};
  return `${start.toLocaleDateString(undefined,opts)} – ${end.toLocaleDateString(undefined,opts)}`;
}
// Scales a fixed daily/weekly target rate to the length of the period being viewed.
function scaledTarget(rate, unit, period){
  const days = periodDays(period);
  if(unit==='day') return rate*days;
  if(unit==='week') return rate*(days/7);
  return rate;
}
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function sumBy(recs,key){ return recs.reduce((a,r)=>a+num(r[key]),0); }
function avgBy(recs,key){ const vals=recs.map(r=>num(r[key])); if(!vals.length) return 0; return vals.reduce((a,b)=>a+b,0)/vals.length; }
function fmt(v, decimals=0){ if(v===undefined||v===null||isNaN(v)) return '—'; return v.toLocaleString(undefined,{minimumFractionDigits:decimals,maximumFractionDigits:decimals}); }
function pct(v){ if(v===undefined||v===null||isNaN(v)) return '—'; return (v*100).toFixed(1)+'%'; }
function attainment(actual, target, goodDir='higher'){
  if(target===null || target===undefined || target===0) return null;
  return goodDir==='higher' ? actual/target : target/actual;
}
function statusOf(ratio){
  if(ratio===null || ratio===undefined || isNaN(ratio)) return 'grey';
  if(ratio>=0.98) return 'green'; if(ratio>=0.90) return 'amber'; return 'red';
}
function statusLabel(s){ return {green:'On Target',amber:'Watch',red:'Action Needed',grey:'No Target'}[s]; }
function uid(){ return 'id'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function findVehicle(vid){ return STATE.data.vehicles.find(v=>v.id===vid); }
function vehicleLabel(vid){ const v=findVehicle(vid); return v? v.regNo : '(removed vehicle)'; }

function kpisJourneyByRoute(recs, period){
  return ROUTE_KEYS_TARGETED.map(key=>{
    const cfg = ROUTES[key];
    const routeRecs = recs.filter(r=>r.route===key);
    const target = scaledTarget(cfg.tripsPerDayTarget,'day',period);
    const actual = routeRecs.length;
    const avgDurActual = avgBy(routeRecs,'durationActual');
    const tripsRatio = attainment(actual,target,'higher');
    const durRatio = routeRecs.length? attainment(avgDurActual,cfg.durationTargetHrs,'lower') : null;
    const ratios = [tripsRatio, durRatio].filter(r=>r!==null && r!==undefined);
    const combined = ratios.length? ratios.reduce((a,b)=>a+b,0)/ratios.length : null;
    return {key, label:cfg.label, target, actual, avgDurActual, durTarget:cfg.durationTargetHrs, status:statusOf(combined), ratio:combined};
  });
}
function kpisJourneyByTruck(recs){

    {key:'truckinsp', label:'Trucks Inspected (Maint.)', actual:trucksInspected, target:truckInspTarget, fmt:0, good:'higher', ratio:attainment(trucksInspected,truckInspTarget,'higher')},
    {key:'patrol', label:'Road Patrols (Maint.)', actual:roadPatrols, target:patrolTarget, fmt:0, good:'higher', ratio:attainment(roadPatrols,patrolTarget,'higher')},
    {key:'toolbox', label:'Toolbox Talks (Maint.)', actual:toolbox, target:toolboxTarget, fmt:0, good:'higher', ratio:attainment(toolbox,toolboxTarget,'higher')},
  ];
}
// All-time repair analytics: repeated repairs, frequency per truck, highest-repair trucks.
function repairAnalytics(vehicles, logs){
  const repairLogs = logs.filter(l=>l.type==='Breakdown'||l.type==='Repair');
  const freqMap = {};
  repairLogs.forEach(l=>{ freqMap[l.vehicleId]=(freqMap[l.vehicleId]||0)+1; });
  const frequency = Object.entries(freqMap).map(([vid,count])=>({vehicleId:vid, regNo:vehicleLabel(vid), count})).sort((a,b)=>b.count-a.count);
  const topRepaired = frequency.slice(0,5);
  const groupMap = {};
  repairLogs.forEach(l=>{
    const key = l.vehicleId+'|'+(l.component||'Unspecified');
    if(!groupMap[key]) groupMap[key]={vehicleId:l.vehicleId, regNo:vehicleLabel(l.vehicleId), component:l.component||'Unspecified', count:0, lastDate:l.date};
    groupMap[key].count++;
    if(l.date && (!groupMap[key].lastDate || l.date>groupMap[key].lastDate)) groupMap[key].lastDate=l.date;
  });
  const repeated = Object.values(groupMap).filter(g=>g.count>=2).sort((a,b)=>b.count-a.count);
  return {frequency, topRepaired, repeated};
}

/* ---------------- truck utilization (Transport Ops) ---------------- */
function perTruckTripTarget(period){
  const vehicles = STATE.data.vehicles.length;
  const fleetDaily = ROUTE_KEYS_TARGETED.reduce((a,k)=>a+ROUTES[k].tripsPerDayTarget,0);
  const manual = num(STATE.targets.truckTripsPerDayTarget);
  const perDay = manual>0 ? manual : (vehicles? fleetDaily/vehicles : 0);
  return {perDay, target: scaledTarget(perDay,'day',period), auto: !(manual>0)};
}
function kpisUtilization(period){
  const journey = filterPeriod(STATE.data.journey, period);
  const {perDay, target, auto} = perTruckTripTarget(period);
  const counts = {};
  journey.forEach(r=>{ counts[r.vehicleId]=(counts[r.vehicleId]||0)+1; });
  const rows = STATE.data.vehicles.map(v=>{
    const trips = counts[v.id]||0;
    const ratio = target>0 ? trips/target : null;
    return {vehicleId:v.id, regNo:v.regNo, model:v.model||'', trips, target, ratio, status: statusOf(ratio)};
  }).sort((a,b)=>b.trips-a.trips || a.regNo.localeCompare(b.regNo));
  const n = rows.length;
  const totalTrips = rows.reduce((a,r)=>a+r.trips,0);
  const totalTarget = target*n;
  const fleetUtil = totalTarget>0 ? totalTrips/totalTarget : 0;
  const active = rows.filter(r=>r.trips>0).length;
  const onTarget = rows.filter(r=>target>0 && r.trips>=target).length;
  return {rows, perDay, target, auto, fleetUtil, active, idle:n-active, onTarget, avgTrips: n? totalTrips/n : 0, n};
}
function utilizationSection(period){
  const u = kpisUtilization(period);
  const periodLabel = periodWord(period);
  const kpi = (label,val,sub,st)=>`<div class="card kpi"><div class="label"><span>${label}</span>${st?`<span class="tag ${st}">${statusLabel(st)}</span>`:''}</div><div class="value">${val}</div><div class="target">${sub}</div></div>`;
  const max = Math.max(1, u.target, ...u.rows.map(r=>r.trips)) * 1.08;
  const colour = {green:'var(--green)',amber:'var(--amber)',red:'var(--red)',grey:'var(--dim)'};
  const tgtPos = Math.min(100, (u.target/max)*100);
  const bars = u.rows.length ? u.rows.map(r=>`
    <div class="util-row" title="${r.regNo}: ${r.trips} trip(s) vs target ${fmt(r.target,1)}">
      <div class="util-name mono">${r.regNo}</div>
      <div class="util-track">
        <div class="util-fill" style="width:${Math.max(r.trips>0?1:0,(r.trips/max)*100)}%;background:${colour[r.status]}"></div>
        <div class="util-target" style="left:${tgtPos}%"></div>
      </div>
      <div class="util-val mono">${r.trips} <span class="dim">/ ${fmt(r.target,1)}</span></div>
      <div class="util-pct"><span class="tag ${r.status}">${r.ratio===null?'—':Math.round(r.ratio*100)+'%'}</span></div>
    </div>`).join('') : `<div class="dim small" style="padding:14px;">No vehicles registered yet — add trucks under Maintenance → vehicle registry.</div>`;
  return `
  <div class="section-title"><span>Truck Utilization — Trips vs Target</span><div class="line"></div></div>
  <div class="section-sub">Fleet-wide (all routes), from the Journey Mgmt trip log. Utilization = trips logged in Journey Mgmt ÷ trip target per truck. Target ${fmt(u.perDay,2)} trips/truck/day ${u.auto?`(auto: combined route target of ${ROUTE_KEYS_TARGETED.reduce((a,k)=>a+ROUTES[k].tripsPerDayTarget,0)}/day ÷ ${u.n} trucks — override under Targets)`:'(set under Targets)'} → ${fmt(u.target,1)} per truck ${periodLabel}.</div>
  <div class="grid cols-4">
    ${kpi('Fleet Utilization', pct(u.fleetUtil), `Target 100.0%`, statusOf(u.fleetUtil))}
    ${kpi('Active Trucks', `${u.active} <span class="dim" style="font-size:13px">/ ${u.n}</span>`, 'Trucks with ≥1 trip')}
    ${kpi('Idle Trucks', u.idle, 'No trips logged '+periodLabel, u.n? (u.idle===0?'green':(u.idle/u.n>0.5?'red':'amber')) : null)}
    ${kpi('Trucks Meeting Target', u.onTarget, `Avg ${fmt(u.avgTrips,1)} trips / truck`)}
  </div>
  <div class="card" style="margin-top:12px;">
    <div class="flex between" style="margin-bottom:12px;flex-wrap:wrap;gap:8px;">
      <div style="font-weight:600;font-size:13.5px;">Trips per Truck vs Target</div>
      <div class="dim small flex gap8"><span class="legend-dot" style="background:var(--green)"></span>≥98% <span class="legend-dot" style="background:var(--amber)"></span>90–98% <span class="legend-dot" style="background:var(--red)"></span>&lt;90% <span class="legend-line"></span>Target</div>
    </div>
    <div class="util-chart">${bars}</div>
  </div>`;
}

/* ---------------- cost per km (fuel) ---------------- */
function fuelCalc(r){
  const dist=num(r.distanceKm), litres=num(r.fuelLitres), price=num(r.pricePerLitre), other=num(r.otherCost);
  const fuelCost = litres*price, total = fuelCost+other;
  return {dist, litres, price, other, fuelCost, total,
    kmPerL: litres? dist/litres : 0, lPer100: dist? litres/dist*100 : 0,
    fuelPerKm: dist? fuelCost/dist : 0, costPerKm: dist? total/dist : 0};
}
function naira(v,d=0){ if(v===undefined||v===null||isNaN(v)) return '—'; return '₦'+v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fuelResultsHTML(r){
  if(r.prevOdometer!==undefined && r.prevOdometer!=='' && r.newOdometer!==undefined && r.newOdometer!=='' && num(r.newOdometer)<=num(r.prevOdometer))
    return `<div class="tag red" style="display:block;padding:8px 10px;white-space:normal;text-transform:none;letter-spacing:0;font-size:12px;">New odometer must be higher than the previous odometer.</div>`;
  const c = fuelCalc(r);
  const cell=(k,v,big)=>`<div class="card kpi" ${big?'style="border-color:var(--amber)"':''}><div class="label"><span>${k}</span></div><div class="value" ${big?'style="color:var(--amber)"':''}>${v}</div></div>`;
  if(!c.dist || !c.litres) return `<div class="dim small">Enter distance and fuel used to see results.</div>`;
  return `<div class="grid cols-4">
    ${cell('Total Cost per KM', naira(c.costPerKm,2), true)}
    ${cell('Fuel Cost per KM', naira(c.fuelPerKm,2))}
    ${cell('Fuel Efficiency', fmt(c.kmPerL,2)+' km/L')}
    ${cell('Consumption', fmt(c.lPer100,1)+' L/100km')}
    ${cell('Fuel Cost', naira(c.fuelCost))}
    ${cell('Other Costs', naira(c.other))}
    ${cell('Total Trip Cost', naira(c.total))}
    ${cell('Distance', fmt(c.dist,1)+' km')}
  </div>`;
}

/* ---------------- recommendation engine ---------------- */
function buildRecommendations(filtered, period){
  period = period || 'lastweek'; const W = periodWord(period);
  const recs = [];
  const f = filtered || {
    transport: filterPeriod(STATE.data.transport,period), journey: filterPeriod(STATE.data.journey,period),
    inspections: filterPeriod(STATE.data.inspections,period), pretrip: filterPeriod(STATE.data.pretrip,period),
    safety: filterPeriod(STATE.data.safety,period), maintenance: filterPeriod(STATE.data.maintenance,period),
    maintenanceDaily: filterPeriod(STATE.data.maintenanceDaily,period),
  };
  const t = kpisTransport(f.transport);
  const jOverall = kpisJourneyOverall(f.journey,period);
  const jByRoute = kpisJourneyByRoute(f.journey,period);
  const i = kpisInspections(f.inspections);
  const pp = kpisPrePost(f.pretrip);
  const s = kpisSafety(f.safety,period);
  const m = kpisMaintenance(f.maintenance, STATE.data.vehicles, f.maintenanceDaily,period);
  const repairs = repairAnalytics(STATE.data.vehicles, STATE.data.maintenance);

  function pushIfBad(dept, kpi, msgAmber, msgRed){
    if(!kpi) return;
    const st = statusOf(kpi.ratio);
    if(st==='red') recs.push({dept, severity:'red', text: msgRed});
    else if(st==='amber') recs.push({dept, severity:'amber', text: msgAmber});
  }
  const g = (arr,k)=>arr.find(x=>x.key===k);

  pushIfBad('Transport', g(t,'trips'), `Trip completion at ${pct(g(t,'trips').ratio)} of target ${W} — check dispatch scheduling and vehicle availability.`, `Trip completion critically low — investigate driver/vehicle shortages immediately.`);
  pushIfBad('Transport', g(t,'tonnage'), `Tonnage attainment trailing target — review load planning and under-utilised trips.`, `Tonnage moved well below target — audit load factors and route allocation urgently.`);
  pushIfBad('Transport', g(t,'turnaround'), `Turnaround time running above target — review loading-bay and detention delays.`, `Turnaround time significantly above target — escalate loading/offloading bottlenecks to site ops.`);

  pushIfBad('Journey Mgmt', g(jOverall,'trips'), `Fleet is behind the combined route trip target ${W} — check route allocation across gas trucks.`, `Fleet is well behind the combined daily trip targets — escalate route/driver allocation urgently.`);
  pushIfBad('Journey Mgmt', g(jOverall,'ontime'), `On-time arrivals slipping — review route planning and departure windows.`, `On-time performance critically low — reassess journey plans and traffic/route risk.`);
  pushIfBad('Journey Mgmt', g(jOverall,'risk'), `Some journeys missing a completed risk assessment — reinforce pre-trip planning discipline.`, `Risk assessment compliance critically low — journeys are running without proper planning sign-off.`);
  pushIfBad('Journey Mgmt', g(jOverall,'delay'), `Average delay/idling above target — review loading-point queuing and traffic routing.`, `Delay/idling well above target — significant time is being lost fleet-wide; investigate causes by route.`);
  const devKpi = g(jOverall,'deviations');
  if(devKpi && num(devKpi.actual)>0) recs.push({dept:'Journey Mgmt', severity: num(devKpi.actual)>3?'red':'amber', text:`${devKpi.actual} route deviation(s) logged ${W} — review with drivers and confirm approved routing.`});
  const violKpi = g(jOverall,'violations');
  if(violKpi && num(violKpi.actual)>0) recs.push({dept:'Journey Mgmt', severity: num(violKpi.actual)>2?'red':'amber', text:`${violKpi.actual} driver-hours violation(s) logged ${W} — review rostering and rest-break compliance.`});
  const worstRoutes = jByRoute.filter(r=>r.status==='red');
  const watchRoutes = jByRoute.filter(r=>r.status==='amber');
  if(worstRoutes.length) recs.push({dept:'Journey Mgmt', severity:'red', text:`Route(s) missing target: ${worstRoutes.map(r=>r.label).join(', ')} — trip count and/or duration is off target.`});
  else if(watchRoutes.length) recs.push({dept:'Journey Mgmt', severity:'amber', text:`Route(s) trending off target: ${watchRoutes.map(r=>r.label).join(', ')} — monitor over the coming week.`});

  pushIfBad('Inspections', g(i,'compliance'), `Inspection compliance below target — some vehicles dispatched without a completed check.`, `Inspection compliance critically low — vehicles may be running without valid pre-trip checks.`);
  pushIfBad('Inspections', g(i,'defectrate'), `Defect rate trending up — consider a fleet-wide condition audit.`, `Defect rate is high — schedule a fleet condition audit and review maintenance intervals.`);
  const critKpi = g(i,'critical');
  if(critKpi && num(critKpi.actual)>0) recs.push({dept:'Inspections', severity:'red', text:`${critKpi.actual} critical defect(s) reported — ground affected vehicles until rectified.`});
  if(g(pp,'pre') && g(pp,'pre').ratio!==null) pushIfBad('Inspections', g(pp,'pre'), `Pre-trip pass rate slipping — reinforce pre-trip checklist discipline with drivers.`, `Pre-trip pass rate critically low — vehicles are failing checks before dispatch; investigate root causes.`);
  if(g(pp,'post') && g(pp,'post').ratio!==null) pushIfBad('Inspections', g(pp,'post'), `Post-trip pass rate slipping — check for damage/wear accumulating during trips.`, `Post-trip pass rate critically low — review driver handling and route conditions.`);

  const incKpi = g(s,'incidents');
  if(incKpi && num(incKpi.actual)>0) recs.push({dept:'Safety', severity:'red', text:`${incKpi.actual} safety incident(s) ${W} — trigger root-cause investigation per HSE procedure.`});
  pushIfBad('Safety', g(s,'ltifr'), `LTIFR trending above target — reinforce toolbox talks and hazard reporting.`, `LTIFR above target threshold — escalate to HSE management for corrective action plan.`);
  pushIfBad('Safety', g(s,'truckinsp'), `Safety truck-inspection count behind the 5/day target — schedule catch-up inspections.`, `Safety truck inspections well behind target — daily inspection cadence has broken down.`);
  pushIfBad('Safety', g(s,'patrol'), `Road patrols behind the twice-weekly target — schedule the missing patrol(s) in the coming week.`, `Road patrols significantly behind target — routes are going unchecked.`);
  pushIfBad('Safety', g(s,'toolbox'), `Weekly toolbox talk was not held — schedule one in the coming week.`, `Toolbox talk compliance critically low — safety communication cadence has broken down.`);

  pushIfBad('Maintenance', g(m,'pm'), `PM compliance slipping — reschedule overdue services in the coming week.`, `PM compliance critically low — overdue services are elevating breakdown risk fleet-wide.`);
  pushIfBad('Maintenance', g(m,'breakdown'), `Breakdown rate above target — review recent failure patterns by component.`, `Breakdown rate high — consider a fleet reliability review and spares stock check.`);
  pushIfBad('Maintenance', g(m,'truckinsp'), `Maintenance truck-inspection count behind the 5/day target — schedule catch-up inspections.`, `Maintenance truck inspections well behind target — daily inspection cadence has broken down.`);
  pushIfBad('Maintenance', g(m,'patrol'), `Maintenance road patrols behind the twice-weekly target — schedule the missing patrol(s) in the coming week.`, `Maintenance road patrols significantly behind target.`);
  pushIfBad('Maintenance', g(m,'toolbox'), `Weekly maintenance toolbox talk was not held — schedule one in the coming week.`, `Maintenance toolbox talk compliance critically low.`);
  const chronic = repairs.repeated.filter(r=>r.count>=3);
  const repeat2 = repairs.repeated.filter(r=>r.count===2);
  if(chronic.length) recs.push({dept:'Maintenance', severity:'red', text:`Chronic repeat repairs: ${chronic.map(r=>`${r.regNo} (${r.component}, ${r.count}x)`).join('; ')} — investigate root cause, consider component replacement over repeat repair.`});
  else if(repeat2.length) recs.push({dept:'Maintenance', severity:'amber', text:`Repeat repairs logged: ${repeat2.slice(0,3).map(r=>`${r.regNo} (${r.component})`).join(', ')} — watch for a recurring pattern.`});
  const overdueVehicles = STATE.data.vehicles.map(maintenanceStatusForVehicle).filter(a=>a.status==='red');
  const dueSoonVehicles = STATE.data.vehicles.map(v=>maintenanceStatusForVehicle(v)).filter(a=>a.status==='amber');
  if(overdueVehicles.length) recs.push({dept:'Maintenance', severity:'red', text:`${overdueVehicles.length} vehicle(s) overdue for service — predictive model flags immediate scheduling.`});
  if(dueSoonVehicles.length) recs.push({dept:'Maintenance', severity:'amber', text:`${dueSoonVehicles.length} vehicle(s) approaching service threshold — schedule within 7 days / 500km.`});

  try{
    const MR = analyzeMaintenance(30);
    const critT = MR.profiles.filter(p=>p.tier==='CRITICAL'), highT = MR.profiles.filter(p=>p.tier==='HIGH');
    if(critT.length) recs.push({dept:'Maintenance', severity:'red', text:`${critT.length} truck(s) rated CRITICAL for repair risk: ${critT.slice(0,4).map(p=>p.regNo+' ('+p.rating+')').join(', ')} — see Maintenance → Repairs & Risk for the actions.`});
    else if(highT.length) recs.push({dept:'Maintenance', severity:'amber', text:`${highT.length} truck(s) rated HIGH for repair risk: ${highT.slice(0,4).map(p=>p.regNo+' ('+p.rating+')').join(', ')} — schedule inspections in the coming week.`});
    if(MR.unresolvedDriver.length) recs.push({dept:'Maintenance', severity:'red', text:`${MR.unresolvedDriver.length} defect report(s) from drivers' pre/post-trip checks have not been raised to Maintenance.`});
  }catch(e){}
  try{
    const P = predictServicing();
    const early = P.list.filter(x=>x.dueIn!==null && x.dueIn<=14 && x.dueIn>=0);
    if(early.length) recs.push({dept:'Maintenance', severity:'amber', text:`Predictive model: ${early.length} truck(s) forecast to hit their service point within 14 days — ${early.slice(0,4).map(x=>x.regNo).join(', ')}. Book them in order from Maintenance → Predictive.`});
    if(P.repeats && P.repeats.length) recs.push({dept:'Maintenance', severity:'amber', text:`${P.repeats.length} repeat-failure pattern(s) detected (e.g. ${P.repeats[0].regNo} — ${P.repeats[0].component}). Investigate root cause rather than re-repairing.`});
  }catch(e){}
  try{
    const rg=periodRange(period)||{start:addDays(todayStr(),-6),end:todayStr()}; const A=cngWeek(rg.start,rg.end);
    A.rows.filter(t=>t.status.tag==='red'&&t.fills>0&&t.diff>0.75).slice(0,4).forEach(t=>recs.push({dept:'Fuel', severity:'red', text:`${t.regNo}: ${t.fills} CNG fill-ups ${W} against ${fmt(t.expected,1)} allowed for the trips done — check for unrecorded trips or gas misuse.`}));
    A.rows.filter(t=>!t.fills&&t.trips>0).slice(0,3).forEach(t=>recs.push({dept:'Fuel', severity:'amber', text:`${t.regNo}: ${fmt(t.trips)} trip(s) ${W} but no CNG fill-up logged — record the gas bought.`}));
  }catch(e){}
  if(recs.length===0) recs.push({dept:'Fleet', severity:'green', text:`All departments are within target ${W}. No corrective actions required — maintain current cadence.`});
  const order={red:0,amber:1,green:2};
  recs.sort((a,b)=>order[a.severity]-order[b.severity]);
  return recs;
}

/* ---------------- generic UI builders ---------------- */
function kpiChangeHTML(k,p,lbl){
  if(!p||p.actual===undefined||p.actual===null||isNaN(p.actual)||isNaN(k.actual)) return '';
  const d=k.actual-p.actual; const isPct=k.fmt==='pct'; const dec=isPct?1:(k.fmt===undefined?0:k.fmt);
  const shown=isPct?Math.abs(d*100):Math.abs(d); const same=Math.abs(shown)<Math.pow(10,-(dec+1))/2;
  const good=k.good||'higher'; const better=same?null:(good==='lower'?d<0:d>0);
  const cls=same?'dim':(better?'up-good':'up-bad');
  const was=isPct?pct(p.actual):fmt(p.actual,dec)+(k.unit?' '+k.unit:'');
  const txt=same?'no change':`${d>0?'▲':'▼'} ${fmt(shown,dec)}${isPct?' pts':(k.unit?' '+k.unit:'')}`;
  return `<div class="kchg"><span class="${cls}">${txt}</span><span class="dim"> vs ${esc(lbl||'before')}: ${was}</span></div>`;
}
function kpiCardP(k,prev,lbl){
  const st = statusOf(k.ratio);
  const barPct = (k.ratio===null||k.ratio===undefined)? 0 : Math.max(4, Math.min(100, k.ratio*100));
  const barColor = {green:'var(--green)',amber:'var(--amber)',red:'var(--red)',grey:'var(--dim)'}[st];
  const valueDisplay = k.fmt==='pct' ? pct(k.actual) : fmt(k.actual, k.fmt===undefined?0:k.fmt) + (k.unit? ' '+k.unit : '');
  const targetDisplay = (k.target===null||k.target===undefined) ? 'No fixed target' : ('Target '+(k.fmt==='pct'?pct(k.target):fmt(k.target,k.fmt===undefined?0:k.fmt)+(k.unit?' '+k.unit:'')));
  return `<div class="card kpi">
    <div class="label"><span>${k.label}</span><span class="tag ${st}">${statusLabel(st)}</span></div>
    <div class="value">${valueDisplay}</div>
    <div class="target">${targetDisplay}</div>
    <div class="bar-track"><div class="bar-fill" style="width:${barPct}%;background:${barColor}"></div></div>
    ${kpiChangeHTML(k,prev,lbl)}
  </div>`;
}
function kpiCard(k){ return kpiCardP(k,null); }
function kpiGrid(cur,prev,lbl){ return cur.map((k,i)=>kpiCardP(k,prev&&prev[i],lbl)).join(''); }
/* Period tabs — "Last Week" is the default and is compared with the week before. */
function periodTabs(deptKey){
  const cur = STATE.periodByDept[deptKey];
  const opts = [['day','Today'],['week','This Week'],['lastweek','Last Week'],['month','This Month'],['lastmonth','Last Month']];
  return `<div class="tabs" data-period-tabs="${deptKey}">${opts.map(([k,l])=>`<button data-period="${k}" class="${cur===k?'active':''}">${l}</button>`).join('')}</div>${periodBanner(cur)}`;
}
function periodBanner(p){
  const r=periodRange(p); if(!r) return '';
  const c=prevPeriodOf(p), cr=c?periodRange(c):null;
  const part=(p==='week'||p==='month')?' · <b>in progress</b> — totals keep growing until the period ends':'';
  return `<div class="pbanner"><b>${esc(PERIOD_WORD[p]?PERIOD_WORD[p].replace(/^./,x=>x.toUpperCase()):'Period')}</b> · ${esc(rangeText(r))}${cr?` <span class="dim">— compared with ${esc(PERIOD_WORD[c])}, ${esc(rangeText(cr))}</span>`:''}${part}</div>`;
}
function fieldInput(f, val){
  if(f.combo) return comboField(f, val);
  const has = val!==undefined && val!==null;
  if(f.type==='vehicle'){
    const req=f.required&&STATE.data.vehicles.length;
    return `<div><label>${f.label}</label><select name="${f.key}" ${req?'required':''}><option value="">Select truck…</option>${STATE.data.vehicles.map(v=>`<option value="${v.id}" ${has&&val===v.id?'selected':''}>${esc(v.regNo)}</option>`).join('')}</select></div>`;
  }
  if(f.type==='select'){
    return `<div><label>${f.label}</label><select name="${f.key}" ${f.required?'required':''}>${f.options.map(o=>{ const v=Array.isArray(o)?o[0]:o, l=Array.isArray(o)?o[1]:o; return `<option value="${esc(v)}" ${has&&String(val)===String(v)?'selected':''}>${esc(l)}</option>`; }).join('')}</select></div>`;
  }
  return `<div><label>${f.label}${f.unit?` (${f.unit})`:''}</label><input type="${f.type}" name="${f.key}" ${f.step?`step="${f.step}"`:''} ${f.list?`list="${f.list}"`:''} ${f.required?'required':''} placeholder="${f.placeholder||''}" ${has?`value="${esc(val)}"`:''}></div>`;
}

/* Weeks run Monday–Sunday everywhere. n = whole weeks since epoch for dated weeks. */
function wkStart(s){ const x=new Date(s+'T00:00:00'); x.setDate(x.getDate()-((x.getDay()+6)%7)); return isoLocal(x); }
function wkStartNear(s){ return new Date(s+'T00:00:00').getDay()===0 ? addDays(s,1) : wkStart(s); }

function normalizeHsseWeeks(sc){ if(!sc||!sc.weeks) return; sc.weeks.forEach(w=>{ if(w.start && new Date(w.start+'T00:00:00').getDay()!==1){ w.start=wkStartNear(w.start); w.n=ordOf(w.start); w.label='Week of '+w.start; w.range=wkLabel({start:w.start}); } }); sc.weeks.sort((a,b)=>a.n-b.n); }
function prevWeekStart(){ return addDays(wkStart(isoLocal(new Date())),-7); }
function ordOf(s){ return Math.floor((Date.parse(s+'T00:00:00Z')/864e5-4)/7); }

function wkLabel(w){ if(!w||!w.start) return (w&&(w.label||('Week '+w.n)))||''; const o={day:'numeric',month:'short'}; return new Date(w.start+'T00:00:00').toLocaleDateString(undefined,o)+' – '+new Date(addDays(w.start,6)+'T00:00:00').toLocaleDateString(undefined,{...o,year:'numeric'}); }
function weekFromTitle(s){ s=String(s||'').replace(/_/g,' '); const M='jan feb mar apr may jun jul aug sep oct nov dec'.split(' ');

  const mo=M.indexOf((m[2]||m[4]).slice(0,3).toLowerCase()); if(mo<0) return '';
  return wkStartNear(`${m[5]||new Date().getFullYear()}-${String(mo+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`); }
const TIER_TAG = {CRITICAL:'red', HIGH:'amber', MODERATE:'teal', LOW:'green'};

function bandOf(s){ return s>=5?'RED':(s>=2?'AMBER':'GREEN'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function normName(s){ return String(s||'').toUpperCase().replace(/[^A-Z\s]/g,' ').replace(/\s+/g,' ').trim(); }
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
function tokEq(a,b){ if(a===b) return true; return a.length>=4 && b.length>=4 && Math.abs(a.length-b.length)<=1 && lev(a,b)<=1; }
function sameDriver(a,b){
  const A=normName(a).split(' ').filter(x=>x.length>1), B=normName(b).split(' ').filter(x=>x.length>1);
  if(!A.length||!B.length) return false;
  let m=0; A.forEach(x=>{ if(B.some(y=>tokEq(x,y))) m++; });
  return m>=Math.min(2,A.length,B.length);
}
function parseLooseDate(s){

  const yr=s.match(/\b(20\d{2})\b/); const mo=s.match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*/i);

  const mi=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(mo[1].toLowerCase())+1;
  return `${yr[1]}-${String(mi).padStart(2,'0')}-${before[before.length-1].padStart(2,'0')}`;

function inspectionIssues(x){

function parseHsseWorkbook(wb,fname){

  const C=(v,n)=>S(v).slice(0,n||400);
  const N=v=>{ if(v===null||v===undefined||v==='') return null; const x=parseFloat(v); return isNaN(x)?null:x; };
  const R=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true});
  const out={weeks:[],priority:{},actions:{individual:[],category:[],monitoring:[]},incidents:[],inspections:[],ppe:[],toolbox:[],weekly:[],monthly:[],training:[],drills:[],contractors:[]};
  const names=wb.SheetNames;
  const headerAt=(rows,re,col)=>rows.findIndex(r=>re.test(S(r[col||0])));

      if(o.t===undefined) o.t=['hbs','has','oss','hoss'].reduce((a,k)=>a+(o[k]||0),0);
      o.t=Math.round(o.t*1000)/1000;
      const v=[]; if((o.hb||0)>0||(o.hbs||0)>0) v.push('HB'); if((o.ha||0)>0||(o.has||0)>0) v.push('HA'); if((o.os||0)>0||(o.oss||0)>0) v.push('OS'); if((o.hos||0)>0||(o.hoss||0)>0) v.push('HOS');

    const num=parseInt((n.match(/week\s*(\d+)/i)||[])[1],10);
    const range=((n.match(/\(([^)]+)\)/)||[])[1])||'';
    if(drivers.length && !isNaN(num)) out.weeks.push({n:num,label:'Week '+num,range,drivers});
  });
  // IVMS driver scorecard. Found by its content (a "Driver" column + a distance column) so it works whatever the sheet is
  // called ("Driver Scorecard Data", "driver scorecard", "Week 42 scorecard"…) and whichever column wording the IVMS export uses.
  const durSec=v=>{ if(v===null||v===undefined||v==='') return 0; if(typeof v==='number') return v<1?Math.round(v*86400):v;
    const m=String(v).trim().match(/^(\d+):(\d{2})(?::(\d{2}))?$/); if(m) return m[3]!==undefined?(+m[1])*3600+(+m[2])*60+(+m[3]):(+m[1])*60+(+m[2]); const x=parseFloat(v); return isNaN(x)?0:x; };
  const iso3=(y,m,d)=>y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const weekFromDates=t=>{ const m=String(t||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})\s*(?:to|-|–)\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m?wkStartNear(iso3(m[3],m[2],m[1])):''; };
  const sn=names.find(x=>/^summary$/i.test(x)); const sRows=sn?R(sn):[];
  const sv=(re,def)=>{ const r=sRows.find(x=>re.test(S(x[0]))); const v=r?N(r[1]):null; return v||def; };
  const minKm=sv(/minimum distance/i,20), hosSec=sv(/hos seconds/i,600);
  names.filter(n=>!/week\s*\d+\s*raw/i.test(n) && !/high\s*risk|obc|corrective action|top\s*5|^summary$|capa|instructions|dashboard/i.test(n)).forEach(n=>{
    const rows=R(n); const hi=headerAt(rows,/^driver( name)?$/i); if(hi<0) return;
    const hdr=rows[hi].map(h=>S(h).toLowerCase()); const g=re=>colIdx(hdr,re);
    if(g(/^distance/)<0) return;
    const c={d:g(/^distance/),hb:g(/harsh\s*brak\w*\s*pts/),ha:g(/harsh\s*accel\w*\s*pts/),osp:g(/over-?\s*speed\w*\s*pts/),os:g(/over-?\s*speed\w*\s*(\(sec|dur)/),hosp:g(/^hos\s*pts/),hos:g(/^hos\s*(over|dur)/),rt:g(/reported total|total penalty/),pr:g(/^profile/),el:g(/ranking eligible/)};
    const title=rows.slice(0,hi).map(r=>S(r[0])).join(' ');
    const cand=[weekFromTitle(title),weekFromDates(S((sRows[1]||[])[0])),weekFromTitle(S((sRows[0]||[])[0])),weekFromTitle(fname)];
    const start=cand.find(x=>x&&x<=todayStr())||prevWeekStart();
    const drivers=[]; const v=(r,k)=>c[k]>=0?(N(r[c[k]])||0):0;
    for(let i=hi+1;i<rows.length;i++){
      const r=rows[i]; const nm=S(r[0]); if(!nm || /^(fleet\s*total|total|average|fleet|summary)/i.test(nm)) continue;
      const o={n:nm,d:v(r,'d'),hb:v(r,'hb'),ha:v(r,'ha'),osp:v(r,'osp'),os:c.os>=0?durSec(r[c.os]):0,hosp:v(r,'hosp'),hos:c.hos>=0?durSec(r[c.hos]):0,rt:v(r,'rt'),pr:c.pr>=0?C(r[c.pr],60):''};
      o.t=o.d>0?Math.round((o.hb+o.ha+o.osp+o.hosp)/o.d*1e5)/1e3:0;
      if(o.d<minKm || (c.el>=0 && /^no/i.test(S(r[c.el])))) o.na=1;
      if(o.hosp>0 && o.hos>0 && o.hosp!==Math.floor(o.hos/hosSec)) o.chk=1;   // points not supported by recorded duration: verify against raw IVMS log
      drivers.push(o);
    }
    if(drivers.length){ const w={n:ordOf(start),start,label:'Week of '+start,range:wkLabel({start}),drivers}; const i=out.weeks.findIndex(x=>x.n===w.n); if(i>-1) out.weeks[i]=w; else out.weeks.push(w); }
  });
  out.weeks.sort((a,b)=>a.n-b.n);

  // high risk / OBC violators -> violation types (attach to the latest scorecard week) + priority flags
  names.filter(n=>/high\s*risk|obc/i.test(n)).forEach(n=>{
    const rows=R(n); const last=out.weeks[out.weeks.length-1];
    let mode='';
    rows.forEach(r=>{
      const a=S(r[0]);
      if(/^section a/i.test(a)){ mode='A'; return; } if(/^section b/i.test(a)){ mode='B'; return; }
      if(!a || /^driver name$/i.test(a)) return;
      if(mode==='A'){ out.priority[normName(a)]={rep:/^yes/i.test(S(r[6])),p:C(r[7],80)}; }
      if(mode==='B' && last){
        const types=S(r[3]); const v=[]; if(/brak/i.test(types)) v.push('HB'); if(/accel/i.test(types)) v.push('HA'); if(/speed/i.test(types)) v.push('OS'); if(/hos/i.test(types)) v.push('HOS');
        const d=last.drivers.find(x=>normName(x.n)===normName(a)); if(d && v.length) d.v=v;
      }
    });
  });

  // corrective action plan (as written in the report)
  names.filter(n=>/corrective action plan/i.test(n)).forEach(n=>{
    let mode='';
    R(n).forEach(r=>{
      const a=S(r[0]);
      if(/^section a/i.test(a)){ mode='A'; return; } if(/^section b/i.test(a)){ mode='B'; return; } if(/^section c/i.test(a)){ mode='C'; return; }
      if(!a) return;
      if(mode==='A' && !/^driver name$/i.test(a)) out.actions.individual.push({n:a,score:N(r[1]),issue:C(r[2]),action:C(r[3],600),owner:C(r[4]),when:C(r[5]),target:C(r[6])});
      else if(mode==='B' && !/^violation category$/i.test(a)) out.actions.category.push({cat:a,drivers:N(r[1]),cause:C(r[2]),action:C(r[3],600),owner:C(r[4]),when:C(r[5])});
      else if(mode==='C') out.actions.monitoring.push(C(a.replace(/^[•\-\s]+/,''),500));
    });
  });

  // generic table helper: header row identified by regex on first column
  const table=(sheetRe,firstRe,fn)=>{
    names.filter(n=>sheetRe.test(n)).forEach(n=>{
      const rows=R(n); const hi=headerAt(rows,firstRe); if(hi<0) return;
      const hdr=rows[hi].map(h=>S(h).toLowerCase());
      fn(rows.slice(hi+1),hdr);
    });
  };
  table(/incident register/i,/^incident id$/i,(rows,h)=>{
    const g=re=>colIdx(h,re);
    const ix={id:g(/incident id/),date:g(/^date/),loc:g(/location/),dept:g(/department/),type:g(/incident type/),sev:g(/severity/),desc:g(/description/),root:g(/root cause/),act:g(/corrective/),status:g(/status/),by:g(/reported/)};
    rows.forEach(r=>{ if(!S(r[ix.id])&&!S(r[ix.desc])) return; out.incidents.push({id:S(r[ix.id]),date:S(r[ix.date]),iso:parseLooseDate(r[ix.date]),loc:C(r[ix.loc],120),dept:C(r[ix.dept],60),type:C(r[ix.type],80),sev:C(r[ix.sev],40),desc:C(r[ix.desc],500),root:C(r[ix.root],300),act:C(r[ix.act],300),status:C(r[ix.status],40),by:C(r[ix.by],80)}); });
  });
  table(/vehicle hsse inspection/i,/^date$/i,(rows)=>{
    // Date labels appear on the first row of each block (or alone on a row after an undated block).
    let cur='', pending=[];
    rows.forEach(r=>{
      const a=S(r[0]), v=S(r[1]);
      if(a && !v){ pending.forEach(x=>{ x.date=a; x.iso=parseLooseDate(a); }); pending=[]; cur=a; return; }
      if(!v) return;
      if(a){ cur=a; pending=[]; }
      const rec={date:a||cur,iso:parseLooseDate(a||cur),veh:C(v,30),drv:C(r[2],60),brake:C(r[3],60),tyre:C(r[4],60),wedge:C(r[5],80),jack:C(r[6],80),spanner:C(r[7],60),fire:C(r[8],60),tape:C(r[9],60),aid:C(r[10],60),road:C(r[11],60),rem:C(r[12],160)};
      if(!rec.date) pending.push(rec);

    });
  });
  table(/ppe/i,/^inspection id$/i,(rows,h)=>{
    const g=re=>colIdx(h,re);
    rows.forEach(r=>{ if(!S(r[0])&&!S(r[3])) return; out.ppe.push({period:C(r[g(/period|preriod/)],60),loc:C(r[g(/location/)],60),type:C(r[g(/ppe type/)],60),status:C(r[g(/compliance status/)],40),detail:C(r[g(/non-compliance/)],200),act:C(r[g(/corrective/)],200)}); });
  });
  table(/toolbox/i,/^date$/i,(rows)=>{
    rows.forEach(r=>{ if(!S(r[1])) return; out.toolbox.push({date:C(r[0],60),iso:parseLooseDate(r[0]),topic:C(r[1],120),by:C(r[2],60),dept:C(r[3],60),att:N(r[4])||0,obs:C(r[5],160)}); });
  });
  table(/weekly hsse/i,/^week$/i,(rows)=>{
    rows.forEach(r=>{ if(!S(r[0])) return; out.weekly.push({week:C(r[0],30),date:C(r[1],40),dept:C(r[2],40),inc:C(r[3],60),lti:C(r[4],30),acts:C(r[5],200),cond:C(r[6],200),tbt:C(r[7],120),insp:C(r[8],60),ca:C(r[9],200),comp:C(r[10],60),rem:C(r[11],200)}); });
  });
  table(/monthly hsse/i,/^month$/i,(rows)=>{
    rows.forEach(r=>{ if(!S(r[0])||!S(r[1])) return; out.monthly.push({month:C(r[0],30),dept:C(r[1],40),inc:N(r[2]),lti:N(r[3]),nm:N(r[4]),train:N(r[5]),audit:N(r[6]),ca:N(r[7]),fleet:N(r[8]),spill:N(r[9]),env:N(r[10])}); });
  });
  table(/training matrix/i,/^employee name$/i,(rows)=>{
    rows.forEach(r=>{ if(!S(r[0])) return; out.training.push({n:C(r[0],60),dept:C(r[1],40),type:C(r[3],80),date:C(r[4],30),expiry:C(r[5],30),status:C(r[6],30)}); });
  });
  table(/emergency drill/i,/^drill id$/i,(rows)=>{
    rows.forEach(r=>{ if(!S(r[0])) return; out.drills.push({id:C(r[0],80),date:C(r[1],30),scen:C(r[2],120),pax:N(r[3]),resp:C(r[4],40),obs:C(r[5],160),imp:C(r[6],160)}); });
  });
  table(/contractor/i,/^contractor name$/i,(rows)=>{
    rows.forEach(r=>{ if(!S(r[0])) return; out.contractors.push({n:C(r[0],60),svc:C(r[1],60),ind:C(r[2],60),comp:N(r[3]),inc:N(r[4])}); });
  });
